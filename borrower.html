/* Finance Master — vivid 3D glass UI refresh (preserves existing flows and data) */
:root{--navy:#101c33;--gold:#f5c96b;--bg:#edf4ff;--ink:#14213d;--muted:#697a98;--line:#dce7f7;--green:#08a878;--red:#e84b4b}
body{background:radial-gradient(ellipse at 8% 0%,#d8f8ef 0,transparent 34%),radial-gradient(ellipse at 96% 10%,#d9e7ff 0,transparent 34%),linear-gradient(145deg,#f4f8ff,#eaf1ff 55%,#f4fbf6);background-attachment:fixed}
.wrap{max-width:1000px;padding-top:24px}
.logo{background:linear-gradient(145deg,#fff0b6 0%,#f7c75e 48%,#d99a27 100%);box-shadow:inset 0 2px 2px #fff9,0 8px 18px #c28b2b44;transform:translateY(-1px)}

.panel{background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(246,250,255,.92));border:1px solid rgba(255,255,255,.96);border-radius:23px;box-shadow:0 12px 28px #1c376018,0 3px 7px #1c37600b,inset 0 1px 0 #fff;backdrop-filter:blur(14px)}
.head h1{letter-spacing:-.7px}
.tag{background:linear-gradient(135deg,#d8fff0,#b6f3dc);color:#087a5b;border:1px solid #a7e9d1;box-shadow:0 4px 10px #08a87818}
.metric{position:relative;overflow:hidden;border:1px solid #fff;border-radius:19px;background:linear-gradient(145deg,#fff 0%,#f0f7ff 100%);box-shadow:0 7px 15px #24457412,inset 0 1px 0 #fff;transition:transform .22s ease,box-shadow .22s ease}
.metric:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:0 8px 8px 0;background:linear-gradient(180deg,#25d6ae,#3894ff,#f5c96b)}
.metric:hover{transform:translateY(-3px);box-shadow:0 13px 23px #24457420,inset 0 1px 0 #fff}
.metric small{color:#667796;font-weight:700}
.metric b{color:#14213d;letter-spacing:-.35px}
.btn{background:linear-gradient(135deg,#142747,#24518b);box-shadow:0 7px 0 #0d1b32,0 12px 20px #173b702b,inset 0 1px 0 #ffffff35;transition:transform .15s ease,box-shadow .15s ease}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #0d1b32,0 5px 10px #173b7020}
.btn.secondary{background:linear-gradient(145deg,#fff,#edf4ff);box-shadow:0 5px 12px #173b7010,inset 0 1px 0 #fff}
.notice{background:linear-gradient(135deg,#fff8d9,#fff0b7);border:1px solid #f4d36f;border-radius:17px;box-shadow:0 8px 18px #b58b251c,inset 0 1px 0 #fff;color:#70521b}
.error,.success{border-radius:16px;box-shadow:0 6px 15px #1b31500b}
.success{background:linear-gradient(135deg,#e0fff2,#bdf5dd);border-color:#a1e8ca;color:#08684e}
.error{background:linear-gradient(135deg,#fff0e9,#ffe0d8);border-color:#ffc8b8;color:#9f2f26}
.field input,.field select,.field textarea{border-color:#d8e4f4;border-radius:13px;background:linear-gradient(145deg,#fff,#f7faff);box-shadow:inset 0 1px 2px #1b315009;outline:none}

function loanAlertMarkup(a){

 const reverse={};for(const l of Object.keys(dict)){reverse[l]={};for(const k of Object.keys(dict[l]))reverse[l][dict[l][k]]=k;}
 const getLang=()=>localStorage.getItem(key)||'en';
 function tr(text,lang){const t=text.replace(/\s+/g,' ').trim();if(!t)return text;let base=t;for(const l of Object.keys(reverse)){if(reverse[l][base]){base=reverse[l][base];break;}}const out=(dict[lang]&&dict[lang][base])||base;return text===t?out:text.replace(t,out);}
 function apply(root){const lang=getLang();document.documentElement.lang=lang;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){if(!n.parentElement||['SCRIPT','STYLE'].includes(n.parentElement.tagName))continue;const out=tr(n.nodeValue,lang);if(out!==n.nodeValue)n.nodeValue=out;}root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>['placeholder','title','aria-label'].forEach(a=>{const v=el.getAttribute(a);if(v){const out=tr(v,lang);if(out!==v)el.setAttribute(a,out);}}));root.querySelectorAll('option').forEach(el=>{if(el.closest('#languageSelect'))return;const v=el.textContent;const out=tr(v,lang);if(out!==v)el.textContent=out;});}
 function setup(){const sel=document.getElementById('languageSelect');if(sel){sel.value=getLang();sel.addEventListener('change',()=>{localStorage.setItem(key,sel.value);apply(document.body);});}apply(document.body);const ob=new MutationObserver(ms=>{for(const m of ms){if(m.type==='childList')apply(m.target.nodeType===1?m.target:document.body);else if(m.type==='characterData')apply(m.target.parentElement||document.body);}});ob.observe(document.body,{subtree:true,childList:true,characterData:true});}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup);else setup();
})();
</script>
<script>
(function(){
 const viewer=document.getElementById('loanFullscreenViewer');
 const content=document.getElementById('loanFullscreenContent');
 const heading=document.getElementById('loanFullscreenHeading');
 const close=()=>{viewer.classList.remove('open');document.body.classList.remove('loan-fullscreen-open');content.innerHTML='';};
 document.getElementById('loanFullscreenBack')?.addEventListener('click',close);
 document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&viewer.classList.contains('open'))close();});
 document.addEventListener('click',ev=>{
  const trigger=ev.target.closest('[data-loan-fullscreen]');
  if(!trigger)return;
  const card=trigger.closest('article.panel');
  if(!card)return;

  clone.querySelectorAll('.loan-detail-toggle').forEach(d=>{d.open=true;const summary=d.querySelector('summary');if(summary)summary.remove();});

<script>
(function(){
 let borrowerInstallPrompt=null;
 window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();borrowerInstallPrompt=ev;const b=document.getElementById('installBorrowerApp');if(b)b.textContent='📲 Install App';});
 window.addEventListener('appinstalled',()=>{borrowerInstallPrompt=null;const b=document.getElementById('installBorrowerApp');if(b)b.textContent='✓ Installed';const h=document.getElementById('borrowerInstallHelp');if(h)h.textContent='Home Screen မှာ Install လုပ်ပြီးပါပြီ။';});
 const escHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function showPage(page){
  document.querySelectorAll('.share-page').forEach(el=>{const on=el.dataset.sharePage===page;el.hidden=!on;el.style.display=on?'block':'none';});
  document.querySelectorAll('[data-share-tab]').forEach(el=>{const on=el.dataset.shareTab===page;el.classList.toggle('active',on);el.setAttribute('aria-current',on?'page':'false');});
  document.body.classList.toggle('chat-mode',page==='chat');window.scrollTo({top:0,behavior:'auto'});
 }
 const borrowerSessionStartedAt=new Date();
 function getBorrowerDeviceModel(){
  try{
   const ua=navigator.userAgent||'';
   const model=navigator.userAgentData&&navigator.userAgentData.model;
   if(model&&String(model).trim())return String(model).trim();
   const samsung=ua.match(/\b(SM-[A-Z0-9-]+)\b/i);if(samsung)return 'Samsung '+samsung[1].toUpperCase();
   if(/iPhone/i.test(ua))return 'iPhone';
   if(/iPad/i.test(ua))return 'iPad';
   if(/Pixel/i.test(ua)){const p=ua.match(/(Pixel\s?[A-Za-z0-9 ]*)/i);return p?p[1].trim():'Google Pixel';}
   if(/Android/i.test(ua))return 'Android phone (exact model hidden by browser)';
   return /Windows/i.test(ua)?'Windows device':/Macintosh|Mac OS/i.test(ua)?'Mac device':/Linux/i.test(ua)?'Linux device':'Device model unavailable';
  }catch(e){return 'Device model unavailable';}
 }
 function formatBorrowerLoginTime(date){
  try{return new Intl.DateTimeFormat('en-GB',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(date);}
  catch(e){return date.toLocaleString();}
 }
 function accountMarkup(){
  const name=String(share?.borrowerName||share?.snapshot?.person||document.querySelector('#app [data-share-page="summary"] .head h1')?.textContent?.trim()||'Borrower').trim();
  const model=getBorrowerDeviceModel();
  const loginTime=formatBorrowerLoginTime(borrowerSessionStartedAt);
  const savedPhone=String(share?.borrowerPhone||share?.snapshot?.borrowerPhone||share?.snapshot?.accounts?.find(a=>a.borrowerPhone)?.borrowerPhone||'').trim();
  const phoneDisplay=savedPhone||'ဖုန်းနံပါတ် မထည့်ရသေးပါ';
  const rows=[
   {icon:'👤',label:'Name',value:name},
   {icon:'📱',label:'Model',value:model},
   {icon:'🕒',label:'Login Time',value:loginTime},
   {icon:'🟢',label:'Session status',value:'Active · လက်ရှိ Share Link ကို ဖွင့်ထားသည်',status:true},
   {icon:'☎️',label:'Phone',value:phoneDisplay,muted:!savedPhone}
  ];
  const rowHtml=rows.map((r,i)=>'<div style="display:grid;grid-template-columns:38px minmax(0,1fr);gap:11px;align-items:center;padding:13px 2px;'+(i===rows.length-1?'':'border-bottom:1px solid #e8edf4;')+'"><div style="width:36px;height:36px;border-radius:12px;background:'+(r.status?'#e8f8f1':'#f0f4fa')+';display:flex;align-items:center;justify-content:center;font-size:18px">'+r.icon+'</div><div style="min-width:0"><div style="font-size:12px;letter-spacing:.2px;font-weight:700;color:#728096;margin-bottom:4px">'+escHtml(r.label)+'</div><div style="font-size:14px;font-weight:750;line-height:1.5;color:'+(r.status?'#087f66':r.muted?'#8792a3':'#172b49')+';overflow-wrap:anywhere">'+escHtml(r.value)+'</div></div></div>').join('');
  return '<section style="border:1px solid #e2e8f0;border-radius:18px;padding:5px 16px;background:linear-gradient(145deg,#fff,#f8faff);box-shadow:0 8px 24px rgba(18,39,70,.07)">'+rowHtml+'</section><section style="margin-top:10px;border:1px solid #e2e8f0;border-radius:16px;padding:14px;background:#fff"><p style="margin:0 0 10px;font-size:12px;color:#728096;line-height:1.5">Phone နံပါတ်ကို ဒီနေရာမှာ ထည့်/ပြင်နိုင်ပါတယ်။ Browser က Google Drive/Google Account ထဲက ကိုယ်ရေးဖုန်းနံပါတ်ကို အလိုအလျောက် မဖတ်နိုင်ပါ။</p><form id="borrowerPhoneEditForm"><div class="field"><label for="borrowerPhoneEdit">Phone</label><input id="borrowerPhoneEdit" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="32" value="'+escHtml(savedPhone)+'" placeholder="+66 / 09xxxxxxxx"></div><button class="btn" id="saveBorrowerPhone" type="submit" style="margin-top:10px;width:100%">ဖုန်းနံပါတ် သိမ်းမည်</button><div id="borrowerPhoneSaveStatus" aria-live="polite" style="margin-top:8px;font-size:12px"></div></form></section>';
 }
 function refreshAccount(){const html=accountMarkup();const a=document.getElementById('borrowerMyAccountDetails');const b=document.getElementById('borrowerMyAccountFull');if(a)a.innerHTML=html;if(b)b.innerHTML=html;}
 document.addEventListener('submit',async ev=>{
  if(ev.target?.id!=='borrowerPhoneEditForm')return;
  ev.preventDefault();
  const input=document.getElementById('borrowerPhoneEdit'),button=document.getElementById('saveBorrowerPhone'),msg=document.getElementById('borrowerPhoneSaveStatus');
  const phone=String(input?.value||'').trim();
  if(phone.length>32){if(msg)msg.textContent='ဖုန်းနံပါတ်ကို စာလုံး ၃၂ လုံးထက် မပိုစေရပါ။';return;}
  if(!share?.id||!token){if(msg)msg.textContent='Share Link မမှန်ပါ။';return;}
  if(button)button.disabled=true;if(msg)msg.textContent='Saving…';
  try{
   await updateDoc(doc(db,'borrowerShares',token),{borrowerPhone:phone});
   share.borrowerPhone=phone;
   if(share.snapshot)share.snapshot.borrowerPhone=phone;
   if(msg){msg.textContent='ဖုန်းနံပါတ် သိမ်းဆည်းပြီးပါပြီ။';msg.style.color='#087f66';}
   refreshAccount();
  }catch(err){if(msg){msg.textContent='သိမ်းဆည်းမရပါ။ Share Link ကို ပြန်ဖွင့်ပြီး ထပ်ကြိုးစားပါ။';msg.style.color='#b42318';}}
  finally{if(button)button.disabled=false;}
 });
 document.addEventListener('click',async ev=>{
  const install=ev.target.closest('#installBorrowerApp');
  if(install){
   try{const currentToken=new URLSearchParams(location.search).get('token');if(currentToken)localStorage.setItem('finance-master-borrower-install-token-v1',currentToken);}catch(e){}
   const help=document.getElementById('borrowerInstallHelp');
   if(borrowerInstallPrompt){
    try{borrowerInstallPrompt.prompt();const choice=await borrowerInstallPrompt.userChoice;borrowerInstallPrompt=null;if(help)help.textContent=choice&&choice.outcome==='accepted'?'Home Screen မှာ Install လုပ်ရန် လက်ခံပြီးပါပြီ။':'Install မလုပ်ရသေးပါ။ Install ခလုတ်ကို ထပ်နှိပ်နိုင်ပါသည်။';}catch(e){if(help)help.textContent='Install Prompt မရသေးပါ။ Chrome မီနူးမှ Install app ကို ရွေးပါ။'}
   }else{
    if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){
     if(help)help.textContent='iPhone မှာ Safari → Share → Add to Home Screen ကို ရွေးပါ။ Browser က ခွင့်မပြုလို့ ဝဘ်ဆိုက်ကနေ အလိုအလျောက် Home Screen ထဲထည့်ပေးလို့ မရပါ။';
    }else if(/Android/i.test(navigator.userAgent)){
     if(help)help.textContent='ဒီ Browser မှာ တိုက်ရိုက် Install Prompt မရသေးပါ။ Chrome မှာဖွင့်ဖို့ ကြိုးစားနေပါတယ်။ Chrome ပွင့်လာရင် ⋮ → Install app / Add to Home screen ကို ရွေးပါ။';
     try{const u=new URL(location.href);const intent='intent://'+u.host+u.pathname+u.search+u.hash+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(location.href)+';end';location.href=intent;}catch(e){}
    }else if(help)help.textContent='ဒီ Browser မှာ Install prompt မရနိုင်သေးပါ။ Browser menu မှ Install app / Add to Home screen ကို ရွေးပါ။';
   }
  }
  const copy=ev.target.closest('#copyBorrowerInstallLink');
  if(copy){const inp=document.getElementById('borrowerInstallLink');try{await navigator.clipboard.writeText(inp.value);copy.textContent='✓ Link ကူးယူပြီးပါပြီ';}catch(e){inp.focus();inp.select();try{document.execCommand('copy');copy.textContent='✓ Link ကူးယူပြီးပါပြီ';}catch(_){}}}
  if(ev.target.closest('#openMyAccount')){refreshAccount();showPage('account');}
  const tab=ev.target.closest('[data-share-tab]');if(tab&&['settings','account'].includes(tab.dataset.shareTab))showPage(tab.dataset.shareTab);
 });
 window.addEventListener('borrower-share-loaded',refreshAccount);
 setTimeout(refreshAccount,700);
})();
</script>
