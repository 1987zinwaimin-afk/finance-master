/* Borrower share link: separate account sections with a fixed bottom tab bar */
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.wrap{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.share-page[hidden]{display:none!important}
.share-page{animation:sharePageIn .16s ease-out}
@keyframes sharePageIn{from{opacity:.65;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.share-bottom-nav{position:fixed;z-index:1000;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid #e2e7ef;box-shadow:0 -6px 22px #1720330c;backdrop-filter:blur(14px)}

.share-bottom-nav button span{font-size:20px;line-height:1.1}

@media(max-width:420px){.wrap{padding:10px 10px calc(88px + env(safe-area-inset-bottom))}.share-bottom-nav{gap:2px;padding-left:5px;padding-right:5px}.share-bottom-nav button{min-height:52px}.share-bottom-nav button small{font-size:9px}}

<body><main class="wrap">
<div class="brand"><div class="logo">F</div><div class="brand-title"><b>Finance Master</b><small>PRIVATE BORROWER PORTAL</small></div><label class="language-wrap"><span id="languageLabel">Language</span><select id="languageSelect" aria-label="Language"><option value="my">မြန်မာ</option><option value="en">English</option><option value="th">ไทย</option></select></label></div>
<div id="status" class="status muted">Loading your private account…</div>
<div id="app"></div>
<footer>Read-only account access · Payment requests require owner approval</footer>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getFirestore,doc,getDoc,addDoc,collection,serverTimestamp,onSnapshot} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDCNyu8OFTZ2gAxq5lCbpTDd_bUTyO8Rr0",authDomain:"finance-master-8d227.firebaseapp.com",projectId:"finance-master-8d227",storageBucket:"finance-master-8d227.firebasestorage.app",messagingSenderId:"881817485868",appId:"1:881817485868:web:2135de290e0a1150274789"};
const db=getFirestore(initializeApp(firebaseConfig));
const token=new URLSearchParams(location.search).get("token")||"";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=(v,c)=>{try{return new Intl.NumberFormat("en-US",{style:"currency",currency:["THB","MMK","USD","SGD"].includes(c)?c:"THB",maximumFractionDigits:2}).format(Number(v)||0)}catch(e){return String(v??0)}};
const today=()=>new Date().toISOString().slice(0,10);
let share=null,stopChat=null,chatMessages=[];
function setStatus(text,type="muted"){ $("status").className="status "+type;$("status").textContent=text;}
function selectedMonth(){return $("monthFilter")?.value||today().slice(0,7);}
let activeSharePage="summary";
function activateSharePage(page=activeSharePage){
 const allowed=["summary","statement","request","chat"];
 if(!allowed.includes(page))page="summary";
 activeSharePage=page;
 document.querySelectorAll(".share-page").forEach(el=>el.hidden=el.dataset.sharePage!==page);
 document.querySelectorAll("[data-share-tab]").forEach(el=>{const active=el.dataset.shareTab===page;el.classList.toggle("active",active);el.setAttribute("aria-current",active?"page":"false");});
 const active=document.querySelector('.share-page[data-share-page="'+page+'"]');
 if(active)active.scrollTop=0;
 window.scrollTo({top:0,behavior:"auto"});
}
document.addEventListener("click",e=>{const tab=e.target.closest("[data-share-tab]");if(tab)activateSharePage(tab.dataset.shareTab);});
function render(){
 const s=share.snapshot||{},c=share.currency||s.currency||"THB",month=selectedMonth();
 const buckets=Array.isArray(s.interestBuckets)?s.interestBuckets:[];
 const payments=Array.isArray(s.payments)?s.payments:[];
 const monthBuckets=buckets.filter(b=>String(b.date||"").slice(0,7)===month);
 const monthPayments=payments.filter(p=>String(p.date||"").slice(0,7)===month);
 const dueDate=s.due?esc(s.due):"Not set";
 $("app").innerHTML='<section class="panel share-page" data-share-page="summary"><div class="head"><div><span class="tag">Read only</span><h1>'+esc(share.borrowerName||s.person||"Borrower")+'</h1><p class="muted">Your personal loan account · '+esc(c)+'</p></div><div class="muted">Due date: <b>'+dueDate+'</b></div></div><div class="notice">You can view and check this account, filter records by month, and send a payment request to the owner. You cannot edit or delete loan records. Payments change the official balance only after the owner approves the request.</div></section>'+
 '<section class="panel share-page" data-share-page="summary"><h2 style="font-size:15px;margin-top:0">Loan summary</h2><div class="grid">'+metric("Original principal",money(s.principal,c))+metric("Principal remaining",money(s.principalOutstanding,c))+metric("Interest remaining",money(s.interestOutstanding,c))+metric("Monthly interest",money(s.monthlyInterest,c))+metric("Interest rate",String(s.rate||0)+"% · "+(s.period==="yearly"?"yearly":s.period==="none"?"no interest":"monthly"))+metric("Unpaid months",String(s.unpaidMonths||0))+metric("Monthly payment target",money(s.monthlyTarget||0,c))+'</div>'+(Number(s.monthlyTarget)>0?'<div class="notice" style="margin-top:12px">'+(Number(s.consecutiveUnderpaidMonths||0)>=3?'<b>3-month underpayment notice</b><br>သတ်မှတ်ငွေ မပြည့်တာ 3 လဆက်တိုက်ရှိပါပြီ။ အတိုးကို ပုံမှန်အတိုးနှုန်းအတိုင်း ပြန်လည်သတ်မှတ်ပါမည်။':'Monthly target: '+money(s.monthlyTarget,c)+'. Please pay at least the agreed amount each month.')+'</div>':'')+'</section>'+
 '<section class="panel share-page" data-share-page="statement"><div class="head"><div><h2 style="font-size:15px;margin:0 0 5px">Monthly statement</h2><p class="muted">Choose a month to inspect interest and payments.</p></div><div class="field" style="flex:0 1 180px"><label for="monthFilter">Month</label><input id="monthFilter" type="month" value="'+esc(month)+'"></div></div><h3 style="font-size:13px;margin-top:20px">Interest ledger</h3><div class="tablewrap"><table><thead><tr><th>Month due</th><th class="num">Interest</th><th class="num">Remaining</th><th>Status</th></tr></thead><tbody>'+(monthBuckets.length?monthBuckets.map(b=>'<tr><td>'+esc(b.date||month)+'</td><td class="num">'+money(b.original,c)+'</td><td class="num">'+money(b.remaining,c)+'</td><td>'+(Number(b.remaining)>0.004?'<span style="color:#a62d2d">Unpaid</span>':'<span style="color:#16866a">Paid</span>')+'</td></tr>').join(""):'<tr><td colspan="4" class="empty">No interest ledger entries for this month.</td></tr>')+'</tbody></table></div><h3 style="font-size:13px;margin-top:22px">Payments this month</h3><div class="tablewrap"><table><thead><tr><th>Date</th><th>Details</th><th class="num">Amount</th></tr></thead><tbody>'+(monthPayments.length?monthPayments.map(p=>'<tr><td>'+esc(p.date||"—")+'</td><td>'+esc(p.apply||"Payment")+(p.note?" · "+esc(p.note):"")+'</td><td class="num">'+money(p.amount,p.currency||c)+'</td></tr>').join(""):'<tr><td colspan="3" class="empty">No recorded payments for this month.</td></tr>')+'</tbody></table></div></section>'+
 '<section class="panel share-page" data-share-page="request"><h2 style="font-size:15px;margin-top:0">Send payment request</h2><p class="muted">This sends a notification to the owner. It does not immediately change your loan balance or payment history.</p><form id="requestForm"><div class="row"><div class="field"><label for="amount">Amount ('+esc(c)+')</label><input id="amount" name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label for="payDate">Expected payment date</label><input id="payDate" name="date" type="date" value="'+today()+'" required></div></div><div class="field" style="margin-top:12px"><label for="apply">Payment type requested</label><select id="apply" name="apply"><option value="auto">Automatic — interest first, then principal</option><option value="interest">Interest only</option><option value="principal">Principal only</option></select></div><div class="field" style="margin-top:12px"><label for="note">Note (optional)</label><textarea id="note" name="note" rows="3" maxlength="500" placeholder="Transfer reference or message"></textarea></div><div style="margin-top:14px"><button class="btn" id="sendRequest" type="submit">Send request to owner</button></div></form><div id="requestResult" style="margin-top:12px"></div></section>';
 $("app").innerHTML += '<section class="panel share-page" data-share-page="chat"><h2 style="font-size:15px;margin-top:0">Message the owner</h2><p class="muted">Private chat with the owner. Send text messages and photos.</p><div id="borrowerChatMessages" class="chat-messages">'+(chatMessages.length?chatMessages.map(chatBubble).join(''):'<div class="empty">No messages yet.</div>')+'</div><form id="borrowerChatForm"><div class="field"><label for="borrowerChatText">Message</label><textarea id="borrowerChatText" rows="3" maxlength="3000" placeholder="Write to the owner…"></textarea></div><div class="row" style="margin-top:10px"><label class="btn secondary">＋ Photo<input id="borrowerChatPhoto" type="file" accept="image/*" hidden></label><button class="btn" id="sendChat" type="submit">Send message</button></div></form><div id="chatResult" style="margin-top:10px"></div></section>';
 $("app").innerHTML += '<nav class="share-bottom-nav" aria-label="Borrower account pages"><button type="button" data-share-tab="summary"><span>▤</span><small>Loan summary</small></button><button type="button" data-share-tab="statement"><span>▦</span><small>Monthly statement</small></button><button type="button" data-share-tab="request"><span>↗</span><small>Payment request</small></button><button type="button" data-share-tab="chat"><span>✉</span><small>Chat</small></button></nav>';
 activateSharePage();
 $("borrowerChatForm").addEventListener("submit",submitBorrowerChat);
 $("monthFilter").addEventListener("change",()=>{const m=selectedMonth();render();$("monthFilter").value=m;});
 $("requestForm").addEventListener("submit",submitRequest);
}
function chatBubble(m){const mine=m.senderRole==='borrower',name=mine?'You':'Owner',time=m.createdAtText||'';return '<div class="chat-line '+(mine?'mine':'theirs')+'"><div class="chat-bubble"><small>'+esc(name)+(time?' · '+esc(time):'')+'</small>'+(m.text?'<p>'+esc(m.text).replace(/\n/g,'<br>')+'</p>':'')+(m.imageData?'<a href="'+m.imageData+'" target="_blank" rel="noopener"><img class="chat-image" src="'+m.imageData+'" alt="Chat image"></a>':'')+'</div></div>';}
function startChat(){if(stopChat){stopChat();stopChat=null;}if(!share?.id)return;stopChat=onSnapshot(collection(db,'borrowerShares',token,'messages'),snap=>{chatMessages=snap.docs.map(d=>{const x=d.data();return {id:d.id,...x,createdAtText:x.createdAt?.toDate?.().toLocaleString?.()||''};}).sort((a,b)=>Number(a.createdAt?.seconds||0)-Number(b.createdAt?.seconds||0));const box=$('borrowerChatMessages');if(box){box.innerHTML=chatMessages.length?chatMessages.map(chatBubble).join(''):'<div class="empty">No messages yet.</div>';box.scrollTop=box.scrollHeight;}},err=>{const box=$('chatResult');if(box)box.innerHTML='<div class="error">Chat unavailable: '+esc(err.message||'Check database rules.')+'</div>';});}
async function compressChatImage(file){if(!file||!file.type.startsWith('image/'))throw new Error('Choose an image file.');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Could not read image.'));r.readAsDataURL(file);});const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error('Could not open image.'));i.src=data;});const scale=Math.min(1,1200/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let q=.72,result=canvas.toDataURL('image/jpeg',q);while(result.length>520000&&q>.35){q-=.08;result=canvas.toDataURL('image/jpeg',q);}if(result.length>600000)throw new Error('Photo is too large after compression.');return result;}
async function submitBorrowerChat(e){e.preventDefault();const textValue=$('borrowerChatText').value.trim(),file=$('borrowerChatPhoto').files?.[0];if(!textValue&&!file){$('chatResult').innerHTML='<div class="error">Write a message or choose a photo.</div>';return;}const btn=$('sendChat');btn.disabled=true;try{const imageData=file?await compressChatImage(file):'';await addDoc(collection(db,'borrowerShares',token,'messages'),{token,senderRole:'borrower',senderName:share.borrowerName||share.snapshot?.person||'Borrower',text:textValue.slice(0,3000),imageData,createdAt:serverTimestamp()});$('borrowerChatText').value='';$('borrowerChatPhoto').value='';$('chatResult').innerHTML='<div class="success">Message sent.</div>';}catch(err){$('chatResult').innerHTML='<div class="error">Could not send message: '+esc(err.message||'Check database rules.')+'</div>';}finally{btn.disabled=false;}}
function metric(label,value){return '<div class="metric"><small>'+esc(label)+'</small><b>'+esc(value)+'</b></div>';}
async function submitRequest(e){
 e.preventDefault();const button=$("sendRequest");button.disabled=true;$("requestResult").innerHTML="";
 const amount=Number($("amount").value),date=$("payDate").value,apply=$("apply").value,note=$("note").value.trim(),s=share.snapshot||{};
 if(!Number.isFinite(amount)||amount<=0||!date){$("requestResult").innerHTML='<div class="error">Enter a valid amount and date.</div>';button.disabled=false;return;}
 try{
  await addDoc(collection(db,"borrowerPaymentRequests"),{token,ownerUid:share.ownerUid,accountId:share.accountId,borrowerName:share.borrowerName||s.person||"Borrower",currency:share.currency||s.currency||"THB",amount,date,apply,note,status:"pending",createdAt:serverTimestamp(),schemaVersion:1});
  $("requestResult").innerHTML='<div class="success">Request sent to the owner. Your official loan balance will change only after approval.</div>';$("requestForm").reset();$("payDate").value=today();
 }catch(err){$("requestResult").innerHTML='<div class="error">Could not send the request. The link may have been revoked or database security rules may not be configured yet. '+esc(err.message||"")+'</div>';}
 button.disabled=false;
}
async function boot(){
 if(!token){setStatus("This borrower link is missing its access token.","error");return;}
 try{
  const snap=await getDoc(doc(db,"borrowerShares",token));
  if(!snap.exists()){setStatus("This link is invalid, unavailable, or has been revoked.","error");return;}
  share={id:snap.id,...snap.data()};
  if(!share.active){setStatus("This borrower link has been revoked. Contact the owner.","error");return;}
  if(!share.snapshot||!share.accountId||!share.ownerUid){setStatus("This account link is incomplete. Please contact the owner.","error");return;}
  setStatus("Private account loaded. Read-only access is active.","success");render();startChat();
 }catch(err){setStatus("Could not load this account. Firestore share-link rules may need to be configured. "+(err.message||""),"error");}
}
boot();
</script>

 const reverse={};for(const l of Object.keys(dict)){reverse[l]={};for(const k of Object.keys(dict[l]))reverse[l][dict[l][k]]=k;}
 const getLang=()=>localStorage.getItem(key)||'en';
 function tr(text,lang){const t=text.replace(/\s+/g,' ').trim();if(!t)return text;let base=t;for(const l of Object.keys(reverse)){if(reverse[l][base]){base=reverse[l][base];break;}}const out=(dict[lang]&&dict[lang][base])||base;return text===t?out:text.replace(t,out);}
 function apply(root){const lang=getLang();document.documentElement.lang=lang;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){if(!n.parentElement||['SCRIPT','STYLE'].includes(n.parentElement.tagName))continue;const out=tr(n.nodeValue,lang);if(out!==n.nodeValue)n.nodeValue=out;}root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>['placeholder','title','aria-label'].forEach(a=>{const v=el.getAttribute(a);if(v){const out=tr(v,lang);if(out!==v)el.setAttribute(a,out);}}));root.querySelectorAll('option').forEach(el=>{if(el.closest('#languageSelect'))return;const v=el.textContent;const out=tr(v,lang);if(out!==v)el.textContent=out;});}
 function setup(){const sel=document.getElementById('languageSelect');if(sel){sel.value=getLang();sel.addEventListener('change',()=>{localStorage.setItem(key,sel.value);apply(document.body);});}apply(document.body);const ob=new MutationObserver(ms=>{for(const m of ms){if(m.type==='childList')apply(m.target.nodeType===1?m.target:document.body);else if(m.type==='characterData')apply(m.target.parentElement||document.body);}});ob.observe(document.body,{subtree:true,childList:true,characterData:true});}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup);else setup();
})();
