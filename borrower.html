async function handleBankReceiptChange(event){const file=event.target.files?.[0];paymentReceiptImage="";const preview=$("bankReceiptPreview");if(!file||!preview)return;preview.innerHTML='<p class="muted">Compressing receipt image…</p>';try{const data=await compressChatImage(file);if(data.length>400000)throw new Error("Receipt image is too large. Please choose a smaller photo.");paymentReceiptImage=data;preview.innerHTML='<img src="'+data+'" alt="Transfer receipt preview"><p class="muted">Receipt ready to send.</p>';}catch(err){event.target.value="";preview.innerHTML='<div class="bank-transfer-error">'+esc(err.message||"Could not read the receipt image.")+'</div>';}}
async function submitRequest(e){
 e.preventDefault();const paymentMethod=$("paymentMethod").value,button=paymentMethod==="bank"?$("sendBankReceipt"):$("sendRequest");if(button)button.disabled=true;const resultTarget=paymentMethod==="bank"?$("bankReceiptStatus"):$("requestResult");if(resultTarget&&paymentMethod!=="bank")resultTarget.innerHTML="";
 const amountInput=$("amount"),dateInput=$("payDate");const amount=Number(amountInput?.value),date=String(dateInput?.value||"").trim(),apply=$("apply").value,note=$("note").value.trim(),s=share.snapshot||{};
 const validDate=/^\d{4}-\d{2}-\d{2}$/.test(date)&&!Number.isNaN(Date.parse(date+"T00:00:00"));
 if(!Number.isFinite(amount)||amount<=0||!validDate){resultTarget.innerHTML='<div class="error">Enter a valid amount and date.</div>';if(button)button.disabled=false;return;}
 if(paymentMethod==="bank"&&!bankQrShown){resultTarget.innerHTML='<div class="error">Tap Get Bank QR first and complete the bank transfer.</div>';if(button)button.disabled=false;return;}
 if(paymentMethod==="bank"&&!paymentReceiptImage){resultTarget.innerHTML='<div class="error">Please upload the transfer receipt before sending it to the owner.</div>';if(button)button.disabled=false;return;}
 try{
  const selectedAccountId=$("requestAccountId")?.value||share.accountId;const requestAccounts=Array.isArray(s.accounts)&&s.accounts.length?s.accounts:[s];const selectedAccount=requestAccounts.find(a=>a.accountId===selectedAccountId)||s;await addDoc(collection(db,"borrowerPaymentRequests"),{token,ownerUid:share.ownerUid,accountId:selectedAccountId,borrowerName:share.borrowerName||s.person||"Borrower",currency:selectedAccount.currency||share.currency||s.currency||"THB",amount,date,apply,note,paymentMethod,receiptImage:paymentMethod==="bank"?paymentReceiptImage:"",status:"pending",createdAt:serverTimestamp(),schemaVersion:1});
  if(paymentMethod==="bank"){const modal=$("bankQrModal");if(modal)modal.hidden=true;resultTarget.innerHTML="";$("requestForm").reset();$("payDate").value=today();setPaymentMethodUI();const target=$("borrowerRequestStatus");if(target)target.innerHTML='<div class="success">ငွေလွှဲပြေစာ ပို့ပြီးပါပြီ။ ခေတ္တခဏစောင့်ပေးပါ။<br>Transfer receipt sent. Please wait for the owner to review it.</div>';}else{resultTarget.innerHTML='<div class="success">Payment request sent. Please wait for the owner to review it.</div>';$("requestForm").reset();$("payDate").value=today();setPaymentMethodUI();}
 }catch(err){resultTarget.innerHTML='<div class="error">Could not send the request. The link may have been revoked or database security rules may need updating. '+esc(err.message||"")+'</div>';}
 if(button)button.disabled=false;
}
async function boot(){
 if(!token){setStatus("This borrower link is missing its access token.","error");return;}
 try{
  if(stopShareDoc)stopShareDoc();
  stopShareDoc=onSnapshot(doc(db,"borrowerShares",token),snap=>{
   if(!snap.exists()){setStatus("This link is invalid, unavailable, or has been revoked.","error");return;}
   const next={id:snap.id,...snap.data()};
   if(!next.active){share=next;setStatus("This borrower link has been revoked. Contact the owner.","error");return;}
   if(!next.snapshot||!next.accountId||!next.ownerUid){setStatus("This account link is incomplete. Please contact the owner.","error");return;}
   if(Array.isArray(next.snapshot.accounts)&&next.snapshot.accounts.length>1&&!Array.isArray(next.accountIds))next.accountIds=next.snapshot.accounts.map(a=>a.accountId);
   share=next;
   setStatus("Live account loaded · changes from the owner update automatically.","success");
   try{render();}catch(renderError){setStatus("Could not display the borrower account. "+(renderError?.message||String(renderError)),"error");console.error("Borrower render failed",renderError);return;}
   if(!shareListenersStarted){shareListenersStarted=true;startChat();startBorrowerRequestListener();}
  },err=>setStatus("Could not sync the latest owner records. "+(err.message||""),"error"));
 }catch(err){setStatus("Could not load this account. Firestore share-link rules may need to be configured. "+(err.message||""),"error");}
}
boot();;

(function(){

 const isStillLoading=()=>!!status&&/Loading your private account|သင့်သီးသန့်အကောင့်ကို ဖွင့်နေသည်|กำลังโหลดบัญชีส่วนตัว/.test(status.textContent||'');

  // Ignore failed images/fonts and other resource errors; they must not mask a

  if(status&&isStillLoading()){
   status.className='status error';
   var detail=String(e.message||'Unknown JavaScript error');
   var location=e.filename?(' ('+e.filename.split('/').pop()+':'+(e.lineno||'?')+')'):'';
   status.textContent='JavaScript အမှား: '+detail+location+'. Internet ချိတ်ဆက်မှုကို စစ်ပြီး Refresh လုပ်ပါ။';
  }
 });

  }
 });
 setTimeout(function(){
  if(isStillLoading()){

 },12000);
})();

 const getLang=()=>localStorage.getItem(key)||'en';
 function tr(text,lang){const t=text.replace(/\s+/g,' ').trim();if(!t)return text;let base=t;for(const l of Object.keys(reverse)){if(reverse[l][base]){base=reverse[l][base];break;}}const out=(dict[lang]&&dict[lang][base])||base;return text===t?out:text.replace(t,out);}
 function apply(root){const lang=getLang();document.documentElement.lang=lang;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){if(!n.parentElement||['SCRIPT','STYLE'].includes(n.parentElement.tagName))continue;const out=tr(n.nodeValue,lang);if(out!==n.nodeValue)n.nodeValue=out;}root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>['placeholder','title','aria-label'].forEach(a=>{const v=el.getAttribute(a);if(v){const out=tr(v,lang);if(out!==v)el.setAttribute(a,out);}}));root.querySelectorAll('option').forEach(el=>{if(el.closest('#languageSelect'))return;const v=el.textContent;const out=tr(v,lang);if(out!==v)el.textContent=out;});}
 function setup(){const sel=document.getElementById('languageSelect');if(sel){sel.value=getLang();sel.addEventListener('change',()=>{localStorage.setItem(key,sel.value);apply(document.body);});}apply(document.body);const ob=new MutationObserver(ms=>{for(const m of ms){if(m.type==='childList')apply(m.target.nodeType===1?m.target:document.body);else if(m.type==='characterData')apply(m.target.parentElement||document.body);}});ob.observe(document.body,{subtree:true,childList:true,characterData:true});}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup);else setup();
})();
</script>
