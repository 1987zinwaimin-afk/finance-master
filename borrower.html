/* Finance Master — vivid 3D glass UI refresh (preserves existing flows and data) */
:root{--navy:#101c33;--gold:#f5c96b;--bg:#edf4ff;--ink:#14213d;--muted:#697a98;--line:#dce7f7;--green:#08a878;--red:#e84b4b}
body{background:radial-gradient(ellipse at 8% 0%,#d8f8ef 0,transparent 34%),radial-gradient(ellipse at 96% 10%,#d9e7ff 0,transparent 34%),linear-gradient(145deg,#f4f8ff,#eaf1ff 55%,#f4fbf6);background-attachment:fixed}
.wrap{max-width:1000px;padding-top:24px}
.logo{background:linear-gradient(145deg,#fff0b6 0%,#f7c75e 48%,#d99a27 100%);box-shadow:inset 0 2px 2px #fff9,0 8px 18px #c28b2b44;transform:translateY(-1px)}

.panel{background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(246,250,255,.92));border:1px solid rgba(255,255,255,.96);border-radius:23px;box-shadow:0 12px 28px #1c376018,0 3px 7px #1c37600b,inset 0 1px 0 #fff;backdrop-filter:blur(14px)}
.head h1{letter-spacing:-.7px}
.tag{background:linear-gradient(135deg,#d8fff0,#b6f3dc);color:#087a5b;border:1px solid #a7e9d1;box-shadow:0 4px 10px #08a87818}
.metric{position:relative;overflow:hidden;border:1px solid #fff;border-radius:19px;background:linear-gradient(145deg,#fff 0%,#f0f7ff 100%);box-shadow:0 7px 15px #24457412,inset 0 1px 0 #fff;transition:transform .22s ease,box-shadow .22s ease}
.metric:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:0 8px 8px 0;background:linear-gradient(180deg,#25d6ae,#3894ff,#f5c96b)}
.metric:hover{transform:translateY(-3px);box-shadow:0 13px 23px #24457420,inset 0 1px 0 #fff}
.metric small{color:#667796;font-weight:700}
.metric b{color:#14213d;letter-spacing:-.35px}
.btn{background:linear-gradient(135deg,#142747,#24518b);box-shadow:0 7px 0 #0d1b32,0 12px 20px #173b702b,inset 0 1px 0 #ffffff35;transition:transform .15s ease,box-shadow .15s ease}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #0d1b32,0 5px 10px #173b7020}
.btn.secondary{background:linear-gradient(145deg,#fff,#edf4ff);box-shadow:0 5px 12px #173b7010,inset 0 1px 0 #fff}
.notice{background:linear-gradient(135deg,#fff8d9,#fff0b7);border:1px solid #f4d36f;border-radius:17px;box-shadow:0 8px 18px #b58b251c,inset 0 1px 0 #fff;color:#70521b}
.error,.success{border-radius:16px;box-shadow:0 6px 15px #1b31500b}
.success{background:linear-gradient(135deg,#e0fff2,#bdf5dd);border-color:#a1e8ca;color:#08684e}
.error{background:linear-gradient(135deg,#fff0e9,#ffe0d8);border-color:#ffc8b8;color:#9f2f26}
.field input,.field select,.field textarea{border-color:#d8e4f4;border-radius:13px;background:linear-gradient(145deg,#fff,#f7faff);box-shadow:inset 0 1px 2px #1b315009;outline:none}

 const target=$("borrowerRequestStatus");if(!target)return;

let borrowerRequestStatusBaselineReady=false;

function showBorrowerDecisionNotice(r){
 const approved=r.status==="approved",title=approved?"Payment request approved":"Payment request rejected";
 const detail=approved?"The owner accepted your payment request. Check your loan summary and payment history.":"The owner rejected your payment request. Your loan balance was not changed.";
 let notice=document.getElementById("borrowerDecisionNotice");

 notice.innerHTML='<div style="display:flex;align-items:flex-start;gap:10px"><span style="font-size:22px">'+(approved?'✓':'!')+'</span><div><strong>'+esc(title)+'</strong><div style="font-weight:400;margin-top:5px">'+esc(money(r.amount,r.currency||share.currency||"THB"))+' · '+esc(r.date||"")+'</div><div style="font-weight:400;margin-top:5px">'+esc(detail)+'</div>'+(r.rejectionReason?'<div style="margin-top:6px">Owner note: '+esc(r.rejectionReason)+'</div>':'')+'</div><button type="button" aria-label="Dismiss notification" style="margin-left:auto;background:transparent;border:0;color:#fff;font-size:22px;cursor:pointer" onclick="this.closest(\'#borrowerDecisionNotice\').remove()">×</button></div>';
}
function startBorrowerRequestListener(){
 if(stopBorrowerRequests){stopBorrowerRequests();stopBorrowerRequests=null;}
 borrowerRequestStatusBaselineReady=false;borrowerRequestPreviousStatuses.clear();
 if(!token||!share?.active)return;
 const statusAccountIds=Array.isArray(share.accountIds)&&share.accountIds.length?share.accountIds:[share.accountId||share.snapshot?.accountId].filter(Boolean);if(!statusAccountIds.length){const el=$("borrowerRequestStatus");if(el)el.innerHTML="";return;}const q=query(collection(db,"borrowerPaymentRequests"),where("token","==",token),where("accountId","in",statusAccountIds.slice(0,30)));
 stopBorrowerRequests=onSnapshot(q,snap=>{
  const items=snap.docs.map(d=>{const x=d.data();return {id:d.id,...x,createdAtText:formatRequestTime(x.createdAt),reviewedAtText:formatRequestTime(x.reviewedAt)}}).sort((x,y)=>String(y.date||"").localeCompare(String(x.date||"")));
  if(borrowerRequestStatusBaselineReady){for(const item of items){const previous=borrowerRequestPreviousStatuses.get(item.id);if(previous==="pending"&&(item.status==="approved"||item.status==="rejected"))showBorrowerDecisionNotice(item);}}
  for(const item of items)borrowerRequestPreviousStatuses.set(item.id,item.status||"pending");
  borrowerRequestStatusBaselineReady=true;
  renderBorrowerRequestStatus(items);
 },err=>{const el=$("borrowerRequestStatus");if(el)el.innerHTML='<div class="bank-transfer-error">Could not load payment request status. Refresh the link or contact the owner.</div>';});
}

function activateSharePage(page=activeSharePage){
 const allowed=["summary","request","chat","settings","account"];
 if(!allowed.includes(page))page="summary";
 activeSharePage=page;
 document.body.classList.toggle("chat-mode",page==="chat");
 const appRoot=document.getElementById("app");
 if(appRoot){document.querySelectorAll(".share-page").forEach(el=>{if(el.parentElement!==appRoot)appRoot.appendChild(el);});}
 document.querySelectorAll(".share-page").forEach(el=>{const show=el.dataset.sharePage===page;el.hidden=!show;el.style.display=show?(el.dataset.sharePage==="chat"?"flex":"block"):"none";});
 const requestedPage=document.querySelector('.share-page[data-share-page="'+page+'"]');
 if(page==="request"&&requestedPage&&!document.querySelector("#requestForm")){setStatus("Payment form could not be created. Please reload this borrower link and try again.","error");}
 if(page==="request"&&requestedPage){requestedPage.hidden=false;requestedPage.style.display="block";}
 document.querySelectorAll("[data-share-tab]").forEach(el=>{const active=el.dataset.shareTab===page;el.classList.toggle("active",active);el.setAttribute("aria-current",active?"page":"false");});
 const active=document.querySelector('.share-page[data-share-page="'+page+'"]');
 if(active)active.scrollTop=0;
 window.scrollTo({top:0,behavior:"auto"});
}

function ownerDataPanel(data){const d=data&&typeof data==='object'?data:{};const rows=[];if(d.phone)rows.push('<div class="owner-detail-row"><span>📱 Owner phone</span><a href="tel:'+esc(d.phone)+'">'+esc(d.phone)+'</a></div>');if(d.guarantorPhone)rows.push('<div class="owner-detail-row"><span>📱 Guarantor phone</span><a href="tel:'+esc(d.guarantorPhone)+'">'+esc(d.guarantorPhone)+'</a></div>');if(d.address)rows.push('<div class="owner-detail-row"><span>📍 Address</span><b>'+esc(d.address).replace(/\n/g,'<br>')+'</b></div>');if(d.remark)rows.push('<div class="owner-detail-row"><span>Remark</span><p>'+esc(d.remark).replace(/\n/g,'<br>')+'</p></div>');return '<section class="panel share-page owner-public-panel" data-share-page="summary"><h2>Owner Data</h2><p class="muted">Contact and payment details provided by the account owner.</p>'+(rows.length?rows.join(''):'<div class="empty">Owner contact and bank details have not been added yet.</div>')+'</section>';}
function loanAlertMarkup(a){

 const target=Math.max(0,Number(a.monthlyTarget)||0);
 const statuses=Array.isArray(a.monthlyTargetStatuses)?a.monthlyTargetStatuses:[];
 const shortfalls=statuses.filter(x=>x.under||Number(x.paid)+0.004<target);
 const consecutive=Number(a.consecutiveUnderpaidMonths)||0;
 let html="";
 if(paused) html+='<div class="notice"><b>အတိုးရပ်ထားသည်</b><br>အတိုးနှုန်းနှင့် အတိုးကျန်ငွေကို ယာယီဖျောက်ထားသည်။</div>';
 if(target>0){

 if(consecutive>=3) html+='<div class="notice" role="alert" style="margin:14px 0;padding:18px;border:3px solid #dc2626;background:#fff1f2;color:#991b1b;border-radius:14px;box-shadow:0 4px 16px rgba(220,38,38,.18);font-size:17px;line-height:1.7"><div style="font-size:24px;font-weight:900;margin-bottom:8px">⚠️ အရေးကြီး သတိပေးချက်</div><b>လစဉ်သတ်မှတ်ငွေ ၃ လတိတိ မပြည့်ပါက အတိုးအား ပုံမှန်အတိုင်း ပြန်လည်သတ်မှတ်ပါမည်။</b><div style="margin-top:8px;font-size:14px">သတ်မှတ်ငွေကို ၃ လဆက်တိုက် မပြည့်မီထားပါသည်။ အတိုးနှုန်းကို ပြန်လည်သတ်မှတ်နိုင်ကြောင်း သတိပြုပါ။</div></div>';
 else if(consecutive>0) html+='<div class="notice" role="status" style="margin:12px 0;padding:14px;border:2px solid #d97706;background:#fffbeb;color:#92400e;border-radius:12px;font-weight:700">⚠️ သတိပေးချက် — လစဉ်သတ်မှတ်ငွေ မပြည့်သည်မှာ '+consecutive+' လဆက်တိုက် ရှိနေပါသည်။ ၃ လတိတိ မပြည့်ပါက အတိုးအား ပုံမှန်အတိုင်း ပြန်လည်သတ်မှတ်ပါမည်။</div>';

function render(){
 const s=share.snapshot||{},c=share.currency||s.currency||"THB",month=selectedMonth();
 const accounts=Array.isArray(s.accounts)&&s.accounts.length?s.accounts:[s];
 const multi=accounts.length>1;
 const buckets=Array.isArray(s.interestBuckets)?s.interestBuckets:accounts.flatMap(a=>a.interestBuckets||[]);
 const payments=Array.isArray(s.payments)?s.payments:accounts.flatMap(a=>a.payments||[]);
 const monthBuckets=buckets.filter(b=>!month||String(b.date||"").slice(0,7)===month);
 const monthPayments=payments.filter(p=>!month||String(p.date||"").slice(0,7)===month);
 const dueDate=s.due?esc(s.due):"Not set";
 const accountName=id=>{const a=accounts.find(x=>x.accountId===id);return a?(a.loanType||a.label||a.note||('Loan '+String(accounts.indexOf(a)+1))):'Loan';};
 const interestPaid=a=>(Array.isArray(a.interestBuckets)?a.interestBuckets:[]).reduce((sum,x)=>sum+Math.max(0,Number(x.original||0)-Number(x.remaining||0)),0);
 const interestMonths=a=>{const bs=Array.isArray(a.interestBuckets)?a.interestBuckets:[];return {paid:bs.filter(x=>Number(x.original)>0&&Number(x.remaining)<=0.004).length,partial:bs.filter(x=>Number(x.original)>Number(x.remaining||0)+0.004&&Number(x.remaining||0)>0.004).length,due:bs.filter(x=>Number(x.original)>0).length};};
 const accountPaymentMonths=a=>new Set((Array.isArray(a.payments)?a.payments:[]).filter(p=>Number(p.amount)>0&&p.date).map(p=>String(p.date).slice(0,7))).size;
 const currentMonth=(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")})();
 const monthlyPaidFor=a=>payments.filter(p=>String(p.date||"").slice(0,7)===currentMonth&&Number(p.amount)>0&&(!multi||p.accountId===a.accountId)).reduce((sum,p)=>sum+Math.max(0,Number(p.amount||0)),0);
 const totalInterestFor=a=>Number(interestPaid(a)||0)+Number(a.interestOutstanding||0);
 const isPaused=a=>String(a.interestType||"normal")==="paused";
 const summaryCard=(a,i)=>{
  const paused=isPaused(a),currency=a.currency||"THB",im=interestMonths(a),target=Math.max(0,Number(a.monthlyTarget||0)),paid=monthlyPaidFor(a);
  const title=esc(a.loanType||a.label||(multi?"ချေးငွေ "+(i+1):"ချေးငွေ"));
  const totalPaid=(Array.isArray(a.payments)?a.payments:[]).reduce((sum,p)=>sum+Math.max(0,Number(p.amount||0)),0);
  const paymentMetrics=metric("လစဉ်ပေးရန်သတ်မှတ်ငွေ",money(target,currency))+metric("စုစုပေါင်းသွင်းပြီးငွေ",money(totalPaid,currency));
  const metricGrid=paused
   ? metric("ချေးငွေ",money(a.principal,currency))+metric("လက်ကျန်ငွေ",money(a.principalOutstanding,currency))+metric("အတိုးအခြေအနေ","အတိုးရပ်ထားသည်")+metric("အတိုးစုစုပေါင်းလ",String(im.due)+" လ")+metric("အတိုးစုစုပေါင်းငွေ",money(totalInterestFor(a),currency))+metric("အတိုးသွင်းပြီးငွေစုစုပေါင်း",money(interestPaid(a),currency))+metric("အတိုးရပ်ထားသည့်ရက်စွဲ",a.stop?esc(a.stop):"မှတ်တမ်းမရှိ")+metric("အတိုး/အရင်း လက်ကျန်စုစုပေါင်း",money(Math.max(0,Number(a.principalOutstanding)||0)+Math.max(0,Number(a.interestOutstanding)||0),currency))
   : metric("ချေးငွေ",money(a.principal,currency))+metric("လက်ကျန်ငွေ",money(a.principalOutstanding,currency))+metric("အတိုးနှုန်း",String(a.rate||0)+"% · "+(a.period==="yearly"?"နှစ်စဉ်":a.period==="none"?"အတိုးမရှိ":"လစဉ်"))+metric("လစဉ်အတိုးငွေ",money(a.monthlyInterest,currency))+metric("အတိုးစုစုပေါင်းလ",String(im.due)+" လ")+metric("အတိုးစုစုပေါင်းငွေ",money(totalInterestFor(a),currency));

async function compressChatImage(file){if(!file||!file.type.startsWith('image/'))throw new Error('Choose a photo image file.');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Could not read this photo. Try choosing it again.'));r.readAsDataURL(file);});const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error('This photo format is not supported by your browser. Try saving it as JPG and choose it again.'));i.src=data;});const scale=Math.min(1,1000/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Photo compression is not available on this device.');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let result='',quality=.72;for(let attempt=0;attempt<9;attempt++){result=canvas.toDataURL('image/jpeg',quality);if(result.length<=350000)break;if(quality>.3)quality-=.1;else{canvas.width=Math.max(1,Math.round(canvas.width*.8));canvas.height=Math.max(1,Math.round(canvas.height*.8));ctx.drawImage(img,0,0,canvas.width,canvas.height);quality=.5;}}if(result.length>400000)throw new Error('This photo is still too large. Please choose a smaller photo.');return result;}
document.addEventListener('click',async e=>{const edit=e.target.closest('[data-chat-edit]'),del=e.target.closest('[data-chat-delete]');if(!edit&&!del)return;const id=(edit||del).dataset[edit?'chatEdit':'chatDelete'],message=chatMessages.find(m=>m.id===id);if(!id||!message)return;try{if(edit){const value=prompt('Edit your message:',message.text||'');if(value===null)return;if(!value.trim()&&!message.imageData){$('chatResult').innerHTML='<div class="error">Message cannot be empty.</div>';return;}await updateDoc(doc(db,'borrowerShares',token,'messages',id),{text:value.trim().slice(0,3000)});$('chatResult').innerHTML='<div class="success">Message updated for both sides.</div>';}else{if(!confirm('Delete this message for both Owner and Borrower? This cannot be undone.'))return;await deleteDoc(doc(db,'borrowerShares',token,'messages',id));$('chatResult').innerHTML='<div class="success">Message deleted for both sides.</div>';}}catch(err){$('chatResult').innerHTML='<div class="error">Could not change message: '+esc(err.message||'Check Firestore Rules.')+'</div>';}});async function submitBorrowerChat(e){e.preventDefault();const textValue=$('borrowerChatText').value.trim(),file=$('borrowerChatPhoto').files?.[0];if(!textValue&&!file){$('chatResult').innerHTML='<div class="error">Write a message or choose a photo.</div>';return;}const btn=$('sendChat');btn.disabled=true;$('chatResult').innerHTML='<div class="muted">'+(file?'Compressing photo and sending…':'Sending message…')+'</div>';try{const imageData=file?await compressChatImage(file):'';await addDoc(collection(db,'borrowerShares',token,'messages'),{token,senderRole:'borrower',senderName:share.borrowerName||share.snapshot?.person||'Borrower',text:textValue.slice(0,3000),imageData,createdAt:serverTimestamp()});$('borrowerChatText').value='';$('borrowerChatPhoto').value='';$('chatResult').innerHTML='<div class="success">Message sent.</div>';}catch(err){$('chatResult').innerHTML='<div class="error">Could not send message: '+esc(err.message||'Check database rules.')+'</div>';}finally{btn.disabled=false;}}
function metric(label,value){const t=String(label||""),v=String(value??"");const icon=/ချေးငွေ|လက်ကျန်ငွေ/.test(t)?"💰":/အတိုးနှုန်း|အတိုးအခြေအနေ/.test(t)?"📈":/လစဉ်အတိုး/.test(t)?"🪙":/အတိုးစုစုပေါင်းလ|ရက်စွဲ/.test(t)?"📅":/ပေးရန်|သတ်မှတ်ငွေ|ထပ်သွင်း/.test(t)?"💳":/သွင်းပြီး/.test(t)?"✅":/စုစုပေါင်း/.test(t)?"✨":"💠";const moneyValue=/^(MMK|THB|USD|SGD)\s/.test(v);return '<div class="metric"><span class="metric-icon" aria-hidden="true">'+icon+'</span><small>'+esc(label)+'</small><b class="'+(moneyValue?"metric-value-money":"")+'">'+esc(value)+'</b></div>';}
let bankQrShown=false,paymentReceiptImage='';
function closeBankQrModal(){const modal=$("bankQrModal");if(modal)modal.hidden=true;}function setPaymentMethodUI(){const method=$("paymentMethod")?.value||"cash",panel=$("bankTransferPanel"),button=$("sendRequest");if(panel)panel.hidden=method!=="bank";if(button){button.hidden=method==="bank";button.textContent="Send payment request to owner";}closeBankQrModal();bankQrShown=false;paymentReceiptImage="";if($("bankQrResult"))$("bankQrResult").innerHTML="";if($("bankReceiptPreview"))$("bankReceiptPreview").innerHTML="";if($("bankReceiptSection"))$("bankReceiptSection").hidden=true;if($("bankReceipt"))$("bankReceipt").value="";if($("sendBankReceipt"))$("sendBankReceipt").hidden=false;}
function showBankQr(){const form=$("requestForm");if(!form){return;}if(!form.reportValidity())return;const d=share.ownerData||{};const out=$("bankQrResult");if(!d.bankName||!d.bankAccountName||!d.bankQr){out.innerHTML='<div class="bank-transfer-error">The owner has not completed the bank name, account holder name, or Bank QR yet. Please contact the owner or choose Cash.</div>';const modal=$("bankQrModal");if(modal)modal.hidden=false;return;}bankQrShown=true;out.innerHTML='<div class="bank-transfer-details"><div><span class="bank-label">Bank name</span><br><b>'+esc(d.bankName)+'</b></div><div><span class="bank-label">Account holder</span><br><b>'+esc(d.bankAccountName)+'</b></div><div><span class="bank-label">Transfer amount</span><br><b>'+esc(money(amountForModal(),((Array.isArray(share.snapshot?.accounts)&&share.snapshot.accounts.length?share.snapshot.accounts:[share.snapshot||{}]).find(a=>a.accountId===($("requestAccountId")?.value||share.accountId))||share.snapshot||{}).currency||share.currency||"THB"))+'</b></div></div><img class="bank-transfer-qr" src="'+d.bankQr+'" alt="Owner bank payment QR"><p class="muted">Scan this QR and transfer the exact amount shown above. After transferring, upload the receipt below.</p>';if($("bankReceiptSection"))$("bankReceiptSection").hidden=false;const modal=$("bankQrModal");if(modal)modal.hidden=false;}function amountForModal(){return Number($("amount")?.value||0);}
async function handleBankReceiptChange(event){const file=event.target.files?.[0];paymentReceiptImage="";const preview=$("bankReceiptPreview");if(!file||!preview)return;preview.innerHTML='<p class="muted">Compressing receipt image…</p>';try{const data=await compressChatImage(file);if(data.length>400000)throw new Error("Receipt image is too large. Please choose a smaller photo.");paymentReceiptImage=data;preview.innerHTML='<img src="'+data+'" alt="Transfer receipt preview"><p class="muted">Receipt ready to send.</p>';}catch(err){event.target.value="";preview.innerHTML='<div class="bank-transfer-error">'+esc(err.message||"Could not read the receipt image.")+'</div>';}}
async function submitRequest(e){
 e.preventDefault();const paymentMethod=$("paymentMethod").value,button=paymentMethod==="bank"?$("sendBankReceipt"):$("sendRequest");if(button)button.disabled=true;const resultTarget=paymentMethod==="bank"?$("bankReceiptStatus"):$("requestResult");if(resultTarget&&paymentMethod!=="bank")resultTarget.innerHTML="";
 const amountInput=$("amount"),dateInput=$("payDate");const amount=Number(amountInput?.value),date=String(dateInput?.value||"").trim(),apply=$("apply").value,note=$("note").value.trim(),s=share.snapshot||{};
 const validDate=/^\d{4}-\d{2}-\d{2}$/.test(date)&&!Number.isNaN(Date.parse(date+"T00:00:00"));
 if(!Number.isFinite(amount)||amount<=0||!validDate){resultTarget.innerHTML='<div class="error">Enter a valid amount and date.</div>';if(button)button.disabled=false;return;}
 if(paymentMethod==="bank"&&!bankQrShown){resultTarget.innerHTML='<div class="error">Tap Get Bank QR first and complete the bank transfer.</div>';if(button)button.disabled=false;return;}
 if(paymentMethod==="bank"&&!paymentReceiptImage){resultTarget.innerHTML='<div class="error">Please upload the transfer receipt before sending it to the owner.</div>';if(button)button.disabled=false;return;}
 try{
  const selectedAccountId=$("requestAccountId")?.value||share.accountId;const requestAccounts=Array.isArray(s.accounts)&&s.accounts.length?s.accounts:[s];const selectedAccount=requestAccounts.find(a=>a.accountId===selectedAccountId)||s;await addDoc(collection(db,"borrowerPaymentRequests"),{token,ownerUid:share.ownerUid,accountId:selectedAccountId,borrowerName:share.borrowerName||s.person||"Borrower",currency:selectedAccount.currency||share.currency||s.currency||"THB",amount,date,apply,note,paymentMethod,receiptImage:paymentMethod==="bank"?paymentReceiptImage:"",status:"pending",createdAt:serverTimestamp(),schemaVersion:1});
  if(paymentMethod==="bank"){const modal=$("bankQrModal");if(modal)modal.hidden=true;resultTarget.innerHTML="";$("requestForm").reset();$("payDate").value=today();setPaymentMethodUI();const target=$("borrowerRequestStatus");if(target)target.innerHTML='<div class="success">ငွေလွှဲပြေစာ ပို့ပြီးပါပြီ။ ခေတ္တခဏစောင့်ပေးပါ။<br>Transfer receipt sent. Please wait for the owner to review it.</div>';}else{resultTarget.innerHTML='<div class="success">Payment request sent. Please wait for the owner to review it.</div>';$("requestForm").reset();$("payDate").value=today();setPaymentMethodUI();}
 }catch(err){resultTarget.innerHTML='<div class="error">Could not send the request. The link may have been revoked or database security rules may need updating. '+esc(err.message||"")+'</div>';}
 if(button)button.disabled=false;
}
async function boot(){
 if(!token){setStatus("This borrower link is missing its secure access token. Open the complete private link shared by the owner; a name alone cannot safely identify a private account.","error");return;}
 try{
  if(stopShareDoc)stopShareDoc();
  stopShareDoc=onSnapshot(doc(db,"borrowerShares",token),snap=>{
   if(!snap.exists()){setStatus("This link is invalid, unavailable, or has been revoked.","error");return;}
   const next={id:snap.id,...snap.data()};
   if(requestedNameKey && normalizeBorrowerName(requestedNameKey)!==normalizeBorrowerName(next.borrowerName||next.snapshot?.person||"")){setStatus("Borrower name does not match this private link. Please use the exact link shared by the owner.","error");return;}
   if(!next.active){share=next;setStatus("This borrower link has been revoked. Contact the owner.","error");return;}
   if(!next.snapshot||!next.accountId||!next.ownerUid){setStatus("This account link is incomplete. Please contact the owner.","error");return;}
   if(Array.isArray(next.snapshot.accounts)&&next.snapshot.accounts.length>1&&!Array.isArray(next.accountIds))next.accountIds=next.snapshot.accounts.map(a=>a.accountId);
   share=next;
   setStatus("Live account loaded · changes from the owner update automatically.","success");
   try{render();}catch(renderError){setStatus("Could not display the borrower account. "+(renderError?.message||String(renderError)),"error");console.error("Borrower render failed",renderError);return;}
   if(!shareListenersStarted){shareListenersStarted=true;startChat();startBorrowerRequestListener();}
  },err=>setStatus("Could not sync the latest owner records. "+(err.message||""),"error"));
 }catch(err){setStatus("Could not load this account. Firestore share-link rules may need to be configured. "+(err.message||""),"error");}
}
boot();;

<script>
(function(){
 const status=document.getElementById('status');
 const isStillLoading=()=>!!status&&/Loading your private account|သင့်သီးသန့်အကောင့်ကို ဖွင့်နေသည်|กำลังโหลดบัญชีส่วนตัว/.test(status.textContent||'');
 window.addEventListener('error',function(e){
  // Ignore failed images/fonts and other resource errors; they must not mask a
  // borrower-link loading state. Only report actual uncaught JavaScript errors.
  if(e.target && e.target !== window)return;
  if(status&&isStillLoading()){
   status.className='status error';
   var detail=String(e.message||'Unknown JavaScript error');
   var location=e.filename?(' ('+e.filename.split('/').pop()+':'+(e.lineno||'?')+')'):'';
   status.textContent='JavaScript အမှား: '+detail+location+'. Internet ချိတ်ဆက်မှုကို စစ်ပြီး Refresh လုပ်ပါ။';
  }
 });
 window.addEventListener('unhandledrejection',function(e){
  if(status&&isStillLoading()){
   status.className='status error';
   var reason=e.reason;
   status.textContent='Firebase/အကောင့်ချိတ်ဆက်မှု အမှား: '+String(reason&&reason.message||reason||'Unknown error');
  }
 });
 setTimeout(function(){
  if(isStillLoading()){
   status.className='status error';
   status.textContent='အကောင့်ဖွင့်ရန် အချိန်ကြာနေပါသည်။ Internet/Firebase ချိတ်ဆက်မှုကို စစ်ပါ။ အကောင့်ဒေတာကို မပြင်ဆင်ထားပါ။';
  }
 },12000);
})();
</script>

 });
 const reverse={};for(const l of Object.keys(dict)){reverse[l]={};for(const k of Object.keys(dict[l]))reverse[l][dict[l][k]]=k;}
 const getLang=()=>localStorage.getItem(key)||'en';
 function tr(text,lang){const t=text.replace(/\s+/g,' ').trim();if(!t)return text;let base=t;for(const l of Object.keys(reverse)){if(reverse[l][base]){base=reverse[l][base];break;}}const out=(dict[lang]&&dict[lang][base])||base;return text===t?out:text.replace(t,out);}
 function apply(root){const lang=getLang();document.documentElement.lang=lang;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){if(!n.parentElement||['SCRIPT','STYLE'].includes(n.parentElement.tagName))continue;const out=tr(n.nodeValue,lang);if(out!==n.nodeValue)n.nodeValue=out;}root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>['placeholder','title','aria-label'].forEach(a=>{const v=el.getAttribute(a);if(v){const out=tr(v,lang);if(out!==v)el.setAttribute(a,out);}}));root.querySelectorAll('option').forEach(el=>{if(el.closest('#languageSelect'))return;const v=el.textContent;const out=tr(v,lang);if(out!==v)el.textContent=out;});}
 function setup(){const sel=document.getElementById('languageSelect');if(sel){sel.value=getLang();sel.addEventListener('change',()=>{localStorage.setItem(key,sel.value);apply(document.body);});}apply(document.body);const ob=new MutationObserver(ms=>{for(const m of ms){if(m.type==='childList')apply(m.target.nodeType===1?m.target:document.body);else if(m.type==='characterData')apply(m.target.parentElement||document.body);}});ob.observe(document.body,{subtree:true,childList:true,characterData:true});}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup);else setup();
})();
</script>
<script>
(function(){
 const viewer=document.getElementById('loanFullscreenViewer');
 const content=document.getElementById('loanFullscreenContent');
 const heading=document.getElementById('loanFullscreenHeading');
 const close=()=>{viewer.classList.remove('open');document.body.classList.remove('loan-fullscreen-open');content.innerHTML='';};
 document.getElementById('loanFullscreenBack')?.addEventListener('click',close);
 document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&viewer.classList.contains('open'))close();});
 document.addEventListener('click',ev=>{
  const trigger=ev.target.closest('[data-loan-fullscreen]');
  if(!trigger)return;
  const card=trigger.closest('article.panel');
  if(!card)return;
  ev.preventDefault();
  const details=trigger.dataset.loanFullscreen==='details';
  const clone=card.cloneNode(true);
  clone.querySelectorAll('.loan-title-open').forEach(b=>{const h=document.createElement('h2');h.textContent=b.textContent.replace('↗','').trim();h.style.cssText='font-size:20px;margin:0;color:#142746';b.replaceWith(h);});
  clone.querySelectorAll('.loan-detail-toggle').forEach(d=>{d.open=true;const summary=d.querySelector('summary');if(summary)summary.remove();});
  content.innerHTML='';content.appendChild(clone);
  heading.textContent=details?'စာရင်းအသေးစိတ်ကြည့်ရန်':'ချေးငွေအကျဉ်းချုပ်';
  viewer.classList.add('open');document.body.classList.add('loan-fullscreen-open');viewer.scrollTop=0;
 });
})();
</script>
<script>
(function(){
 let borrowerInstallPrompt=null;
 window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();borrowerInstallPrompt=ev;const b=document.getElementById('installBorrowerApp');if(b)b.textContent='📲 Install App';});
 window.addEventListener('appinstalled',()=>{borrowerInstallPrompt=null;const b=document.getElementById('installBorrowerApp');if(b)b.textContent='✓ Installed';const h=document.getElementById('borrowerInstallHelp');if(h)h.textContent='Home Screen မှာ Install လုပ်ပြီးပါပြီ။';});
 const escHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function showPage(page){
  document.querySelectorAll('.share-page').forEach(el=>{const on=el.dataset.sharePage===page;el.hidden=!on;el.style.display=on?'block':'none';});
  document.querySelectorAll('[data-share-tab]').forEach(el=>{const on=el.dataset.shareTab===page;el.classList.toggle('active',on);el.setAttribute('aria-current',on?'page':'false');});
  document.body.classList.toggle('chat-mode',page==='chat');window.scrollTo({top:0,behavior:'auto'});
 }
 const borrowerSessionStartedAt=new Date();
 function getBorrowerDeviceModel(){
  try{
   const ua=navigator.userAgent||'';
   const model=navigator.userAgentData&&navigator.userAgentData.model;
   if(model&&String(model).trim())return String(model).trim();
   const samsung=ua.match(/\b(SM-[A-Z0-9-]+)\b/i);if(samsung)return 'Samsung '+samsung[1].toUpperCase();
   if(/iPhone/i.test(ua))return 'iPhone';
   if(/iPad/i.test(ua))return 'iPad';
   if(/Pixel/i.test(ua)){const p=ua.match(/(Pixel\s?[A-Za-z0-9 ]*)/i);return p?p[1].trim():'Google Pixel';}
   if(/Android/i.test(ua))return 'Android phone (exact model hidden by browser)';
   return /Windows/i.test(ua)?'Windows device':/Macintosh|Mac OS/i.test(ua)?'Mac device':/Linux/i.test(ua)?'Linux device':'Device model unavailable';
  }catch(e){return 'Device model unavailable';}
 }
 function formatBorrowerLoginTime(date){
  try{return new Intl.DateTimeFormat('en-GB',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(date);}
  catch(e){return date.toLocaleString();}
 }
 function accountMarkup(){
  const name=document.querySelector('#app [data-share-page="summary"] .head h1')?.textContent?.trim()||share?.borrowerName||share?.snapshot?.person||'Borrower';
  const model=getBorrowerDeviceModel();
  const loginTime=formatBorrowerLoginTime(borrowerSessionStartedAt);
  const phone=String(share?.borrowerPhone||share?.snapshot?.borrowerPhone||share?.snapshot?.accounts?.find(a=>a.borrowerPhone)?.borrowerPhone||'').trim()||'Owner က ဖုန်းနံပါတ် မထည့်ရသေးပါ';
  const rows=[
   {icon:'👤',label:'Name',value:name},
   {icon:'📱',label:'Model',value:model},
   {icon:'🕒',label:'Login Time',value:loginTime},
   {icon:'🟢',label:'Session status',value:'Active · ဒီစာမျက်နှာဖွင့်ထားသည်',status:true},
   {icon:'☎️',label:'Phone',value:phone,note:phone==='Owner က ဖုန်းနံပါတ် မထည့်ရသေးပါ'?'Owner က ချေးငွေစာရင်းကို Edit လုပ်ပြီး ဖုန်းနံပါတ် ထည့်နိုင်ပါသည်။':''}
  ];
  const rowHtml=rows.map((r,i)=>'<div style="display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:start;padding:15px 2px;'+(i===rows.length-1?'':'border-bottom:1px solid #e8edf4;')+'"><div style="width:36px;height:36px;border-radius:12px;background:#f0f4fa;display:flex;align-items:center;justify-content:center;font-size:18px">'+r.icon+'</div><div style="min-width:0"><div style="font-size:12px;letter-spacing:.2px;font-weight:700;color:#728096;margin-bottom:4px">'+escHtml(r.label)+'</div><div style="font-size:14px;font-weight:750;line-height:1.5;color:'+(r.status?'#087f66':'#172b49')+';overflow-wrap:anywhere">'+escHtml(r.value)+'</div>'+(r.note?'<small style="display:block;color:#8792a3;font-size:11px;line-height:1.45;margin-top:4px">'+escHtml(r.note)+'</small>':'')+'</div></div>').join('');
  const savedPhone=String(share?.borrowerPhone||share?.snapshot?.borrowerPhone||share?.snapshot?.accounts?.find(a=>a.borrowerPhone)?.borrowerPhone||'').trim();
  return '<section style="border:1px solid #e2e8f0;border-radius:20px;padding:6px 16px;background:linear-gradient(145deg,#fff,#f8faff);box-shadow:0 8px 24px rgba(18,39,70,.07)">'+rowHtml+'</section><section style="margin-top:12px;border:1px solid #e2e8f0;border-radius:18px;padding:16px;background:#fff"><h3 style="margin:0 0 6px;font-size:15px;color:#172b49">📞 Phone number</h3><p style="margin:0 0 12px;font-size:12px;color:#728096;line-height:1.5">Owner ထည့်ထားသော ဖုန်းနံပါတ်ကို လိုအပ်ပါက ပြင်ဆင်နိုင်ပါသည်။</p><form id="borrowerPhoneEditForm"><div class="field"><label for="borrowerPhoneEdit">Phone</label><input id="borrowerPhoneEdit" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="32" value="'+escHtml(savedPhone)+'" placeholder="+66 / 09xxxxxxxx"></div><button class="btn" id="saveBorrowerPhone" type="submit" style="margin-top:12px;width:100%">Save phone number</button><div id="borrowerPhoneSaveStatus" aria-live="polite" style="margin-top:10px;font-size:12px"></div></form></section>';
 }
 function refreshAccount(){const html=accountMarkup();const a=document.getElementById('borrowerMyAccountDetails');const b=document.getElementById('borrowerMyAccountFull');if(a)a.innerHTML=html;if(b)b.innerHTML=html;}
 document.addEventListener('submit',async ev=>{
  if(ev.target?.id!=='borrowerPhoneEditForm')return;
  ev.preventDefault();
  const input=document.getElementById('borrowerPhoneEdit'),button=document.getElementById('saveBorrowerPhone'),msg=document.getElementById('borrowerPhoneSaveStatus');
  const phone=String(input?.value||'').trim();
  if(phone.length>32){if(msg)msg.textContent='ဖုန်းနံပါတ်ကို စာလုံး ၃၂ လုံးထက် မပိုစေရပါ။';return;}
  if(!share?.id||!token){if(msg)msg.textContent='Share Link မမှန်ပါ။';return;}
  if(button)button.disabled=true;if(msg)msg.textContent='Saving…';
  try{
   await updateDoc(doc(db,'borrowerShares',token),{borrowerPhone:phone});
   share.borrowerPhone=phone;
   if(share.snapshot)share.snapshot.borrowerPhone=phone;
   if(msg){msg.textContent='ဖုန်းနံပါတ် သိမ်းဆည်းပြီးပါပြီ။';msg.style.color='#087f66';}
   refreshAccount();
  }catch(err){if(msg){msg.textContent='သိမ်းဆည်းမရပါ။ Share Link ကို ပြန်ဖွင့်ပြီး ထပ်ကြိုးစားပါ။';msg.style.color='#b42318';}}
  finally{if(button)button.disabled=false;}
 });
 document.addEventListener('click',async ev=>{
  const install=ev.target.closest('#installBorrowerApp');
  if(install){
   try{const currentToken=new URLSearchParams(location.search).get('token');if(currentToken)localStorage.setItem('finance-master-borrower-install-token-v1',currentToken);}catch(e){}
   const help=document.getElementById('borrowerInstallHelp');
   if(borrowerInstallPrompt){
    try{borrowerInstallPrompt.prompt();const choice=await borrowerInstallPrompt.userChoice;borrowerInstallPrompt=null;if(help)help.textContent=choice&&choice.outcome==='accepted'?'Home Screen မှာ Install လုပ်ရန် လက်ခံပြီးပါပြီ။':'Install မလုပ်ရသေးပါ။ Install ခလုတ်ကို ထပ်နှိပ်နိုင်ပါသည်။';}catch(e){if(help)help.textContent='Install Prompt မရသေးပါ။ Chrome မီနူးမှ Install app ကို ရွေးပါ။'}
   }else{
    if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){
     if(help)help.textContent='iPhone မှာ Safari → Share → Add to Home Screen ကို ရွေးပါ။ Browser က ခွင့်မပြုလို့ ဝဘ်ဆိုက်ကနေ အလိုအလျောက် Home Screen ထဲထည့်ပေးလို့ မရပါ။';
    }else if(/Android/i.test(navigator.userAgent)){
     if(help)help.textContent='ဒီ Browser မှာ တိုက်ရိုက် Install Prompt မရသေးပါ။ Chrome မှာဖွင့်ဖို့ ကြိုးစားနေပါတယ်။ Chrome ပွင့်လာရင် ⋮ → Install app / Add to Home screen ကို ရွေးပါ။';
     try{const u=new URL(location.href);const intent='intent://'+u.host+u.pathname+u.search+u.hash+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(location.href)+';end';location.href=intent;}catch(e){}
    }else if(help)help.textContent='ဒီ Browser မှာ Install prompt မရနိုင်သေးပါ။ Browser menu မှ Install app / Add to Home screen ကို ရွေးပါ။';
   }
  }
  const copy=ev.target.closest('#copyBorrowerInstallLink');
  if(copy){const inp=document.getElementById('borrowerInstallLink');try{await navigator.clipboard.writeText(inp.value);copy.textContent='✓ Link ကူးယူပြီးပါပြီ';}catch(e){inp.focus();inp.select();try{document.execCommand('copy');copy.textContent='✓ Link ကူးယူပြီးပါပြီ';}catch(_){}}}
  if(ev.target.closest('#openMyAccount')){refreshAccount();showPage('account');}
  const tab=ev.target.closest('[data-share-tab]');if(tab&&['settings','account'].includes(tab.dataset.shareTab))showPage(tab.dataset.shareTab);
 });

})();
