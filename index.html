ar(--line);border-radius:14px}.setting h3{font-size:13px;margin:0 0 7px}.setting p{font-size:11px;line-height:1.6;color:var(--muted)}.mobilemenu{display:none}.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:white;padding:13px 18px;border-radius:12px;box-shadow:0 12px 40px #0002;z-index:50;font-size:12px;display:none}.toast.show{display:block;animation:fade 3s forwards}@keyframes fade{0%,75%{opacity:1}100%{opacity:0}}

<script>
const KEY='finance-master-personal-v1';
const today=()=>new Date().toISOString().slice(0,10);
const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:state.currency||'THB',maximumFractionDigits:2}).format(Number(n)||0);
let state={currency:'THB',transactions:[],loans:[],debts:[],savings:[],budgets:[],payments:[]};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)state={...state,...s}}catch(e){}
let current='Dashboard';
function save(){localStorage.setItem(KEY,JSON.stringify(state));const el=document.getElementById('saveStatus');if(el)el.textContent='● Saved on this device';if(window.fmScheduleSync)window.fmScheduleSync(state)}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(p){current=p;document.getElementById('crumbPage').textContent=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();document.getElementById('mobileNav').style.display='';}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function toggleMobile(){const n=document.getElementById('mobileNav');n.style.display=n.style.display==='none'?'flex':''}
function total(type){return state.transactions.filter(t=>t.type===type).reduce((a,t)=>a+Number(t.amount||0),0)}
function outstanding(list){return list.reduce((s,l)=>s+Math.max(0,Number(l.principal||0)-Number(l.principalPaid||0)),0)}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalback').classList.add('show')}
function closeModal(){document.getElementById('modalback').classList.remove('show')}
function field(label,name,type='text',value='',opts=''){return `<div class="field"><label>${label}</label>${type==='select'?`<select name="${name}" required>${opts}</select>`:`<input name="${name}" type="${type}" value="${escapeHtml(value)}" ${type==='number'?'min="0" step="0.01"':''} required`+`>`}</div>`}

function slipUploadMarkup(formId){
 return '<div class="field full" style="border:1px dashed var(--line);border-radius:12px;padding:12px"><label>Bank QR slip / payment receipt (auto-read)</label><input type="file" accept="image/*" onchange="readBankSlip(this,\''+formId+'\')" style="max-width:100%"><small class="sub" style="display:block;margin-top:6px">Upload a bank transfer receipt image. Amount and remark will be read automatically; please verify them before saving.</small><div id="slipStatus_'+formId+'" class="sub" style="margin-top:8px"></div></div>';
}
let fmOcrPromise=null;
async function getSlipOcr(){
 if(window.Tesseract)return window.Tesseract;
 if(!fmOcrPromise)fmOcrPromise=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=()=>resolve(window.Tesseract);s.onerror=()=>reject(new Error('Could not load OCR engine. Check internet connection and try again.'));document.head.appendChild(s)});
 return fmOcrPromise;
}
async function getSlipOcrWorker(){
 const T=await getSlipOcr();
 // Download trained language data on demand; include Myanmar for Burmese-language memos.
 return await T.createWorker(['eng','tha','mya'],1,{logger:m=>{}});
}
function parseSlipText(text){
 const thaiDigits={'๐':'0','๑':'1','๒':'2','๓':'3','๔':'4','๕':'5','๖':'6','๗':'7','๘':'8','๙':'9'};
 const normalized=String(text||'').replace(/[๐-๙]/g,ch=>thaiDigits[ch]||ch).replace(/[฿]/g,' THB ');
 const lines=normalized.split(/\r?\n/).map(x=>x.replace(/[|]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
 const full=lines.join('\n');
 let amount=null;
 const amountLabels=/(?:transfer\s*amount|transaction\s*amount|amount|ยอดเงินที่โอน|จำนวนเงิน|จำนวนที่โอน|ยอดโอน|โอนเงิน|เงินที่โอน|ยอดชำระ|ยอดเงิน|จำนวน|amount\s*\(thb\))/i;
 const numberRe=/(?:THB\s*)?([0-9][0-9,]*(?:\.[0-9]{1,2})?)(?:\s*(?:THB|บาท))?/gi;
 for(let i=0;i<lines.length;i++){
   if(amountLabels.test(lines[i])){
     const candidates=[lines[i],lines[i+1]||''].join(' ');
     const matches=[...candidates.matchAll(numberRe)];
     const vals=matches.map(x=>Number(x[1].replace(/,/g,''))).filter(n=>n>0&&n<1e10);
     if(vals.length){amount=vals[vals.length-1];break}
   }
 }
 if(amount===null){
   const matches=[...full.matchAll(/(?:THB\s*|บาท\s*)([0-9][0-9,]*(?:\.[0-9]{1,2})?)/gi)];
   const vals=matches.map(x=>Number(x[1].replace(/,/g,''))).filter(n=>n>0&&n<1e10);
   if(vals.length)amount=vals[0];
 }
 if(amount===null){
   const decimals=[...full.matchAll(/\b([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{2})|[0-9]+\.[0-9]{2})\b/g)]
     .map(x=>Number(x[1].replace(/,/g,''))).filter(n=>n>0&&n<1e10);
   if(decimals.length)amount=decimals.sort((a,b)=>b-a)[0];
 }
 let remark='';
 const remarkLabels=/(?:remark|payment\s*note|note|memo|message|หมายเหตุ|บันทึกช่วยจำ|รายละเอียด|ข้อความถึงผู้รับ|วัตถุประสงค์|บันทึก|ข้อความ)/i;
 for(let i=0;i<lines.length;i++){
   const line=lines[i], at=line.search(remarkLabels);
   if(at>=0){
     let value=line.slice(at).replace(remarkLabels,'').replace(/^\s*[:：-]?\s*/,'').trim();
     if(!value && lines[i+1])value=lines[i+1];
     if(value && !/^(?:amount|ยอดเงิน|วันที่|date|time|reference|เลขที่|transaction|fee|ค่าธรรมเนียม|balance|ยอดคงเหลือ)/i.test(value)){remark=value;break}
   }
 }
 if(remark.length>120)remark=remark.slice(0,120).trim();
 return {amount,remark,text:full};
}
function inferExpenseCategory(text){
 const t=(text||'').toLowerCase();
 if(/food|meal|restaurant|coffee|อาหาร|ข้าว|ร้านอาหาร|กาแฟ/.test(t))return 'Food';
 if(/rent|room|housing|electric|water|ค่าเช่า|ห้องพัก|ค่าไฟ|ค่าน้ำ/.test(t))return 'Housing';
 if(/transport|taxi|grab|fuel|gas|รถ|น้ำมัน|เดินทาง|ค่าโดยสาร/.test(t))return 'Transport';
 if(/shopping|purchase|สินค้า|ซื้อของ|ช้อป/.test(t))return 'Shopping';
 if(/health|hospital|clinic|ยา|โรงพยาบาล|คลินิก/.test(t))return 'Health';
 return 'Other';
}
async function readBankSlip(input,formId){
 const file=input.files&&input.files[0], form=document.getElementById(formId), statusEl=document.getElementById('slipStatus_'+formId);
 if(!file||!form||!statusEl)return;
 if(!file.type.startsWith('image/')){statusEl.textContent='Please choose an image file.';return}
 statusEl.textContent='Reading slip… This may take a little while on a phone.';
 try{
   const worker=await getSlipOcrWorker();
   const result=await worker.recognize(file);
   await worker.terminate();
   const parsed=parseSlipText(result.data.text||'');
   const set=(name,value)=>{const el=form.elements.namedItem(name);if(el&&value!==null&&value!==undefined&&String(value).trim()!=='')el.value=value};
   if(parsed.amount!==null)set('amount',parsed.amount);
   if(parsed.remark){
     set('note',parsed.remark);
     if(formId==='txForm')set('title',parsed.remark);
   }
   if(formId==='txForm'&&parsed.remark){const cat=form.elements.namedItem('category');if(cat)cat.value=inferExpenseCategory(parsed.remark)}
   const found=[];
   if(parsed.amount!==null)found.push('Amount: '+parsed.amount.toLocaleString()+' '+state.currency);else found.push('Amount not detected — enter it manually.');
   if(parsed.remark)found.push('Remark: '+parsed.remark);else found.push('Remark not detected — enter it manually.');
   const ocrPreview=(parsed.text||'').replace(/\s+/g,' ').trim().slice(0,260);
   statusEl.textContent='Slip scanned. '+found.join(' · ')+' Please verify the fields before saving.'+(ocrPreview?' OCR text: '+ocrPreview:' No readable text found. Try a sharper, full slip image with all edges visible.');
 }catch(e){statusEl.textContent='Could not read this image automatically: '+(e.message||e)+'. You can still enter the fields manually.'}
}

function addPayment(){const all=[...state.loans.map(x=>({...x,kind:'loan'})),...state.debts.map(x=>({...x,kind:'debt'}))];if(!all.length){toast('Add a loan or debt first');return}openModal('Record a payment',`<form id="payForm"><div class="formgrid">${field('Related account','account','select','',''+all.map(l=>`<option value="${l.kind}:${l.id}">${escapeHtml(l.person)} — ${l.kind==='loan'?'Loan given':'My debt'}</option>`).join(''))}${field('Amount ('+state.currency+')','amount','number')}${field('Payment date','date','date',today())}${field('Apply to','apply','select','','<option value="auto" selected>Automatic — interest first, then principal</option><option value="interest">Interest only</option><option value="principal">Principal only</option><option value="other">Other / mixed (record only)</option>')}<div class="field full"><label>Note</label><input name="note" placeholder="Payment details"></div>${slipUploadMarkup('payForm')}</div><div class="notice">Payment is recorded in history. Principal payments reduce the outstanding principal; interest payments are tracked separately.</div><div class="formactions"><button type="button" class="pill" onclick="closeModal()">Cancel</button><button class="primary">Save payment</button></div></form>`);document.getElementById('payForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),account=String(f.get('account')||''),parts=account.split(':'),kind=parts[0],id=parts[1],amount=Number(f.get('amount')),date=f.get('date')||today(),apply=String(f.get('apply')||'auto');if(!id||!['loan','debt'].includes(kind)){toast('Choose a loan or debt account');return}if(!Number.isFinite(amount)||amount<=0){toast('Enter a payment amount greater than zero');return}const l=(kind==='loan'?state.loans:state.debts).find(x=>x.id===id);if(!l){toast('Selected loan/debt account was not found');return}const ledger=loanLedger(kind,l,date),interestApplied=apply==='auto'?Math.min(amount,ledger.interestOutstanding):apply==='interest'?Math.min(amount,ledger.interestOutstanding):0,principalApplied=apply==='auto'?Math.max(0,amount-interestApplied):apply==='principal'?amount:0;const p={id:crypto.randomUUID(),account:id,kind,amount,date,apply,note:String(f.get('note')||'').trim(),interestApplied,principalApplied};state.payments.unshift(p);if(principalApplied>0)l.principalPaid=Math.min(Number(l.principal)||0,Number(l.principalPaid||0)+principalApplied);save();closeModal();render();toast('Payment saved: '+fmt(interestApplied)+' to interest, '+fmt(principalApplied)+' to principal')}}
function loanAddMonths(start,n){const d=new Date(start+'T00:00:00Z');const day=d.getUTCDate();const target=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+n,1));const last=new Date(Date.UTC(target.getUTCFullYear(),target.getUTCMonth()+1,0)).getUTCDate();target.setUTCDate(Math.min(day,last));return target.toISOString().slice(0,10)}
function loanMonthlyRate(l){if(!l||!Number(l.rate)||l.period==='none')return 0;return Number(l.rate)/100/(l.period==='yearly'?12:1)}
function loanLedger(kind,l,throughDate=today(),excludePaymentId=''){
 const through=String(throughDate||today()).slice(0,10),start=String(l.start||l.created||today()).slice(0,10);
 const events=[];
 const rate=loanMonthlyRate(l);
 if(rate>0&&start<=through){for(let n=1;n<600;n++){const due=loanAddMonths(start,n);if(due>through||(l.stop&&due>String(l.stop).slice(0,10)))break;events.push({date:due,type:'due',n})}}
 (state.payments||[]).filter(p=>p.kind===kind&&p.account===l.id&&p.id!==excludePaymentId&&String(p.date||'')>=start&&String(p.date||'').slice(0,10)<=through).forEach(p=>events.push({date:String(p.date||start).slice(0,10),type:'payment',p}));
 events.sort((a,b)=>a.date.localeCompare(b.date)||(a.type===b.type?0:a.type==='due'?-1:1));
 let principal=Math.max(0,Number(l.principal)||0);const buckets=[];
 const applyInterest=amount=>{let left=Math.max(0,Number(amount)||0);for(const b of buckets){if(left<=0)break;const paid=Math.min(b.remaining,left);b.remaining=Math.max(0,b.remaining-paid);left-=paid}return left};
 for(const ev of events){
  if(ev.type==='due'){const compoundBase=principal+((l.method||'simple')==='compound'?buckets.reduce((sum,b)=>sum+Math.max(0,b.remaining),0):0);const amount=Math.max(0,compoundBase*rate);if(amount>0)buckets.push({date:ev.date,remaining:amount,original:amount});continue}
  const p=ev.p,amount=Math.max(0,Number(p.amount)||0);
  if(p.apply==='interest'){applyInterest(amount);continue}
  if(p.apply==='principal'){principal=Math.max(0,principal-amount);continue}
  if(p.interestApplied!==undefined||p.principalApplied!==undefined){applyInterest(Number(p.interestApplied)||0);principal=Math.max(0,principal-(Number(p.principalApplied)||0));continue}
  if(p.apply==='auto'){const left=applyInterest(amount);principal=Math.max(0,principal-left)}
 }
 const unpaid=buckets.filter(b=>b.remaining>0.004);
 return {monthlyInterest:Math.max(0,principal*rate),principalOutstanding:principal,interestOutstanding:unpaid.reduce((s,b)=>s+b.remaining,0),unpaidMonths:unpaid.length,unpaidMonthLabels:unpaid.map(b=>new Date(b.date+'T00:00:00Z').toLocaleDateString('en-GB',{month:'short',year:'numeric',timeZone:'UTC'})),monthsDue:buckets.length,interestBuckets:buckets};
}

function budgetPage(){return `${pageHead('Budget planner','Set spending limits and compare them with recorded expenses.','Add budget','addBudget()')}<div class="layout"><section class="panel"><div class="panelhead"><div><h2>Category budgets</h2><p>Monthly spending limits</p></div></div>${state.budgets.length?state.budgets.map(b=>{const spent=state.transactions.filter(t=>t.type==='expense'&&t.category===b.category&&t.date?.startsWith(today().slice(0,7))).reduce((s,t)=>s+t.amount,0);return `<div style="padding:14px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between"><b style="font-size:12px">${escapeHtml(b.category)}</b><span style="font-size:11px">${fmt(spent)} / ${fmt(b.limit)}</span></div><div style="height:7px;background:#eef1f5;border-radius:9px;margin-top:10px;overflow:hidden"><div style="height:100%;width:${Math.min(100,spent/b.limit*100)}%;background:${spent>b.limit?'var(--red)':'var(--gold)'}"></div></div><small class="sub">${spent>b.limit?'Over budget by '+fmt(spent-b.limit):fmt(b.limit-spent)+' remaining'}</small></div>`}).join(''):'<div class="empty">No budgets yet. Set a category limit to get started.</div>'}</section><section class="panel"><h2 style="font-size:15px;margin-top:0">This month</h2><p class="sub">Total expenses recorded</p><strong style="font-size:27px">${fmt(state.transactions.filter(t=>t.type==='expense'&&t.date?.startsWith(today().slice(0,7))).reduce((s,t)=>s+t.amount,0))}</strong><p class="sub">Only transactions dated in the current month are included.</p></section></div>`}
function addBudget(){openModal('Add category budget',`<form id="budgetForm"><div class="formgrid">${field('Category','category','select','','<option>Food</option><option>Housing</option><option>Transport</option><option>Shopping</option><option>Health</option><option>Other</option>')}${field('Monthly limit ('+state.currency+')','limit','number')}</div><div class="formactions"><button type="button" class="pill" onclick="closeModal()">Cancel</button><button class="primary">Save budget</button></div></form>`);document.getElementById('budgetForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.budgets.push({id:crypto.randomUUID(),category:f.get('category'),limit:Number(f.get('limit'))});save();closeModal();render();toast('Budget saved')}}
function reportsPage(){const income=total('income'),expense=total('expense');const cats={};state.transactions.filter(t=>t.type==='expense').forEach(t=>cats[t.category]=(cats[t.category]||0)+t.amount);return `${pageHead('Reports & insights','A simple snapshot of your recorded financial activity.','Export CSV','exportCSV()')}<div class="cards">${metric('Income',fmt(income),'↗','Recorded total')}${metric('Expenses',fmt(expense),'↘','Recorded total')}${metric('Net cash flow',fmt(income-expense),'◈','Income minus expenses')}${metric('Savings rate',income?Math.round((income-expense)/income*100)+'%':'—','％','Based on recorded income')}</div><div class="layout"><section class="panel"><div class="panelhead"><div><h2>Expense breakdown</h2><p>By category · all recorded time</p></div></div>${Object.entries(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([cat,n])=>`<div style="padding:11px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;font-size:12px"><b>${escapeHtml(cat)}</b><span>${fmt(n)}</span></div><div style="height:6px;background:#edf0f5;border-radius:9px;margin-top:8px"><div style="height:100%;width:${expense?n/expense*100:0}%;background:var(--gold);border-radius:9px"></div></div></div>`).join(''):'<div class="empty">Add expense records to see a breakdown.</div>'}</section><section class="panel"><h2 style="font-size:15px;margin-top:0">Export & review</h2><p style="font-size:12px;line-height:1.7;color:var(--muted)">Download your transaction records as CSV for spreadsheets, or export all records as a JSON backup. Keep backups somewhere secure.</p><button class="primary" onclick="exportCSV()">⇩ Download transaction CSV</button><p><button class="pill" onclick="exportData()">Download full JSON backup</button></p></section></div>`}
function settingsPage(){return `${pageHead('Settings & backup','Manage your preferences and protect your records.')}<div class="notice"><b>Data & cloud sync:</b> When you are signed out, records stay in this browser on this device. Sign in to your Finance Master account, export a JSON backup first, then use <b>Upload this device to cloud</b> for the first upload. After the cloud copy is connected, signed-in devices sync changes automatically. If a sync conflict occurs, syncing pauses to protect both copies.</div><div class="settingsgrid"><section class="panel"><h2 style="font-size:15px;margin-top:0">Preferences</h2><div class="field" style="margin:16px 0"><label>Currency</label><select id="currency" onchange="state.currency=this.value;save();render()"><option value="THB" ${state.currency==='THB'?'selected':''}>Thai Baht (THB ฿)</option><option value="MMK" ${state.currency==='MMK'?'selected':''}>Myanmar Kyat (MMK)</option><option value="USD" ${state.currency==='USD'?'selected':''}>US Dollar (USD $)</option><option value="SGD" ${state.currency==='SGD'?'selected':''}>Singapore Dollar (SGD)</option></select></div><p class="sub">Currency changes the display symbol; it does not convert saved amounts.</p></section><section class="panel"><h2 style="font-size:15px;margin-top:0">Backup & restore</h2><p class="sub">Export a complete copy of all records or restore from a previous Finance Master JSON backup.</p><p><button class="primary" onclick="exportData()">⇩ Export full backup</button></p><p><label class="pill" style="display:inline-block">⇧ Restore JSON backup <input type="file" accept=".json,application/json" onchange="restoreData(event)" style="display:none"></label></p><button class="pill" onclick="exportCSV()">Export transactions CSV</button></section><section class="panel" style="grid-column:1/-1"><h2 style="font-size:15px;margin-top:0">Firebase Cloud Sync</h2><p class="sub">Sign in with your own Finance Master account. Your existing device data stays local until you explicitly upload it.</p><div id="fmAuthStatus" class="notice">Checking Firebase connection…</div><div class="formgrid"><div class="field"><label>Email</label><input id="fmEmail" type="email" autocomplete="username" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="fmPassword" type="password" autocomplete="current-password" placeholder="At least 6 characters"></div></div><div class="formactions" style="justify-content:flex-start;flex-wrap:wrap"><button class="primary" onclick="window.fmSignIn()">Sign in</button><button class="pill" onclick="window.fmSignUp()">Create account</button><button class="pill" onclick="window.fmSignOut()">Sign out</button></div><div style="height:1px;background:var(--line);margin:16px 0"></div><div class="notice"><b>Protect your data:</b> Export a full JSON backup before the first upload or before replacing local data. First upload/download requires your action; after the cloud copy is connected, new changes sync automatically. If two devices change data at the same time, sync pauses rather than silently overwriting either copy. Keep your password private.</div><div class="formactions" style="justify-content:flex-start;flex-wrap:wrap"><button class="primary goldbtn" onclick="window.fmUploadLocal()">Upload this device to cloud</button><button class="pill" onclick="window.fmDownloadCloud()">Download cloud data to this device</button></div><p class="sub">If sign-in is blocked after deployment, add <b>finance-master-starter.vercel.app</b> under Firebase Authentication → Settings → Authorized domains.</p></section><section class="panel"><h2 style="font-size:15px;margin-top:0">Data controls</h2><p class="sub">Reset permanently deletes the records stored in this browser. Export a backup first.</p><button class="pill" style="color:var(--red)" onclick="resetData()">Reset local data</button></section></div>`}
function editTx(id){
 const t=state.transactions.find(x=>x.id===id);
 if(!t){toast('Transaction not found');return}
 const categories=['Salary','Food','Housing','Transport','Shopping','Health','Bonus','Other'];
 const options=categories.map(x=>'<option '+((t.category||'Other')===x?'selected':'')+'>'+x+'</option>').join('');
 openModal(t.type==='income'?'Edit income':'Edit expense',
 '<form id="editTxForm"><div class="formgrid">'+
 '<div class="field full"><label>Description</label><input name="title" required value="'+escapeHtml(t.title||'')+'"></div>'+
 '<div class="field"><label>Amount ('+state.currency+')</label><input name="amount" type="number" min="0.01" step="0.01" required value="'+Number(t.amount||0)+'"></div>'+
 '<div class="field"><label>Date</label><input name="date" type="date" required value="'+escapeHtml(t.date||today())+'"></div>'+
 '<div class="field full"><label>Category</label><select name="category">'+options+'</select></div>'+
 '<div class="field full"><label>Note</label><input name="note" value="'+escapeHtml(t.note||'')+'"></div></div>'+
 '<div class="formactions"><button type="button" class="pill" onclick="closeModal()">Cancel</button><button class="primary" type="submit">Save changes</button></div></form>');
 const form=document.getElementById('editTxForm');
 form.onsubmit=function(e){e.preventDefault();const d=new FormData(form),amount=Number(d.get('amount')),title=String(d.get('title')||'').trim();if(!title||!Number.isFinite(amount)||amount<=0){toast('Enter a valid description and amount');return}Object.assign(t,{title,amount,date:d.get('date'),category:d.get('category'),note:d.get('note')});save();closeModal();render();toast('Transaction updated')};
}
function deleteTx(id){if(confirm('Delete this transaction? This cannot be undone. Export a backup first if needed.')){state.transactions=state.transactions.filter(t=>t.id!==id);save();render();toast('Transaction deleted')}}
function editLoan(kind,id){
 const list=kind==='loan'?state.loans:state.debts;
 const l=list.find(x=>x.id===id);
 if(!l){toast('Account not found');return}
 const periodOptions=['monthly','yearly','none'].map(p=>'<option value="'+p+'" '+(l.period===p?'selected':'')+'>'+(p==='none'?'No interest':p==='yearly'?'Yearly':'Monthly')+'</option>').join('');
 const methodOptions=['simple','compound'].map(p=>'<option value="'+p+'" '+((l.method||'simple')===p?'selected':'')+'>'+(p==='simple'?'Simple interest':'Compound interest')+'</option>').join('');
 openModal(kind==='loan'?'Edit loan account':'Edit debt account',
 '<form id="editLoanForm"><div class="formgrid">'+
 '<div class="field full"><label>Person / Institution</label><input name="person" required value="'+escapeHtml(l.person||'')+'"></div>'+
 '<div class="field"><label>Principal ('+state.currency+')</label><input name="principal" type="number" min="0" step="0.01" required value="'+Number(l.principal||0)+'"></div>'+
 '<div class="field"><label>Interest rate (%)</label><input name="rate" type="number" min="0" step="0.01" required value="'+Number(l.rate||0)+'"></div>'+
 '<div class="field"><label>Interest period</label><select name="period">'+periodOptions+'</select></div>'+
 '<div class="field"><label>Interest method</label><select name="method">'+methodOptions+'</select></div>'+
 '<div class="field"><label>Interest starts</label><input name="start" type="date" value="'+escapeHtml(l.start||'')+'"></div>'+
 '<div class="field"><label>Interest stops</label><input name="stop" type="date" value="'+escapeHtml(l.stop||'')+'"></div>'+
 '<div class="field"><label>Due date</label><input name="due" type="date" value="'+escapeHtml(l.due||'')+'"></div>'+
 '<div class="field full"><label>Notes</label><input name="note" value="'+escapeHtml(l.note||'')+'"></div></div>'+
 '<div class="formactions"><button type="button" class="pill" onclick="closeModal()">Cancel</button><button class="primary" type="submit">Save changes</button></div></form>');
 const form=document.getElementById('editLoanForm');
 form.onsubmit=function(e){
  e.preventDefault();
  const d=new FormData(form),principal=Number(d.get('principal')),rate=Number(d.get('rate')),person=String(d.get('person')||'').trim();
  if(!person||!Number.isFinite(principal)||principal<0||!Number.isFinite(rate)||rate<0){toast('Please enter valid account details');return}
  Object.assign(l,{person,principal,rate,period:d.get('period'),method:d.get('method'),start:d.get('start'),stop:d.get('stop'),due:d.get('due'),note:d.get('note')});
  l.principalPaid=Math.min(principal,Number(l.principalPaid||0));
  save();closeModal();render();toast('Account updated');
 };
}
function deleteLoan(kind,id){if(!confirm('Delete this account? Related payment history will remain but may show Account removed.'))return;state[kind==='loan'?'loans':'debts']=state[kind==='loan'?'loans':'debts'].filter(x=>x.id!==id);save();render();toast('Account deleted')}
function exportData(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString(),formatVersion:1},null,2)],{type:'application/json'});download(blob,'finance-master-backup-'+today()+'.json')}
function exportCSV(){const rows=[['Date','Type','Description','Category','Amount','Note'],...state.transactions.map(t=>[t.date,t.type,t.title,t.category,t.amount,t.note||''])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'finance-master-transactions-'+today()+'.csv')}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function restoreData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const incoming=JSON.parse(reader.result);if(!incoming||!Array.isArray(incoming.transactions))throw Error('Invalid backup');if(!confirm('Restore backup and replace the records currently stored on this device? Export current data first if you need it.'))return;state={currency:incoming.currency||'THB',transactions:incoming.transactions||[],loans:incoming.loans||[],debts:incoming.debts||[],savings:incoming.savings||[],budgets:incoming.budgets||[],payments:incoming.payments||[]};save();render();toast('Backup restored')}catch(err){alert('Could not restore: this file is not a valid Finance Master backup.')}};reader.readAsText(file)}
function resetData(){if(!confirm('Permanently delete ALL local Finance Master records on this device? Export a backup first.'))return;state={currency:state.currency,transactions:[],loans:[],debts:[],savings:[],budgets:[],payments:[]};save();render();toast('Local records reset')}
function render(){const el=document.getElementById('content');switch(current){case'Dashboard':el.innerHTML=dashboard();break;case'Income':el.innerHTML=transactionsPage('income');break;case'Expenses':el.innerHTML=transactionsPage('expense');break;case'Savings':el.innerHTML=savingsPage();break;case'Loans':el.innerHTML=loansPage('loan');break;case'Debts':el.innerHTML=loansPage('debt');break;case'Payments':el.innerHTML=paymentsPage();break;case'Budget':el.innerHTML=budgetPage();break;case'Reports':el.innerHTML=reportsPage();break;case'Settings':el.innerHTML=settingsPage();break;default:el.innerHTML=dashboard()}}
render();
window.fmApp={getState:()=>state,replaceState:(next)=>{state=next;save();render()},hasLocalRecords:()=>Boolean((state.transactions||[]).length||(state.loans||[]).length||(state.debts||[]).length||(state.savings||[]).length||(state.budgets||[]).length||(state.payments||[]).length),toast};
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDCNyu8OFTZ2gAxq5lCbpTDd_bUTyO8Rr0",
  authDomain: "finance-master-8d227.firebaseapp.com",
  projectId: "finance-master-8d227",
  storageBucket: "finance-master-8d227.firebasestorage.app",
  messagingSenderId: "881817485868",
  appId: "1:881817485868:web:2135de290e0a1150274789"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let currentUser = null;
const status = (message, bad=false) => {
  const el = document.getElementById('fmAuthStatus');
  if (el) { el.textContent = message; el.style.background = bad ? '#fff0f0' : '#fff8e8'; el.style.color = bad ? '#a62d2d' : '#795d26'; }
};
const emailValue = () => (document.getElementById('fmEmail')?.value || '').trim();
const passwordValue = () => document.getElementById('fmPassword')?.value || '';
const cloudRef = uid => doc(db, 'users', uid, 'finance', 'data');
const errText = e => {
  const map = {
    'auth/email-already-in-use':'This email already has an account. Sign in instead.',
    'auth/invalid-email':'Please enter a valid email address.',
    'auth/weak-password':'Password must be at least 6 characters.',
    'auth/invalid-credential':'Email or password is incorrect.',
    'auth/operation-not-allowed':'Email/Password sign-in is not enabled in Firebase Authentication.',
    'auth/unauthorized-domain':'This website domain is not authorized in Firebase Authentication settings.',
    'permission-denied':'Firestore denied access. Check the user-only Security Rules.',
    'unavailable':'Firebase is temporarily unavailable. Check your connection and try again.'
  };
  return map[e?.code] || (e?.message || 'An unexpected Firebase error occurred.');
};
window.fmSignUp = async () => {
  const email=emailValue(), password=passwordValue();
  if (!email || password.length < 6) return status('Enter a valid email and a password with at least 6 characters.', true);
  try { await createUserWithEmailAndPassword(auth,email,password); status('Account created and signed in. Export a backup, then you can upload your local records.'); }
  catch(e) { status(errText(e),true); }
};
window.fmSignIn = async () => {
  const email=emailValue(), password=passwordValue();
  if (!email || !password) return status('Enter your email and password.',true);
  try { await signInWithEmailAndPassword(auth,email,password); status('Signed in. Your local records have not been changed.'); }
  catch(e) { status(errText(e),true); }
};
window.fmSignOut = async () => {
  try { await signOut(auth); status('Signed out. Local data remains on this device.'); }
  catch(e) { status(errText(e),true); }
};
window.fmUploadLocal = async () => {
  if (!currentUser) return status('Sign in first to upload data.',true);
  if (!confirm('Before uploading, export a full JSON backup from Settings. Continue with uploading the records currently on this device to your private cloud account?')) return;
  try {
    const ref=cloudRef(currentUser.uid), snap=await getDoc(ref);
    if (snap.exists() && !confirm('Cloud data already exists. Replace the cloud copy with this device’s data? This cannot be undone from this screen. Cancel to keep the cloud copy.')) return;
    const data=window.fmApp.getState();
    await setDoc(ref,{data, schemaVersion:1, ownerUid:currentUser.uid, updatedAt:serverTimestamp()});
    syncConflict=false; syncReady=true; localDirty=false; lastCloudSignature=stateSignature(data);
    status('Upload complete. Your device data was copied to your cloud account. Live sync is active.');
    window.fmApp.toast('Cloud backup uploaded');
  } catch(e) { status(errText(e),true); }
};
window.fmDownloadCloud = async () => {
  if (!currentUser) return status('Sign in first to download cloud data.',true);
  try {
    const snap=await getDoc(cloudRef(currentUser.uid));
    if (!snap.exists()) return status('No cloud backup found for this account. Your local data was not changed. Upload this device’s data if this is your first sync.',true);
    const payload=snap.data()?.data;
    if (!payload || !Array.isArray(payload.transactions)) return status('Cloud backup format is invalid. Local data was not changed.',true);
    if (window.fmApp.hasLocalRecords() && !confirm('This will replace the records on this device with the cloud copy. Export a JSON backup first if you need to keep the current local records. Continue?')) return;
    const safeState={
      currency: ['THB','MMK','USD','SGD'].includes(payload.currency) ? payload.currency : 'THB',
      transactions:Array.isArray(payload.transactions)?payload.transactions:[],
      loans:Array.isArray(payload.loans)?payload.loans:[],
      debts:Array.isArray(payload.debts)?payload.debts:[],
      savings:Array.isArray(payload.savings)?payload.savings:[],
      budgets:Array.isArray(payload.budgets)?payload.budgets:[],
      payments:Array.isArray(payload.payments)?payload.payments:[]
    };
    applyingRemote=true;
    window.fmApp.replaceState(safeState);
    applyingRemote=false;
    syncConflict=false; syncReady=true; localDirty=false; lastCloudSignature=stateSignature(safeState);
    status('Cloud data downloaded to this device. Live sync is active. Review your records and export a backup.');
    window.fmApp.toast('Cloud data downloaded');
  } catch(e) { status(errText(e),true); }
};
let stopCloudListener=null;
let applyingRemote=false;
let syncReady=false;
let localDirty=false;
let syncConflict=false;
let syncTimer=null;
let lastCloudSignature='';
let initialSnapshotHandled=false;
const stateSignature = value => JSON.stringify({
  currency:value?.currency || 'THB',
  transactions:Array.isArray(value?.transactions)?value.transactions:[],
  loans:Array.isArray(value?.loans)?value.loans:[],
  debts:Array.isArray(value?.debts)?value.debts:[],
  savings:Array.isArray(value?.savings)?value.savings:[],
  budgets:Array.isArray(value?.budgets)?value.budgets:[],
  payments:Array.isArray(value?.payments)?value.payments:[]
});
const normalizeState = payload => ({
  currency:['THB','MMK','USD','SGD'].includes(payload?.currency)?payload.currency:'THB',
  transactions:Array.isArray(payload?.transactions)?payload.transactions:[],
  loans:Array.isArray(payload?.loans)?payload.loans:[],
  debts:Array.isArray(payload?.debts)?payload.debts:[],
  savings:Array.isArray(payload?.savings)?payload.savings:[],
  budgets:Array.isArray(payload?.budgets)?payload.budgets:[],
  payments:Array.isArray(payload?.payments)?payload.payments:[]
});
const writeCurrentState = async () => {
  if(!currentUser || !syncReady || applyingRemote || !localDirty) return;
  const data=window.fmApp.getState();
  const signature=stateSignature(data);
  if(signature===lastCloudSignature){localDirty=false;return;}
  try {
    await setDoc(cloudRef(currentUser.uid),{data,schemaVersion:1,ownerUid:currentUser.uid,updatedAt:serverTimestamp()});
    lastCloudSignature=signature;
    localDirty=false;
    status('Cloud sync is live. Changes are syncing automatically.');
  } catch(e) {
    status('Auto-sync failed: '+errText(e)+'. Your data is still saved on this device.',true);
  }
};
window.fmScheduleSync = () => {
  if(!currentUser || !syncReady || applyingRemote || syncConflict) return;
  localDirty=true;
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer=setTimeout(writeCurrentState,900);
};
const startCloudListener = user => {
  if(stopCloudListener){stopCloudListener();stopCloudListener=null;}
  syncReady=false; syncConflict=false; initialSnapshotHandled=false; localDirty=false; lastCloudSignature='';
  if(!user) return;
  stopCloudListener=onSnapshot(cloudRef(user.uid), async snap => {
    if(!currentUser || currentUser.uid!==user.uid) return;
    if(!snap.exists()){
      if(!initialSnapshotHandled){
        initialSnapshotHandled=true;
        status('Signed in. No cloud backup found yet. Export a JSON backup, then use Upload this device to cloud.');
      }
      return;
    }
    const payload=snap.data()?.data;
    if(!payload || !Array.isArray(payload.transactions)){
      status('Cloud data format is invalid. Local records were not changed.',true);return;
    }
    const remote=normalizeState(payload);
    const remoteSignature=stateSignature(remote);
    const local=window.fmApp.getState();
    const localSignature=stateSignature(local);
    if(!initialSnapshotHandled){
      initialSnapshotHandled=true;
      if(remoteSignature!==localSignature && window.fmApp.hasLocalRecords()){
        const useCloud=confirm('Cloud data and this device data are different. OK = replace this device with cloud data. Cancel = keep this device and upload its data to cloud.');
        if(useCloud){
          applyingRemote=true;window.fmApp.replaceState(remote);applyingRemote=false;
          lastCloudSignature=remoteSignature;localDirty=false;
        } else {
          syncReady=true;localDirty=true;await writeCurrentState();
        }
      } else if(remoteSignature!==localSignature){
        applyingRemote=true;window.fmApp.replaceState(remote);applyingRemote=false;
        lastCloudSignature=remoteSignature;localDirty=false;
      } else {
        lastCloudSignature=remoteSignature;
      }
      syncReady=true;
      status('Cloud sync is live. Changes on signed-in devices update automatically.');
      return;
    }
    if(snap.metadata?.hasPendingWrites) return;
    if(syncConflict) return;
    if(remoteSignature===lastCloudSignature) return;
    if(localDirty){
      // Do not overwrite either side when both devices changed the shared document.
      if(syncTimer){clearTimeout(syncTimer);syncTimer=null;}
      syncReady=false; syncConflict=true; localDirty=false;
      status('Sync paused to protect data: this device and cloud changed at the same time. Export a JSON backup, then choose Upload or Download only after reviewing which copy to keep.',true);
      return;
    }
    if(remoteSignature!==localSignature){
      applyingRemote=true;window.fmApp.replaceState(remote);applyingRemote=false;
      lastCloudSignature=remoteSignature;
      status('New cloud changes received. This device is up to date.');
      window.fmApp.toast('Cloud changes received');
    }
  }, e => {
    syncReady=false;
    status('Live sync connection failed: '+errText(e)+'. Local data is still available.',true);
  });
};
onAuthStateChanged(auth, user => {
  currentUser=user;
  if(syncTimer){clearTimeout(syncTimer);syncTimer=null;}
  localDirty=false;
  startCloudListener(user);
  if(user) status('Signed in as '+user.email+'. Connecting live cloud sync…');
  else status('Not signed in. Create an account or sign in to enable cloud sync.');
});
</script>
