/* Mobile overflow hardening */
.app,.main,.content,.layout,.panel,.metric,.setting,.account-card,.account-main,.account-balance,.person-title,.person-tab-content,.detail-item,.panelhead,.pagehead,.welcome,.toolbar,.topactions{min-width:0;max-width:100%}
.content *,.modal *,.mobile-more-panel *{min-width:0}
h1,h2,h3,p,small,b,strong,label,button,a,span,td,th,.notice,.setting,.empty{overflow-wrap:anywhere}
button,.primary,.pill,.linkbtn,.toolbar button,.formactions button{max-width:100%;white-space:normal;line-height:1.35}
input,select,textarea{min-width:0;max-width:100%}
.tablewrap,.ledger-table,.person-payments{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{max-width:100%}
img,svg,canvas,video{max-width:100%}
@media(max-width:700px){
  .content{width:100%;padding-left:12px;padding-right:12px}
  .welcome,.pagehead,.panelhead{flex-wrap:wrap}
  .welcome>.primary{white-space:normal;max-width:100%}
  .welcome h1,.pagehead h1,.person-title h1{overflow-wrap:anywhere;word-break:normal}
  .cards,.person-metrics,.ledger-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric{padding:12px 10px}
  .metric strong,.content .metric strong{font-size:clamp(12px,3.6vw,16px);line-height:1.25;letter-spacing:-.25px;overflow-wrap:anywhere;word-break:normal}
  .metrichead{flex-wrap:wrap}
  .account-open{min-width:0;flex-wrap:wrap}
  .account-main{flex:1 1 100px}
  .account-balance{max-width:100%;overflow-wrap:anywhere}
  .account-balance>b{font-size:clamp(11px,3.2vw,14px);overflow-wrap:anywhere}
  .detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .detail-item b{overflow-wrap:anywhere;word-break:normal}
  .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quick button{min-width:0}
  .toolbar{width:100%}
  .toolbar>*{max-width:100%;min-width:0}
  .formgrid,.settingsgrid{grid-template-columns:minmax(0,1fr)}
  .modal{width:100%;max-width:540px;padding:18px}
  .formactions{flex-wrap:wrap}
  .topbar{min-width:0;gap:6px}
  .crumb{min-width:0;overflow-wrap:anywhere}
  .mobile-nav button{min-width:0;overflow-wrap:anywhere}
}
@media(max-width:360px){
  .content{padding-left:9px;padding-right:9px}
  .cards,.person-metrics,.ledger-metrics{gap:8px}
  .metric{padding:10px 8px}
  .metric strong,.content .metric strong{font-size:12px;letter-spacing:-.3px}
  .panel{padding:12px}
  .account-open{padding:10px}
}


/* Finance Master mobile fit pass: layout-only, no data or currency logic changes */

body,.app,.main,.content,.panel,.metric,.layout,.cards,.settingsgrid,.person-page,.person-metrics,.ledger-metrics{min-width:0}
.content,.panel,.metric,.setting,.account-card,.person-page,.person-tab-content{overflow-wrap:anywhere}
.metric strong,.metric .sub,.account-balance,.account-balance>b,.detail-item b,.person-metrics strong,.ledger-metrics strong{max-width:100%;overflow-wrap:anywhere;word-break:normal;font-variant-numeric:tabular-nums}
.cards>.metric,.person-metrics>*,.ledger-metrics>*,.layout>*{min-width:0;max-width:100%}

.metrichead>*,.panelhead>*,.pagehead>*,.welcome>*,.account-open>*,.account-actions>*,.person-quick-actions>*,.database-actions>*{min-width:0;max-width:100%}
.field,.field label,.field input,.field select,.field textarea,.formgrid,.formactions{min-width:0;max-width:100%}
.field input,.field select,.field textarea{overflow-wrap:anywhere}

.tablewrap td,.tablewrap th,.ledger-table td,.ledger-table th,.person-payments td,.person-payments th{white-space:nowrap}

<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2 id="modalTitle">Add record</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>

<script>
const KEY='finance-master-personal-v1';
const today=()=>new Date().toISOString().slice(0,10);
const fmt=(n,currency=state.currency||'THB')=>new Intl.NumberFormat('en-US',{style:'currency',currency:['THB','MMK','USD','SGD'].includes(currency)?currency:'THB',maximumFractionDigits:2}).format(Number(n)||0);
const recordCurrency=x=>['THB','MMK','USD','SGD'].includes(x?.currency)?x.currency:null;
const moneyFor=(n,x)=>fmt(n,recordCurrency(x)||state.currency||'THB');
const currencyLabel=c=>({THB:'THB ฿',MMK:'MMK K',USD:'USD $',SGD:'SGD $'}[c]||c||'Unclassified');
let state={currency:'THB',transactions:[],loans:[],debts:[],savings:[],budgets:[],payments:[]};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)state={...state,...s}}catch(e){}
let current='Dashboard';
function save(){localStorage.setItem(KEY,JSON.stringify(state));const el=document.getElementById('saveStatus');if(el)el.textContent='● Saved on this device';if(window.fmScheduleSync)window.fmScheduleSync(state)}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(p){current=p;const more=document.getElementById('mobileMorePanel');if(more)more.classList.remove('open');render();if(window.scrollTo)window.scrollTo({top:0,behavior:'auto'});}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function toggleMobile(){const p=document.getElementById('mobileMorePanel');if(!p)return;p.classList.toggle('open')}
function total(type,currency=state.currency||'THB'){return state.transactions.filter(t=>t.type===type&&recordCurrency(t)===currency).reduce((a,t)=>a+Number(t.amount||0),0)}
function outstanding(list,currency=state.currency||'THB'){return list.filter(l=>recordCurrency(l)===currency).reduce((s,l)=>s+Math.max(0,Number(l.principal||0)-Number(l.principalPaid||0)),0)}
function legacyCurrencyCount(){const lists=['transactions','loans','debts','savings','budgets','payments'];return lists.reduce((n,k)=>n+(state[k]||[]).filter(x=>!recordCurrency(x)).length,0)}
function reviewLegacyCurrencies(){const groups=[['transactions','Transactions'],['loans','Loans given'],['debts','My debts'],['savings','Savings goals'],['budgets','Budgets']];let changed=0;for(const [key,label] of groups){for(const item of (state[key]||[])){if(recordCurrency(item))continue;const amount=key==='transactions'?item.amount:key==='loans'||key==='debts'?item.principal:key==='savings'?item.saved:item.limit;const name=key==='transactions'?item.title:key==='loans'||key==='debts'?item.person:key==='savings'?item.name:item.category;const answer=prompt(label+' — '+String(name||'Unnamed record')+' — amount '+String(amount??'')+'\\nEnter THB, MMK, USD or SGD. Leave blank to skip this record.');if(answer===null){save();render();toast('Review paused. Your labels were saved.');return}const c=String(answer).trim().toUpperCase();if(!c)continue;if(!['THB','MMK','USD','SGD'].includes(c)){alert('Invalid currency. This record was left unchanged.');continue}item.currency=c;changed++}}for(const p of (state.payments||[])){const account=(state[p.kind==='loan'?'loans':'debts']||[]).find(a=>a.id===p.account);if(account&&recordCurrency(account)&&p.currency!==account.currency){p.currency=account.currency;changed++}}save();render();toast(changed+' currency label(s) saved. No amounts were converted.');}

function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalback').classList.add('show')}
function closeModal(){document.getElementById('modalback').classList.remove('show')}
function currencyField(selected=state.currency||'THB',name='currency'){return '<div class="field"><label>Currency for this record</label><select name="'+name+'" required>'+[['THB','Thai Baht (THB ฿)'],['MMK','Myanmar Kyat (MMK K)'],['USD','US Dollar (USD $)'],['SGD','Singapore Dollar (SGD $)']].map(([v,l])=>'<option value="'+v+'" '+((selected||'THB')===v?'selected':'')+'>'+l+'</option>').join('')+'</select><small class="sub">This currency applies only to this record.</small></div>'}
function field(label,name,type='text',value='',opts=''){return `<div class="field"><label>${label}</label>${type==='select'?`<select name="${name}" required>${opts}</select>`:`<input name="${name}" type="${type}" value="${escapeHtml(value)}" ${type==='number'?'min="0" step="0.01"':''} required`+`>`}</div>`}

function slipUploadMarkup(formId){
 return '<div class="field full" style="border:1px dashed var(--line);border-radius:12px;padding:12px"><label>Bank QR slip / payment receipt (auto-read)</label><input type="file" accept="image/*" onchange="readBankSlip(this,\''+formId+'\')" style="max-width:100%"><small class="sub" style="display:block;margin-top:6px">Upload a bank transfer receipt image. Amount and remark will be read automatically; please verify them before saving.</small><div id="slipStatus_'+formId+'" class="sub" style="margin-top:8px"></div></div>';
}
let fmOcrPromise=null;
async function getSlipOcr(){
 if(window.Tesseract)return window.Tesseract;
 if(!fmOcrPromise)fmOcrPromise=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=()=>resolve(window.Tesseract);s.onerror=()=>reject(new Error('Could not load OCR engine. Check internet connection and try again.'));document.head.appendChild(s)});
 return fmOcrPromise;
}
async function getSlipOcrWorker(){
 const T=await getSlipOcr();
 // Download trained language data on demand; include Myanmar for Burmese-language memos.
 return await T.createWorker(['eng','tha','mya'],1,{logger:m=>{}});
}
function parseSlipText(text){
 const thaiDigits={'๐':'0','๑':'1','๒':'2','๓':'3','๔':'4','๕':'5','๖':'6','๗':'7','๘':'8','๙':'9'};
 const normalized=String(text||'').replace(/[๐-๙]/g,ch=>thaiDigits[ch]||ch).replace(/[฿]/g,' THB ');
 const lines=normalized.split(/\r?\n/).map(x=>x.replace(/[|]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
 const full=lines.join('\n');
 let amount=null;
 const amountLabels=/(?:transfer\s*amount|transaction\s*amount|amount|ยอดเงินที่โอน|จำนวนเงิน|จำนวนที่โอน|ยอดโอน|โอนเงิน|เงินที่โอน|ยอดชำระ|ยอดเงิน|จำนวน|amount\s*\(thb\))/i;
 const numberRe=/(?:THB\s*)?([0-9][0-9,]*(?:\.[0-9]{1,2})?)(?:\s*(?:THB|บาท))?/gi;
 for(let i=0;i<lines.length;i++){
   if(amountLabels.test(lines[i])){
     const candidates=[lines[i],lines[i+1]||''].join(' ');
     const matches=[...candidates.matchAll(numberRe)];
     const vals=matches.map(x=>Number(x[1].replace(/,/g,''))).filter(n=>n>0&&n<1e10);
     if(vals.length){amount=vals[vals.length-1];break}
   }
 }
 if(amount===null){
   const matches=[...full.matchAll(/(?:THB\s*|บาท\s*)([0-9][0-9,]*(?:\.[0-9]{1,2})?)/gi)];
   const vals=matches.map(x=>Number(x[1].replace(/,/g,''))).filter(n=>n>0&&n<1e10);
   if(vals.length)amount=vals[0];
 }
 if(amount===null){
   const decimals=[...full.matchAll(/\b([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{2})|[0-9]+\.[0-9]{2})\b/g)]
     .map(x=>Number(x[1].replace(/,/g,''))).filter(n=>n>0&&n<1e10);
   if(decimals.length)amount=decimals.sort((a,b)=>b-a)[0];
 }
 let remark='';
 const remarkLabels=/(?:remark|payment\s*note|note|memo|message|หมายเหตุ|บันทึกช่วยจำ|รายละเอียด|ข้อความถึงผู้รับ|วัตถุประสงค์|บันทึก|ข้อความ)/i;
 for(let i=0;i<lines.length;i++){
   const line=lines[i], at=line.search(remarkLabels);
   if(at>=0){
     let value=line.slice(at).replace(remarkLabels,'').replace(/^\s*[:：-]?\s*/,'').trim();
     if(!value && lines[i+1])value=lines[i+1];
     if(value && !/^(?:amount|ยอดเงิน|วันที่|date|time|reference|เลขที่|transaction|fee|ค่าธรรมเนียม|balance|ยอดคงเหลือ)/i.test(value)){remark=value;break}
   }
 }
 if(remark.length>120)remark=remark.slice(0,120).trim();
 return {amount,remark,text:full};
}
function inferExpenseCategory(text){
 const t=(text||'').toLowerCase();
 if(/food|meal|restaurant|coffee|อาหาร|ข้าว|ร้านอาหาร|กาแฟ/.test(t))return 'Food';
 if(/rent|room|housing|electric|water|ค่าเช่า|ห้องพัก|ค่าไฟ|ค่าน้ำ/.test(t))return 'Housing';
 if(/transport|taxi|grab|fuel|gas|รถ|น้ำมัน|เดินทาง|ค่าโดยสาร/.test(t))return 'Transport';
 if(/shopping|purchase|สินค้า|ซื้อของ|ช้อป/.test(t))return 'Shopping';
 if(/health|hospital|clinic|ยา|โรงพยาบาล|คลินิก/.test(t))return 'Health';
 return 'Other';
}
async function readBankSlip(input,formId){
 const file=input.files&&input.files[0], form=document.getElementById(formId), statusEl=document.getElementById('slipStatus_'+formId);
 if(!file||!form||!statusEl)return;
 if(!file.type.startsWith('image/')){statusEl.textContent='Please choose an image file.';return}
 statusEl.textContent='Reading slip… This may take a little while on a phone.';
 try{
   const worker=await getSlipOcrWorker();
   const result=await worker.recognize(file);
   await worker.terminate();
   const parsed=parseSlipText(result.data.text||'');
   const set=(name,value)=>{const el=form.elements.namedItem(name);if(el&&value!==null&&value!==undefined&&String(value).trim()!=='')el.value=value};
   if(parsed.amount!==null)set('amount',parsed.amount);
   if(parsed.remark){
     set('note',parsed.remark);
     if(formId==='txForm')set('title',parsed.remark);
   }
   if(formId==='txForm'&&parsed.remark){const cat=form.elements.namedItem('category');if(cat)cat.value=inferExpenseCategory(parsed.remark)}
   const found=[];
   if(parsed.amount!==null)found.push('Amount: '+parsed.amount.toLocaleString()+' '+state.currency);else found.push('Amount not detected — enter it manually.');
   if(parsed.remark)found.push('Remark: '+parsed.remark);else found.push('Remark not detected — enter it manually.');
   const ocrPreview=(parsed.text||'').replace(/\s+/g,' ').trim().slice(0,260);
   statusEl.textContent='Slip scanned. '+found.join(' · ')+' Please verify the fields before saving.'+(ocrPreview?' OCR text: '+ocrPreview:' No readable text found. Try a sharper, full slip image with all edges visible.');
 }catch(e){statusEl.textContent='Could not read this image automatically: '+(e.message||e)+'. You can still enter the fields manually.'}
}
function addTransaction(type){openModal(type==='income'?'Add income':'Add expense',`<form id="txForm"><div class="formgrid">${field('Description','title')}${field('Amount','amount','number')}${currencyField()}${field('Date','date','date',today())}${field('Category','category','select','','<option>Salary</option><option>Food</option><option>Housing</option><option>Transport</option><option>Shopping</option><option>Health</option><option>Bonus</option><option>Other</option>')}<div class="field full"><label>Note (optional)</label><input name="note" placeholder="Add details..."></div>${type==='expense'?slipUploadMarkup('txForm'):''}</div><div class="formactions"><button type="button" class="pill" onclick="closeModal()">Cancel</button><button class="primary">Save record</button></div></form>`);document.getElementById('txForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.transactions.unshift({id:crypto.randomUUID(),type,title:f.get('title'),amount:Number(f.get('amount')),currency:f.get('currency')||state.currency||'THB',date:f.get('date'),category:f.get('category'),note:f.get('note')});save();closeModal();render();toast('Record saved')}}
function addLoan(kind){const isLoan=kind==='loan';openModal(isLoan?'Add loan given':'Add debt I owe',`<form id="loanForm"><div class="formgrid">${field('Person / Institution','person')}${field('Principal','principal','number')}${currencyField()}${field('Interest rate (%)','rate','number','0')}${field('Interest period','period','select','','<option value="monthly">Monthly</option><option value="yearly">Yearly</option><option value="none">No interest</option>')}${field('Interest starts','start','date',today())}${field('Interest stops (optional)','stop','date','')}${field('Due date (optional)','due','date','')}<div class="field full"><label>Interest method</label><select name="method"><option value="simple">Simple interest (not compounded)</option><option value="compound">Compound interest</option></select></div><div class="field full"><label>Notes</label><input name="note" placeholder="Agreement, purpose, details"></div></div><div class="formactions"><button type="button" class="pill" onclick="closeModal()">Cancel</button><button class="primary">Save record</button></div></form>`);document.getElementById('loanForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const l={id:crypto.randomUUID(),person:f.get('person'),principal:Number(f.get('principal')),currency:f.get('currency')||state.currency||'THB',principalPaid:0,rate:Number(f.get('rate')),period:f.get('period'),start:f.get('start'),stop:f.get('stop'),due:f.get('due'),method:f.get('method'),note:f.get('note'),created:today()};(isLoan?state.loans:state.debts).unshift(l);save();closeModal();render();toast('Financial record saved')}}
function allocatePayment(kind,l,amount,date,apply){
  if(!recordCurrency(l))return {error:'Please label this account currency in Settings before recording a payment.'};
  const ledger=loanLedger(kind,l,date);
  const principalLeft=Math.max(0,Number(ledger.principalOutstanding)||0);
  const interestLeft=Math.max(0,Number(ledger.interestOutstanding)||0);
  const eps=0.004;
  if(apply==='auto'&&amount>principalLeft+interestLeft+eps)return {error:'Payment is larger than the outstanding principal plus interest ('+fmt(principalLeft+interestLeft)+'). Reduce the amount or choose “Other / mixed” to record it without changing the balance.'};
  if(apply==='interest'&&amount>interestLeft+eps)return {error:'Interest outstanding on this date is '+fmt(interestLeft)+'. Enter no more than that amount, or choose “Other / mixed” to record a separate amount.'};
  if(apply==='principal'&&amount>principalLeft+eps)return {error:'Principal outstanding on this date is '+fmt(principalLeft)+'. Enter no more than that amount, or choose “Other / mixed” to record a separate amount.'};
  const interestApplied=apply==='auto'?Math.min(amount,interestLeft):apply==='interest'?amount:0;
  const principalApplied=apply==='auto'?Math.min(principalLeft,Math.max(0,amount-interestApplied)):apply==='principal'?amount:0;
  return {interestApplied,principalApplied};
}

function loanAddMonths(start,n){const d=new Date(start+'T00:00:00Z');const day=d.getUTCDate();const target=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+n,1));const last=new Date(Date.UTC(target.getUTCFullYear(),target.getUTCMonth()+1,0)).getUTCDate();target.setUTCDate(Math.min(day,last));return target.toISOString().slice(0,10)}
function loanMonthlyRate(l){if(!l||!Number(l.rate)||l.period==='none')return 0;return Number(l.rate)/100/(l.period==='yearly'?12:1)}
function loanLedger(kind,l,throughDate=today(),excludePaymentId=''){
 const through=String(throughDate||today()).slice(0,10),start=String(l.start||l.created||today()).slice(0,10);
 const events=[];
 const rate=loanMonthlyRate(l);
 if(rate>0&&start<=through){for(let n=1;n<600;n++){const due=loanAddMonths(start,n);if(due>through||(l.stop&&due>String(l.stop).slice(0,10)))break;events.push({date:due,type:'due',n})}}
 (state.payments||[]).filter(p=>p.kind===kind&&p.account===l.id&&p.id!==excludePaymentId&&String(p.date||'')>=start&&String(p.date||'').slice(0,10)<=through).forEach(p=>events.push({date:String(p.date||start).slice(0,10),type:'payment',p}));
 events.sort((a,b)=>a.date.localeCompare(b.date)||(a.type===b.type?0:a.type==='due'?-1:1));
 let principal=Math.max(0,Number(l.principal)||0);const buckets=[];
 const applyInterest=amount=>{let left=Math.max(0,Number(amount)||0);for(const b of buckets){if(left<=0)break;const paid=Math.min(b.remaining,left);b.remaining=Math.max(0,b.remaining-paid);left-=paid}return left};
 for(const ev of events){
  if(ev.type==='due'){const compoundBase=principal+((l.method||'simple')==='compound'?buckets.reduce((sum,b)=>sum+Math.max(0,b.remaining),0):0);const amount=Math.max(0,compoundBase*rate);if(amount>0)buckets.push({date:ev.date,remaining:amount,original:amount});continue}
  const p=ev.p,amount=Math.max(0,Number(p.amount)||0);
  if(p.apply==='interest'){applyInterest(amount);continue}
  if(p.apply==='principal'){principal=Math.max(0,principal-amount);continue}
  if(p.interestApplied!==undefined||p.principalApplied!==undefined){applyInterest(Number(p.interestApplied)||0);principal=Math.max(0,principal-(Number(p.principalApplied)||0));continue}
  if(p.apply==='auto'){const left=applyInterest(amount);principal=Math.max(0,principal-left)}
 }
 const unpaid=buckets.filter(b=>b.remaining>0.004);
 return {monthlyInterest:Math.max(0,principal*rate),principalOutstanding:principal,interestOutstanding:unpaid.reduce((s,b)=>s+b.remaining,0),unpaidMonths:unpaid.length,unpaidMonthLabels:unpaid.map(b=>new Date(b.date+'T00:00:00Z').toLocaleDateString('en-GB',{month:'short',year:'numeric',timeZone:'UTC'})),monthsDue:buckets.length,interestBuckets:buckets};
}

 const database='<section class="panel detail-panel"><div class="panelhead"><div><h2>Account database</h2><p>Stored record for this person. Edit to update account details.</p></div><button class="pill" onclick="editLoan(\''+kind+'\',\''+l.id+'\')">Edit record</button></div><div class="detail-grid">'+detailItem('Account ID',l.id)+detailItem('Record created',l.created||'Not recorded')+detailItem('Person / institution',l.person)+detailItem('Original principal',fmt(l.principal))+detailItem('Principal already repaid',fmt(l.principalPaid||0))+detailItem('Current principal balance',fmt(ledger.principalOutstanding))+detailItem('Interest period',l.period==='yearly'?'Yearly':l.period==='none'?'No interest':'Monthly')+detailItem('Interest calculation',(l.method||'simple')==='compound'?'Compound':'Simple')+detailItem('Start date',l.start||'—')+detailItem('Stop date',l.stop||'—')+detailItem('Due date',l.due||'—')+detailItem('Notes',l.note||'—')+'</div><div class="database-actions"><button class="primary" onclick="payFor(\''+kind+'\',\''+l.id+'\')">Record a payment</button><button class="pill" onclick="editLoan(\''+kind+'\',\''+l.id+'\')">Edit account</button><button class="pill danger-action" onclick="deleteLoan(\''+kind+'\',\''+l.id+'\')">Delete account</button></div></section>';
 const body=personDetail.tab==='ledger'?ledgerView:personDetail.tab==='payments'?paymentView:personDetail.tab==='database'?database:overview;
 return '<div class="person-page">'+header+nav+'<div class="person-tab-content">'+body+'</div></div>';
}
function detailItem(label,value){return '<div class="detail-item"><small>'+escapeHtml(label)+'</small><b>'+escapeHtml(value)+'</b></div>'}
function personPaymentTable(rows,kind,l){
 if(!rows.length)return '<div class="empty">No payments for this person yet. Use “Record payment” to add the first payment.</div>';
 return '<div class="tablewrap person-payments"><table><thead><tr><th>Date</th><th>Applied to</th><th>Note / slip remark</th><th>Amount</th></tr></thead><tbody>'+rows.map(p=>'<tr><td>'+escapeHtml(p.date||'—')+'</td><td>'+escapeHtml(p.apply==='auto'?'Interest '+moneyFor(p.interestApplied||0,p)+' + Principal '+moneyFor(p.principalApplied||0,p):p.apply||'—')+'</td><td>'+escapeHtml(p.note||'—')+'</td><td>'+moneyFor(p.amount,p)+'</td></tr>').join('')+'</tbody></table></div>';
}

function savingsPage(){const cur=state.currency||'THB',items=state.savings.filter(x=>recordCurrency(x)===cur),totalS=items.reduce((s,x)=>s+Number(x.saved||0),0);return `${pageHead('Savings & goals','Build your future, one goal at a time.','Add savings goal','addSaving()')}<div class="cards">${metric('Total savings',fmt(totalS,cur),'◈',cur+' across goals')}${metric('Active goals',items.length,'◎',cur+' goals')}${metric('Income recorded',fmt(total('income',cur),cur),'↗',cur+' only')}${metric('Available after expenses',fmt(total('income',cur)-total('expense',cur),cur),'✦',cur+' net cash flow')}</div><div class="layout"><section class="panel"><div class="panelhead"><div><h2>Your goals</h2><p>Track progress toward what matters</p></div></div>${items.length?items.map(s=>`<div style="padding:15px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:10px"><b>${escapeHtml(s.name)}</b><small>${moneyFor(s.saved,s)} / ${moneyFor(s.target,s)}</small></div><div style="height:7px;background:#eef1f5;border-radius:9px;margin:12px 0;overflow:hidden"><div style="height:100%;width:${Math.min(100,s.target?s.saved/s.target*100:0)}%;background:var(--gold);border-radius:9px"></div></div><small class="sub">${s.target?Math.round(s.saved/s.target*100):0}% complete · ${escapeHtml(s.date||'No target date')}</small> <button class="linkbtn" onclick="addToSaving('${s.id}')">＋ Add money</button></div>`).join(''):'<div class="empty">Create your first savings goal.</div>'}</section><section class="panel"><h2 style="font-size:15px;margin-top:0">Savings tip</h2><p style="font-size:12px;line-height:1.8;color:var(--muted)">Give every goal a name, target amount, and date. A small automatic habit can make progress easier to see. Keep emergency savings separate from money intended for planned purchases.</p></section></div>`}
function addSaving(){openModal('Create savings goal',`<form id="savingForm"><div class="formgrid">${field('Goal name','name')}${field('Target amount','target','number')}${currencyField()}${field('Already saved','saved','number','0')}${field('Target date (optional)','date','date','')}</div><div class="formactions"><button type="button" class="pill" onclick="closeModal()">Cancel</button><button class="primary">Create goal</button></div></form>`);document.getElementById('savingForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.savings.push({id:crypto.randomUUID(),name:f.get('name'),target:Number(f.get('target')),saved:Number(f.get('saved')||0),currency:f.get('currency')||state.currency||'THB',date:f.get('date')});save();closeModal();render();toast('Goal created')}}
function addToSaving(id){const s=state.savings.find(x=>x.id===id);if(!s)return;openModal('Add to savings · '+currencyLabel(recordCurrency(s)||'Unclassified'),`<form id="savingAdd">${field('Amount ('+(recordCurrency(s)||'Unclassified')+')','amount','number')}<div class="formactions"><button type="button" class="pill" onclick="closeModal()">Cancel</button><button class="primary">Add</button></div></form>`);document.getElementById('savingAdd').onsubmit=e=>{e.preventDefault();s.saved+=Number(new FormData(e.target).get('amount'));save();closeModal();render();toast('Savings updated')}}
function paymentsPage(){return `${pageHead('Payment history','Every repayment in one auditable timeline.','Record payment','addPayment()')}<div class="panel"><div class="tablewrap"><table><thead><tr><th>Date</th><th>Account</th><th>Type</th><th>Applied to</th><th>Note</th><th style="text-align:right">Amount</th></tr></thead><tbody>${state.payments.length?state.payments.map(p=>{const l=(p.kind==='loan'?state.loans:state.debts).find(x=>x.id===p.account);return `<tr><td>${escapeHtml(p.date)}</td><td>${escapeHtml(l?.person||'Account removed')}</td><td>${p.kind==='loan'?'Loan given':'My debt'}</td><td>${escapeHtml(p.apply==='auto'?'Interest '+moneyFor(p.interestApplied||0,p)+' + Principal '+moneyFor(p.principalApplied||0,p):p.apply)}</td><td>${escapeHtml(p.note||'—')}</td><td style="text-align:right">${moneyFor(p.amount,p)}</td></tr>`}).join(''):'<tr><td colspan="6" class="empty">No payments recorded yet.</td></tr>'}</tbody></table></div></div>`}
function budgetPage(){return `${pageHead('Budget planner','Set spending limits and compare them with recorded expenses.','Add budget','addBudget()')}<div class="layout"><section class="panel"><div class="panelhead"><div><h2>Category budgets</h2><p>Monthly spending limits</p></div></div>${state.budgets.length?state.budgets.map(b=>{const spent=state.transactions.filter(t=>t.type==='expense'&&recordCurrency(t)===recordCurrency(b)&&t.category===b.category&&t.date?.startsWith(today().slice(0,7))).reduce((s,t)=>s+t.amount,0);return `<div style="padding:14px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between"><b style="font-size:12px">${escapeHtml(b.category)}</b><span style="font-size:11px">${fmt(spent,recordCurrency(b)||state.currency)} / ${moneyFor(b.limit,b)}</span></div><div style="height:7px;background:#eef1f5;border-radius:9px;margin-top:10px;overflow:hidden"><div style="height:100%;width:${Math.min(100,spent/b.limit*100)}%;background:${spent>b.limit?'var(--red)':'var(--gold)'}"></div></div><small class="sub">${spent>b.limit?'Over budget by '+fmt(spent-b.limit,recordCurrency(b)||state.currency):fmt(b.limit-spent,recordCurrency(b)||state.currency)+' remaining'}</small></div>`}).join(''):'<div class="empty">No budgets yet. Set a category limit to get started.</div>'}</section><section class="panel"><h2 style="font-size:15px;margin-top:0">This month</h2><p class="sub">Total expenses recorded</p><strong style="font-size:27px">${fmt(state.transactions.filter(t=>t.type==='expense'&&recordCurrency(t)===(state.currency||'THB')&&t.date?.startsWith(today().slice(0,7))).reduce((s,t)=>s+t.amount,0),state.currency||'THB')}</strong><p class="sub">Only transactions dated in the current month are included.</p></section></div>`}
function addBudget(){openModal('Add category budget',`<form id="budgetForm"><div class="formgrid">${field('Category','category','select','','<option>Food</option><option>Housing</option><option>Transport</option><option>Shopping</option><option>Health</option><option>Other</option>')}${field('Monthly limit','limit','number')}${currencyField()}</div><div class="formactions"><button type="button" class="pill" onclick="closeModal()">Cancel</button><button class="primary">Save budget</button></div></form>`);document.getElementById('budgetForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.budgets.push({id:crypto.randomUUID(),category:f.get('category'),limit:Number(f.get('limit')),currency:f.get('currency')||state.currency||'THB'});save();closeModal();render();toast('Budget saved')}}
function reportsPage(){const cur=state.currency||'THB',income=total('income',cur),expense=total('expense',cur);const cats={};state.transactions.filter(t=>t.type==='expense'&&recordCurrency(t)===cur).forEach(t=>cats[t.category]=(cats[t.category]||0)+t.amount);return `${pageHead('Reports & insights','A simple snapshot of your recorded financial activity.','Export CSV','exportCSV()')}<div class="cards">${metric('Income',fmt(income),'↗','Recorded total')}${metric('Expenses',fmt(expense),'↘','Recorded total')}${metric('Net cash flow',fmt(income-expense),'◈','Income minus expenses')}${metric('Savings rate',income?Math.round((income-expense)/income*100)+'%':'—','％','Based on recorded income')}</div><div class="layout"><section class="panel"><div class="panelhead"><div><h2>Expense breakdown</h2><p>By category · all recorded time</p></div></div>${Object.entries(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([cat,n])=>`<div style="padding:11px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;font-size:12px"><b>${escapeHtml(cat)}</b><span>${fmt(n)}</span></div><div style="height:6px;background:#edf0f5;border-radius:9px;margin-top:8px"><div style="height:100%;width:${expense?n/expense*100:0}%;background:var(--gold);border-radius:9px"></div></div></div>`).join(''):'<div class="empty">Add expense records to see a breakdown.</div>'}</section><section class="panel"><h2 style="font-size:15px;margin-top:0">Export & review</h2><p style="font-size:12px;line-height:1.7;color:var(--muted)">Download your transaction records as CSV for spreadsheets, or export all records as a JSON backup. Keep backups somewhere secure.</p><button class="primary" onclick="exportCSV()">⇩ Download transaction CSV</button><p><button class="pill" onclick="exportData()">Download full JSON backup</button></p></section></div>`}
function settingsPage(){return `${pageHead('Settings & backup','Manage your preferences and protect your records.')}<div class="notice"><b>Data & cloud sync:</b> When you are signed out, records stay in this browser on this device. Sign in to your Finance Master account, export a JSON backup first, then use <b>Upload this device to cloud</b> for the first upload. After the cloud copy is connected, signed-in devices sync changes automatically. If a sync conflict occurs, syncing pauses to protect both copies.</div><div class="settingsgrid"><section class="panel"><h2 style="font-size:15px;margin-top:0">Preferences</h2><div class="field" style="margin:16px 0"><label>Currency</label><select id="currency" onchange="state.currency=this.value;save();render()"><option value="THB" ${state.currency==='THB'?'selected':''}>Thai Baht (THB ฿)</option><option value="MMK" ${state.currency==='MMK'?'selected':''}>Myanmar Kyat (MMK)</option><option value="USD" ${state.currency==='USD'?'selected':''}>US Dollar (USD $)</option><option value="SGD" ${state.currency==='SGD'?'selected':''}>Singapore Dollar (SGD)</option></select></div><p class="sub">Default currency for new records. Existing records must be classified individually because THB and MMK are mixed; changing this setting never converts amounts.</p><div class="notice" style="margin-top:12px"><b>Mixed-currency safety:</b> Records without a currency are legacy records. Review and label them before relying on cross-currency totals.</div><button class="pill" onclick="reviewLegacyCurrencies()">Review unclassified records</button><p class="sub" id="currencyReviewStatus" style="margin-top:9px">${legacyCurrencyCount()} legacy record(s) need a currency label.</p></section><section class="panel"><h2 style="font-size:15px;margin-top:0">Backup & restore</h2><p class="sub">Export a complete copy of all records or restore from a previous Finance Master JSON backup.</p><p><button class="primary" onclick="exportData()">⇩ Export full backup</button></p><p><label class="pill" style="display:inline-block">⇧ Restore JSON backup <input type="file" accept=".json,application/json" onchange="restoreData(event)" style="display:none"></label></p><button class="pill" onclick="exportCSV()">Export transactions CSV</button></section><section class="panel" style="grid-column:1/-1"><h2 style="font-size:15px;margin-top:0">Firebase Cloud Sync</h2><p class="sub">Sign in with your own Finance Master account. Your existing device data stays local until you explicitly upload it.</p><div id="fmAuthStatus" class="notice">Checking Firebase connection…</div><div class="formgrid"><div class="field"><label>Email</label><input id="fmEmail" type="email" autocomplete="username" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="fmPassword" type="password" autocomplete="current-password" placeholder="At least 6 characters"></div></div><div class="formactions" style="justify-content:flex-start;flex-wrap:wrap"><button class="primary" onclick="window.fmSignIn()">Sign in</button><button class="pill" onclick="window.fmSignUp()">Create account</button><button class="pill" onclick="window.fmSignOut()">Sign out</button></div><div style="height:1px;background:var(--line);margin:16px 0"></div><div class="notice"><b>Protect your data:</b> Export a full JSON backup before the first upload or before replacing local data. First upload/download requires your action; after the cloud copy is connected, new changes sync automatically. If two devices change data at the same time, sync pauses rather than silently overwriting either copy. Keep your password private.</div><div class="formactions" style="justify-content:flex-start;flex-wrap:wrap"><button class="primary goldbtn" onclick="window.fmUploadLocal()">Upload this device to cloud</button><button class="pill" onclick="window.fmDownloadCloud()">Download cloud data to this device</button></div><p class="sub">If sign-in is blocked after deployment, add <b>finance-master-starter.vercel.app</b> under Firebase Authentication → Settings → Authorized domains.</p></section><section class="panel"><h2 style="font-size:15px;margin-top:0">Data controls</h2><p class="sub">Reset permanently deletes the records stored in this browser. Export a backup first.</p><button class="pill" style="color:var(--red)" onclick="resetData()">Reset local data</button></section></div>`}
function editTx(id){
 const t=state.transactions.find(x=>x.id===id);
 if(!t){toast('Transaction not found');return}
 const categories=['Salary','Food','Housing','Transport','Shopping','Health','Bonus','Other'];
 const options=categories.map(x=>'<option '+((t.category||'Other')===x?'selected':'')+'>'+x+'</option>').join('');
 openModal(t.type==='income'?'Edit income':'Edit expense',
 '<form id="editTxForm"><div class="formgrid">'+
 '<div class="field full"><label>Description</label><input name="title" required value="'+escapeHtml(t.title||'')+'"></div>'+
 '<div class="field"><label>Amount</label><input name="amount" type="number" min="0.01" step="0.01" required value="'+Number(t.amount||0)+'"></div>'+currencyField(recordCurrency(t)||state.currency||'THB')+
 '<div class="field"><label>Date</label><input name="date" type="date" required value="'+escapeHtml(t.date||today())+'"></div>'+
 '<div class="field full"><label>Category</label><select name="category">'+options+'</select></div>'+
 '<div class="field full"><label>Note</label><input name="note" value="'+escapeHtml(t.note||'')+'"></div></div>'+
 '<div class="formactions"><button type="button" class="pill" onclick="closeModal()">Cancel</button><button class="primary" type="submit">Save changes</button></div></form>');
 const form=document.getElementById('editTxForm');
 form.onsubmit=function(e){e.preventDefault();const d=new FormData(form),amount=Number(d.get('amount')),title=String(d.get('title')||'').trim();if(!title||!Number.isFinite(amount)||amount<=0){toast('Enter a valid description and amount');return}Object.assign(t,{title,amount,currency:d.get('currency')||recordCurrency(t)||state.currency||'THB',date:d.get('date'),category:d.get('category'),note:d.get('note')});save();closeModal();render();toast('Transaction updated')};
}
function deleteTx(id){if(confirm('Delete this transaction? This cannot be undone. Export a backup first if needed.')){state.transactions=state.transactions.filter(t=>t.id!==id);save();render();toast('Transaction deleted')}}
function editLoan(kind,id){
 const list=kind==='loan'?state.loans:state.debts;
 const l=list.find(x=>x.id===id);
 if(!l){toast('Account not found');return}
 const periodOptions=['monthly','yearly','none'].map(p=>'<option value="'+p+'" '+(l.period===p?'selected':'')+'>'+(p==='none'?'No interest':p==='yearly'?'Yearly':'Monthly')+'</option>').join('');
 const methodOptions=['simple','compound'].map(p=>'<option value="'+p+'" '+((l.method||'simple')===p?'selected':'')+'>'+(p==='simple'?'Simple interest':'Compound interest')+'</option>').join('');
 openModal(kind==='loan'?'Edit loan account':'Edit debt account',
 '<form id="editLoanForm"><div class="formgrid">'+
 '<div class="field full"><label>Person / Institution</label><input name="person" required value="'+escapeHtml(l.person||'')+'"></div>'+
 '<div class="field"><label>Principal</label><input name="principal" type="number" min="0" step="0.01" required value="'+Number(l.principal||0)+'"></div>'+currencyField(recordCurrency(l)||state.currency||'THB')+
 '<div class="field"><label>Interest rate (%)</label><input name="rate" type="number" min="0" step="0.01" required value="'+Number(l.rate||0)+'"></div>'+
 '<div class="field"><label>Interest period</label><select name="period">'+periodOptions+'</select></div>'+
 '<div class="field"><label>Interest method</label><select name="method">'+methodOptions+'</select></div>'+
 '<div class="field"><label>Interest starts</label><input name="start" type="date" value="'+escapeHtml(l.start||'')+'"></div>'+
 '<div class="field"><label>Interest stops</label><input name="stop" type="date" value="'+escapeHtml(l.stop||'')+'"></div>'+
 '<div class="field"><label>Due date</label><input name="due" type="date" value="'+escapeHtml(l.due||'')+'"></div>'+
 '<div class="field full"><label>Notes</label><input name="note" value="'+escapeHtml(l.note||'')+'"></div></div>'+
 '<div class="formactions"><button type="button" class="pill" onclick="closeModal()">Cancel</button><button class="primary" type="submit">Save changes</button></div></form>');
 const form=document.getElementById('editLoanForm');
 form.onsubmit=function(e){
  e.preventDefault();
  const d=new FormData(form),principal=Number(d.get('principal')),rate=Number(d.get('rate')),person=String(d.get('person')||'').trim();
  if(!person||!Number.isFinite(principal)||principal<0||!Number.isFinite(rate)||rate<0){toast('Please enter valid account details');return}
  const nextCurrency=d.get('currency')||recordCurrency(l)||state.currency||'THB';
  const linkedPayments=(state.payments||[]).filter(p=>p.account===id&&p.kind===kind);
  if(linkedPayments.length&&nextCurrency!==recordCurrency(l)){toast('Currency cannot be changed after payments exist. Keep '+currencyLabel(recordCurrency(l)||'Unclassified')+' for this account to protect payment history.');return}
  Object.assign(l,{person,principal,currency:nextCurrency,rate,period:d.get('period'),method:d.get('method'),start:d.get('start'),stop:d.get('stop'),due:d.get('due'),note:d.get('note')});
  l.principalPaid=Math.min(principal,Number(l.principalPaid||0));
  save();closeModal();render();toast('Account updated');
 };
}
function deleteLoan(kind,id){if(!confirm('Delete this account? Related payment history will remain but may show Account removed.'))return;state[kind==='loan'?'loans':'debts']=state[kind==='loan'?'loans':'debts'].filter(x=>x.id!==id);if(current==='PersonDetail'&&personDetail.id===id)current=kind==='loan'?'Loans':'Debts';save();render();toast('Account deleted')}
function exportData(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString(),formatVersion:1},null,2)],{type:'application/json'});download(blob,'finance-master-backup-'+today()+'.json')}
function exportCSV(){const rows=[['Date','Type','Description','Category','Amount','Note'],...state.transactions.map(t=>[t.date,t.type,t.title,t.category,t.amount,t.note||''])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'finance-master-transactions-'+today()+'.csv')}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function backupHasRecords(data){return ['transactions','loans','debts','savings','budgets','payments'].some(k=>Array.isArray(data[k])&&data[k].length>0)}
function restoreData(e){const file=e.target.files&&e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const previousState=state,previousRaw=localStorage.getItem(KEY);try{const incoming=JSON.parse(reader.result);const collections=['transactions','loans','debts','savings','budgets','payments'];if(!incoming||typeof incoming!=='object'||Array.isArray(incoming)||!Array.isArray(incoming.transactions)||collections.some(k=>incoming[k]!==undefined&&(!Array.isArray(incoming[k])||incoming[k].some(x=>!x||typeof x!=='object'||Array.isArray(x)))))throw Error('Invalid backup structure');if(incoming.currency!==undefined&&!['THB','MMK','USD','SGD'].includes(incoming.currency))throw Error('Invalid currency');if(!confirm('Restore this backup and replace the records currently stored on this device? If current records exist, Finance Master will first download a safety backup.'))return;if(backupHasRecords(previousState))exportData();const next={...incoming,currency:incoming.currency||'THB',transactions:incoming.transactions,loans:incoming.loans||[],debts:incoming.debts||[],savings:incoming.savings||[],budgets:incoming.budgets||[],payments:incoming.payments||[]};localStorage.setItem(KEY,JSON.stringify(next));state=next;const el=document.getElementById('saveStatus');if(el)el.textContent='● Restored and saved on this device';if(window.fmScheduleSync)window.fmScheduleSync(state);render();toast('Backup restored. Existing records were backed up first if present.')}catch(err){state=previousState;try{if(previousRaw===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,previousRaw)}catch(storageErr){}alert('Restore failed. Your previous records were kept. Check that the backup is a valid Finance Master JSON file and that device storage is available.')}};reader.onerror=()=>alert('Could not read the backup file. Your existing records were not changed.');reader.readAsText(file);e.target.value='';}
function resetData(){if(!confirm('Permanently delete ALL local Finance Master records on this device? If records exist, Finance Master will first download a safety backup.'))return;const previousState=state,previousRaw=localStorage.getItem(KEY);if(backupHasRecords(previousState))exportData();const next={currency:previousState.currency,transactions:[],loans:[],debts:[],savings:[],budgets:[],payments:[]};try{localStorage.setItem(KEY,JSON.stringify(next));state=next;if(window.fmScheduleSync)window.fmScheduleSync(state);render();toast('Local records reset. A safety backup was downloaded if records existed.')}catch(err){state=previousState;try{if(previousRaw===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,previousRaw)}catch(storageErr){}alert('Reset failed because device storage is unavailable. Your previous records were kept.')}}

let borrowerAutoCreateRunning=false;
const borrowerAutoCreateAttempted=new Set();
async function ensureBorrowerLinksForAll(){
 if(borrowerAutoCreateRunning||!window.fmBorrowerCloud?.ready)return;
 borrowerAutoCreateRunning=true;
 let created=0,skipped=0;
 try{
  const existing=window.fmBorrowerCloud.shares||[];
  for(const loan of (state.loans||[])){
   if(existing.some(sh=>sh.accountId===loan.id))continue;
   if(borrowerAutoCreateAttempted.has(loan.id))continue;
   if(!recordCurrency(loan)){skipped++;continue;}
   borrowerAutoCreateAttempted.add(loan.id);
   try{await window.fmBorrowerCloud.createShare(loan.id,borrowerSnapshotForLoan(loan),{silent:true});created++;}
   catch(e){borrowerAutoCreateAttempted.delete(loan.id);console.error('Auto borrower link failed',loan.person,e);}
  }
  if(created||skipped)status('Automatic borrower links: '+created+' created'+(skipped?', '+skipped+' skipped (assign currency first)':'')+'.');
 }finally{borrowerAutoCreateRunning=false;}
}

  debts:Array.isArray(payload?.debts)?payload.debts:[],
  savings:Array.isArray(payload?.savings)?payload.savings:[],
  budgets:Array.isArray(payload?.budgets)?payload.budgets:[],
  payments:Array.isArray(payload?.payments)?payload.payments:[]
});
let syncWriteInFlight=false;
const scheduleSyncRetry = (delay=900) => {
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{syncTimer=null;writeCurrentState();},delay);
};
const writeCurrentState = async () => {
  if(!currentUser || !syncReady || applyingRemote || syncConflict || !localDirty || syncWriteInFlight) return;
  const userAtStart=currentUser;
  const data=window.fmApp.getState();
  const signature=stateSignature(data);
  if(signature===lastCloudSignature){localDirty=false;return;}
  syncWriteInFlight=true;
  try {
    await setDoc(cloudRef(userAtStart.uid),{data,schemaVersion:1,ownerUid:userAtStart.uid,updatedAt:serverTimestamp()});
    if(!currentUser || currentUser.uid!==userAtStart.uid) return;
    lastCloudSignature=signature;
    const currentSignature=stateSignature(window.fmApp.getState());
    localDirty=currentSignature!==signature;
    status(localDirty
      ? 'A newer change is waiting to sync…'
      : 'Cloud sync is live. Changes are syncing automatically.');
  } catch(e) {
    if(currentUser && currentUser.uid===userAtStart.uid){
      localDirty=true;
      status('Auto-sync failed: '+errText(e)+'. Your data is still saved on this device; retrying automatically.',true);
    }
  } finally {
    syncWriteInFlight=false;
    if(currentUser && syncReady && localDirty && !syncConflict && !applyingRemote){
      scheduleSyncRetry(900);
    }
  }
};
window.fmScheduleSync = () => {
  if(!currentUser || !syncReady || applyingRemote || syncConflict) return;
  localDirty=true;
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer=setTimeout(writeCurrentState,900);
};
const startCloudListener = user => {
  if(stopCloudListener){stopCloudListener();stopCloudListener=null;}
  syncReady=false; syncConflict=false; initialSnapshotHandled=false; localDirty=false; lastCloudSignature='';
  if(!user) return;
  stopCloudListener=onSnapshot(cloudRef(user.uid), async snap => {
    if(!currentUser || currentUser.uid!==user.uid) return;
    if(!snap.exists()){
      if(!initialSnapshotHandled){
        initialSnapshotHandled=true;
        status('Signed in. No cloud backup found yet. Export a JSON backup, then use Upload this device to cloud.');
      }
      return;
    }
    const payload=snap.data()?.data;
    if(!payload || !Array.isArray(payload.transactions)){
      status('Cloud data format is invalid. Local records were not changed.',true);return;
    }
    const remote=normalizeState(payload);
    const remoteSignature=stateSignature(remote);
    const local=window.fmApp.getState();
    const localSignature=stateSignature(local);
    if(!initialSnapshotHandled){
      initialSnapshotHandled=true;
      if(remoteSignature!==localSignature && window.fmApp.hasLocalRecords()){
        const useCloud=confirm('Cloud data and this device data are different. OK = replace this device with cloud data. Cancel = keep this device and upload its data to cloud.');
        if(useCloud){
          applyingRemote=true;window.fmApp.replaceState(remote);applyingRemote=false;
          lastCloudSignature=remoteSignature;localDirty=false;
        } else {
          syncReady=true;localDirty=true;await writeCurrentState();
        }
      } else if(remoteSignature!==localSignature){
        applyingRemote=true;window.fmApp.replaceState(remote);applyingRemote=false;
        lastCloudSignature=remoteSignature;localDirty=false;
      } else {
        lastCloudSignature=remoteSignature;
      }
      syncReady=true;
      status('Cloud sync is live. Changes on signed-in devices update automatically.');
      return;
    }
    if(snap.metadata?.hasPendingWrites) return;
    if(syncConflict) return;
    if(remoteSignature===lastCloudSignature) return;
    if(localDirty){
      // Do not overwrite either side when both devices changed the shared document.
      if(syncTimer){clearTimeout(syncTimer);syncTimer=null;}
      syncReady=false; syncConflict=true; localDirty=false;
      status('Sync paused to protect data: this device and cloud changed at the same time. Export a JSON backup, then choose Upload or Download only after reviewing which copy to keep.',true);
      return;
    }
    if(remoteSignature!==localSignature){
      applyingRemote=true;window.fmApp.replaceState(remote);applyingRemote=false;
      lastCloudSignature=remoteSignature;
      status('New cloud changes received. This device is up to date.');
      window.fmApp.toast('Cloud changes received');
    }
  }, e => {
    syncReady=false;
    status('Live sync connection failed: '+errText(e)+'. Local data is still available.',true);
  });
};

const borrowerSharesRef=collection(db,'borrowerShares');
const borrowerRequestsRef=collection(db,'borrowerPaymentRequests');
let borrowerShares=[],borrowerRequests=[],stopBorrowerShares=null,stopBorrowerRequests=null;
const borrowerTime=v=>{try{return v&&v.toDate?v.toDate().toLocaleString():v?new Date(v).toLocaleString():'recently'}catch(e){return 'recently'}};
function publishBorrowerState(){window.fmBorrowerCloud={ready:!!currentUser,shares:borrowerShares,requests:borrowerRequests,refresh:()=>{if(currentUser)startBorrowerListeners(currentUser)}};}
function startBorrowerListeners(user){
 if(stopBorrowerShares){stopBorrowerShares();stopBorrowerShares=null;}if(stopBorrowerRequests){stopBorrowerRequests();stopBorrowerRequests=null;}
 borrowerShares=[];borrowerRequests=[];publishBorrowerState();
 if(!user)return;
 stopBorrowerShares=onSnapshot(query(borrowerSharesRef,where('ownerUid','==',user.uid)),snap=>{borrowerShares=snap.docs.map(d=>({id:d.id,...d.data(),createdAtText:borrowerTime(d.data().createdAt)}));publishBorrowerState();if(document.getElementById('crumbPage')?.textContent==='Borrower Portal')render();},e=>status('Borrower links unavailable: '+e.message,true));
 stopBorrowerRequests=onSnapshot(query(borrowerRequestsRef,where('ownerUid','==',user.uid)),snap=>{borrowerRequests=snap.docs.map(d=>({id:d.id,...d.data(),createdAtText:borrowerTime(d.data().createdAt)})).sort((a,b)=>(a.status==='pending'?-1:0)-(b.status==='pending'?-1:0)||String(b.date||'').localeCompare(String(a.date||'')));publishBorrowerState();if(document.getElementById('crumbPage')?.textContent==='Borrower Portal')render();},e=>status('Payment request notifications unavailable: '+e.message,true));
}
window.fmBorrowerCloud={
 get ready(){return !!currentUser;},
 get shares(){return borrowerShares;},
 get requests(){return borrowerRequests;},
 refresh(){if(currentUser)startBorrowerListeners(currentUser);},
 async createShare(accountId,snapshot,options={}){
  if(!currentUser)throw new Error('Sign in to Finance Master first.');
  const token=Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join('');
  await setDoc(doc(db,'borrowerShares',token),{ownerUid:currentUser.uid,accountId,borrowerName:String(snapshot.person||'Borrower'),currency:snapshot.currency||'THB',snapshot,active:true,createdAt:serverTimestamp(),updatedAt:serverTimestamp(),schemaVersion:1});
  const url=new URL('borrower.html?token='+encodeURIComponent(token),new URL('.',window.location.href)).href;
  if(!options.silent){try{await navigator.clipboard.writeText(url);status('Secure borrower link created and copied. Send it only to the intended borrower.');}catch(e){status('Secure borrower link created. Use Copy private link in Borrower Portal.');}}
  startBorrowerListeners(currentUser);return url;
 },
 async updateShare(token,snapshot){if(!currentUser)throw new Error('Sign in required.');await updateDoc(doc(db,'borrowerShares',token),{snapshot,borrowerName:String(snapshot.person||'Borrower'),currency:snapshot.currency||'THB',updatedAt:serverTimestamp()});},
 async revokeShare(token){if(!currentUser)throw new Error('Sign in required.');await updateDoc(doc(db,'borrowerShares',token),{active:false,revokedAt:serverTimestamp()});},
 async setRequestStatus(id,statusValue){if(!currentUser)throw new Error('Sign in required.');if(!['approved','rejected'].includes(statusValue))throw new Error('Invalid status');await updateDoc(doc(db,'borrowerPaymentRequests',id),{status:statusValue,reviewedAt:serverTimestamp(),reviewedBy:currentUser.uid});}
};

onAuthStateChanged(auth, user => {
  currentUser=user;
  if(syncTimer){clearTimeout(syncTimer);syncTimer=null;}
  localDirty=false;
  startCloudListener(user);
  startBorrowerListeners(user);
  if(user) status('Signed in as '+user.email+'. Connecting live cloud sync…');
  else status('Not signed in. Create an account or sign in to enable cloud sync.');
  if(user){setTimeout(()=>{if(currentUser&&document.getElementById('crumbPage')?.textContent==='Borrower Portal'){ensureBorrowerLinksForAll();}},900);}
});
</script>
