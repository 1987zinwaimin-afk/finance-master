<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101c33"><title>Finance Master</title>
<style>
:root{--navy:#101c33;--navy2:#172743;--gold:#d8b56d;--bg:#f4f6fa;--ink:#172033;--muted:#788398;--line:#e6eaf1;--green:#16866a;--red:#d94c4c;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:linear-gradient(165deg,var(--navy),#0c1527);color:#fff;padding:24px 15px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:2px 9px 18px;border-bottom:1px solid #ffffff1a}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#f1d99b,var(--gold));display:grid;place-items:center;color:var(--navy);font-weight:900;font-size:21px;box-shadow:0 8px 20px #d8b56d25}.brand b{display:block;font-size:16px;letter-spacing:.2px}.brand small{color:#aeb9cb;font-size:11px;letter-spacing:1.5px}.navlabel{font-size:10px;color:#8090a8;text-transform:uppercase;letter-spacing:1.5px;padding:0 12px}.nav{display:grid;gap:5px}.nav button{display:flex;gap:12px;align-items:center;border:0;background:transparent;color:#bac5d7;text-align:left;padding:12px;border-radius:11px;font-size:13px}.nav button span{width:22px;text-align:center;font-size:17px}.nav button.active,.nav button:hover{background:#ffffff12;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--gold)}.sidefoot{margin-top:auto;background:#ffffff0b;border:1px solid #ffffff15;border-radius:14px;padding:14px;font-size:12px;color:#b8c3d5;line-height:1.55}.sidefoot strong{color:#f4dba1}.main{min-width:0}.topbar{height:76px;background:#ffffffd9;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:4}.crumb{font-size:12px;color:var(--muted)}.crumb strong{color:var(--ink)}.topactions{display:flex;gap:10px;align-items:center}.pill{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;color:var(--ink);font-size:12px}.avatar{width:36px;height:36px;border-radius:12px;background:#e9dfc7;color:#72551b;display:grid;place-items:center;font-weight:800}.content{padding:30px 32px 42px;max-width:1500px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:24px}.eyebrow{color:#98743a;font-size:11px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase}.welcome h1{font-size:clamp(25px,3vw,34px);letter-spacing:-1.2px;margin:7px 0 8px}.welcome p{color:var(--muted);font-size:13px;margin:0}.primary{background:var(--navy);color:#fff;border:0;border-radius:11px;padding:12px 16px;font-weight:700;font-size:12px;box-shadow:0 5px 12px #101c331c}.primary:hover{background:#203759}.goldbtn{background:var(--gold);color:#202a3b}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:18px}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:0 5px 18px #192b4805}.metric{padding:19px;min-width:0}.metrichead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;gap:8px}.ico{height:34px;width:34px;border-radius:11px;display:grid;place-items:center;background:#f2ead9;color:#896727;font-size:17px}.metric strong{display:block;font-size:clamp(20px,2.3vw,27px);letter-spacing:-.7px;margin:15px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:11px;color:var(--muted)}.positive{color:var(--green);font-weight:700}.negative{color:var(--red);font-weight:700}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:17px;margin-bottom:18px}.panel{padding:21px;min-width:0}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.panelhead h2{font-size:15px;margin:0}.panelhead p{font-size:11px;color:var(--muted);margin:5px 0 0}.linkbtn{border:0;background:transparent;color:#9a783a;font-weight:800;font-size:11px}.chart{height:210px;display:flex;gap:12px;align-items:end;padding:10px 4px 0;border-bottom:1px solid var(--line);position:relative}.chart:before,.chart:after{content:"";position:absolute;left:0;right:0;border-top:1px dashed #e9edf3}.chart:before{top:33%}.chart:after{top:66%}.barcol{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:9px;z-index:1}.bars{height:calc(100% - 23px);display:flex;align-items:end;gap:4px;width:100%;justify-content:center}.bar{width:min(15px,35%);border-radius:5px 5px 2px 2px;background:#d8b56d}.bar.exp{background:#dbe2ed}.barcol small{font-size:10px;color:var(--muted)}.legend{display:flex;gap:15px;margin-top:15px;font-size:11px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--gold)}.dot.grey{background:#dbe2ed}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;text-align:left;display:flex;align-items:center;gap:11px;color:var(--ink)}.quick button:hover{border-color:var(--gold);background:#fffcf5}.qico{width:35px;height:35px;border-radius:11px;background:#f6f0e3;display:grid;place-items:center;font-size:17px}.quick b{display:block;font-size:12px}.quick small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:12px 9px;border-bottom:1px solid var(--line)}td{padding:13px 9px;border-bottom:1px solid #f0f2f6;font-size:12px}tbody tr:last-child td{border-bottom:0}.txname{display:flex;align-items:center;gap:10px}.txico{width:34px;height:34px;border-radius:10px;background:#f4f6fa;display:grid;place-items:center}.txname b{display:block;font-size:12px}.txname small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.tag{display:inline-block;border-radius:7px;padding:5px 8px;background:#edf7f3;color:var(--green);font-size:10px;font-weight:800}.tag.out{background:#fff0f0;color:var(--red)}.empty{text-align:center;color:var(--muted);padding:28px;font-size:12px}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}.pagehead h1{font-size:27px;margin:0 0 7px;letter-spacing:-.8px}.pagehead p{color:var(--muted);font-size:12px;margin:0}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:12px;color:var(--ink)}.toolbar input{flex:1;min-width:160px}.modalback{position:fixed;inset:0;background:#08122588;backdrop-filter:blur(4px);z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modalback.show{display:flex}.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:25px;box-shadow:0 25px 90px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modalhead h2{margin:0;font-size:19px}.close{border:0;background:#f1f3f7;border-radius:9px;width:34px;height:34px;font-size:19px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:800;color:#5c6678}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #dfe4ed;border-radius:10px;outline:none;font-size:13px;background:white}.field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d8b56d25}.formactions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.notice{background:#fff8e8;border:1px solid #f0dfb9;border-radius:12px;padding:13px;font-size:11px;color:#795d26;line-height:1.6;margin-bottom:15px}.settingsgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.setting{padding:18px;border:1px solid var(--line);border-radius:14px}.setting h3{font-size:13px;margin:0 0 7px}.setting p{font-size:11px;line-height:1.6;color:var(--muted)}.mobilemenu{display:none}.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:white;padding:13px 18px;border-radius:12px;box-shadow:0 12px 40px #0002;z-index:50;font-size:12px;display:none}.toast.show{display:block;animation:fade 3s forwards}@keyframes fade{0%,75%{opacity:1}100%{opacity:0}}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.content{padding:24px}.topbar{padding:0 24px}}
@media(max-width:700px){.app{display:block}.sidebar{display:none}.topbar{height:62px;padding:0 16px}.mobilemenu{display:inline-grid;place-items:center;width:35px;height:35px;border:1px solid var(--line);border-radius:10px;background:white;margin-right:10px}.crumb{display:flex;align-items:center}.topactions .pill{display:none}.content{padding:22px 14px 90px}.welcome{align-items:flex-start}.welcome h1{font-size:25px}.welcome p{max-width:230px;line-height:1.5}.welcome>.primary{padding:11px;font-size:11px;white-space:nowrap}.cards{gap:10px}.metric{padding:14px}.metric strong{font-size:21px;margin:12px 0 5px}.metrichead{font-size:10px}.ico{width:29px;height:29px}.panel{padding:16px}.quick{gap:8px}.quick button{padding:11px 9px;gap:8px}.qico{width:30px;height:30px}.pagehead h1{font-size:24px}.settingsgrid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:8;display:flex;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -5px 20px #192b4808}.mobile-nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;color:#8a94a5;font-size:9px;padding:4px}.mobile-nav button span{font-size:18px}.mobile-nav button.active{color:#9a783a;font-weight:800}.chart{height:185px}.toolbar>*{min-width:0}.toolbar input{min-width:120px}}
@media(min-width:701px){.mobile-nav{display:none}}
</style></head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">F</div><div><b>Finance Master</b><small>PERSONAL FINANCE</small></div></div>
  <div class="navlabel">Workspace</div>
  <nav class="nav" id="sideNav">
    <button class="active" data-page="Dashboard"><span>◫</span>Dashboard</button>
    <button data-page="Income"><span>↗</span>Income</button><button data-page="Expenses"><span>↘</span>Expenses</button>
    <button data-page="Savings"><span>◈</span>Savings & Goals</button><button data-page="Loans"><span>⇄</span>Loans Given</button>
    <button data-page="Debts"><span>▤</span>My Debts</button><button data-page="Payments"><span>✓</span>Payment History</button>
    <button data-page="Budget"><span>◉</span>Budget Planner</button><button data-page="Reports"><span>▥</span>Reports</button>
    <button data-page="Settings"><span>⚙</span>Settings & Backup</button>
  </nav>
  <div class="sidefoot"><strong>✦ Your financial clarity</strong><br>Small daily records. Better long-term decisions.<br><br><span id="saveStatus">● Saved on this device</span></div>
</aside>
<main class="main">
<header class="topbar"><div class="crumb"><button class="mobilemenu" onclick="toggleMobile()">☰</button><span>Workspace&nbsp; / &nbsp;<strong id="crumbPage">Dashboard</strong></span></div><div class="topactions"><button class="pill" onclick="exportData()">⇩ Export data</button><button class="pill" onclick="go('Settings')">⚙ Settings</button><div class="avatar">FM</div></div></header>
<div class="content" id="content"></div>
</main>
</div>
<nav class="mobile-nav" id="mobileNav">
<button class="active" data-page="Dashboard"><span>◫</span>Home</button><button data-page="Income"><span>↗</span>Income</button><button data-page="Expenses"><span>↘</span>Expenses</button><button data-page="Loans"><span>⇄</span>Loans</button><button data-page="Settings"><span>⚙</span>Settings</button>
</nav>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2 id="modalTitle">Add record</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='finance-master-personal-v1';
const today=()=>new Date().toISOString().slice(0,10);
const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:state.currency||'THB',maximumFractionDigits:2}).format(Number(n)||0);
let state={currency:'THB',transactions:[],loans:[],debts:[],savings:[],budgets:[],payments:[]};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)state={...state,...s}}catch(e){}
let current='Dashboard';
function save(){localStorage.setItem(KEY,JSON.stringify(state));const el=document.getElementById('saveStatus');if(el)el.textContent='● Saved on this device'}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(p){current=p;document.getElementById('crumbPage').textContent=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();document.getElementById('mobileNav').style.display='';}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function toggleMobile(){const n=document.getElementById('mobileNav');n.style.display=n.style.display==='none'?'flex':''}
function total(type){return state.transactions.filter(t=>t.type===type).reduce((a,t)=>a+Number(t.amount||0),0)}
function outstanding(list){return list.reduce((s,l)=>s+Math.max(0,Number(l.principal||0)-Number(l.principalPaid||0)),0)}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalback').classList.add('show')}
function closeModal(){document.getElementById('modalback').classList.remove('show')}
function field(label,name,type='text',value='',opts=''){return `<div class="field"><label>${label}</label>${type==='select'?`<select name="${name}" required>${opts}</select>`:`<input name="${name}" type="${type}" value="${escapeHtml(value)}" ${type==='number'?'min="0" step="0.01"':''} required`+`>`}</div>`}
function addTransaction(type){openModal(type==='income'?'Add income':'Add expense',`<form id="txForm"><div class="formgrid">${field('Description','title')}${field('Amount ('+state.currency+')','amount','number')}${field('Date','date','date',today())}${field('Category','category','select','','<option>Salary</option><option>Food</option><option>Housing</option><option>Transport</option><option>Shopping</option><option>Health</option><option>Bonus</option><option>Other</option>')}<div class="field full"><label>Note (optional)</label><input name="note" placeholder="Add details..."></div></div><div class="formactions"><button type="button" class="pill" onclick="closeModal()">Cancel</button><button class="primary">Save record</button></div></form>`);document.getElementById('txForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.transactions.unshift({id:crypto.randomUUID(),type,title:f.get('title'),amount:Number(f.get('amount')),date:f.get('date'),category:f.get('category'),note:f.get('note')});save();closeModal();render();toast('Record saved')}}
function addLoan(kind){const isLoan=kind==='loan';openModal(isLoan?'Add loan given':'Add debt I owe',`<form id="loanForm"><div class="formgrid">${field('Person / Institution','person')}${field('Principal ('+state.currency+')','principal','number')}${field('Interest rate (%)','rate','number','0')}${field('Interest period','period','select','','<option value="monthly">Monthly</option><option value="yearly">Yearly</option><option value="none">No interest</option>')}${field('Interest starts','start','date',today())}${field('Interest stops (optional)','stop','date','')}${field('Due date (optional)','due','date','')}<div class="field full"><label>Interest method</label><select name="method"><option value="simple">Simple interest (not compounded)</option><option value="compound">Compound interest</option></select></div><div class="field full"><label>Notes</label><input name="note" placeholder="Agreement, purpose, details"></div></div><div class="formactions"><button type="button" class="pill" onclick="closeModal()">Cancel</button><button class="primary">Save record</button></div></form>`);document.getElementById('loanForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const l={id:crypto.randomUUID(),person:f.get('person'),principal:Number(f.get('principal')),principalPaid:0,rate:Number(f.get('rate')),period:f.get('period'),start:f.get('start'),stop:f.get('stop'),due:f.get('due'),method:f.get('method'),note:f.get('note'),created:today()};(isLoan?state.loans:state.debts).unshift(l);save();closeModal();render();toast('Financial record saved')}}
function addPayment(){const all=[...state.loans.map(x=>({...x,kind:'loan'})),...state.debts.map(x=>({...x,kind:'debt'}))];if(!all.length){toast('Add a loan or debt first');return}openModal('Record a payment',`<form id="payForm"><div class="formgrid">${field('Related account','account','select','',''+all.map(l=>`<option value="${l.kind}:${l.id}">${escapeHtml(l.person)} — ${l.kind==='loan'?'Loan given':'My debt'}</option>`).join(''))}${field('Amount ('+state.currency+')','amount','number')}${field('Payment date','date','date',today())}${field('Apply to','apply','select','','<option value="interest">Interest</option><option value="principal">Principal</option><option value="other">Other / mixed (record only)</option>')}<div class="field full"><label>Note</label><input name="note" placeholder="Payment details"></div></div><div class="notice">Payment is recorded in history. Principal payments reduce the outstanding principal; interest payments are tracked separately.</div><div class="formactions"><button type="button" class="pill" onclick="closeModal()">Cancel</button><button class="primary">Save payment</button></div></form>`);document.getElementById('payForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),[kind,id]=f.get('account').split(':');const p={id:crypto.randomUUID(),account:id,kind,amount:Number(f.get('amount')),date:f.get('date'),apply:f.get('apply'),note:f.get('note')};state.payments.unshift(p);if(p.apply==='principal'){const list=kind==='loan'?state.loans:state.debts;const l=list.find(x=>x.id===id);if(l)l.principalPaid=Math.min(l.principal,Number(l.principalPaid||0)+p.amount)}save();closeModal();render();toast('Payment saved')}}
function interest(l){if(l.period==='none'||!l.rate||!l.start)return 0;const end=l.stop&&l.stop<today()?new Date(l.stop):new Date(today());const start=new Date(l.start);if(end<=start)return 0;const days=Math.max(0,(end-start)/86400000);const principal=Math.max(0,l.principal-(l.principalPaid||0));if(l.period==='yearly')return principal*l.rate/100*days/365;return principal*l.rate/100*days/30.4375}
function pageHead(title,desc,button='',action=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div>${button?`<button class="primary" onclick="${action}">＋ ${button}</button>`:''}</div>`}
function metric(label,value,ico,sub=''){return `<div class="metric"><div class="metrichead"><span>${label}</span><span class="ico">${ico}</span></div><strong>${value}</strong><div class="sub">${sub}</div></div>`}
function txRows(arr){if(!arr.length)return `<tr><td colspan="5" class="empty">No records yet. Add your first transaction to get started.</td></tr>`;return arr.slice(0,8).map(t=>`<tr><td><div class="txname"><div class="txico">${t.type==='income'?'↗':'↘'}</div><div><b>${escapeHtml(t.title)}</b><small>${escapeHtml(t.category||'Other')}</small></div></div></td><td>${escapeHtml(t.date)}</td><td><span class="tag ${t.type==='expense'?'out':''}">${t.type}</span></td><td style="text-align:right" class="${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'−'}${fmt(t.amount)}</td><td><button class="linkbtn" onclick="editTx('${t.id}')">Edit</button> <button class="linkbtn" onclick="deleteTx('${t.id}')">Delete</button></td></tr>`).join('')}
function dashboard(){const net=total('income')-total('expense'),loans=outstanding(state.loans),debts=outstanding(state.debts);const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];let bars='';for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');const inc=state.transactions.filter(t=>t.type==='income'&&t.date?.startsWith(key)).reduce((s,t)=>s+t.amount,0);const exp=state.transactions.filter(t=>t.type==='expense'&&t.date?.startsWith(key)).reduce((s,t)=>s+t.amount,0);const max=Math.max(inc,exp,1);bars+=`<div class="barcol"><div class="bars"><div class="bar" style="height:${Math.max(4,inc/max*100)}%"></div><div class="bar exp" style="height:${Math.max(4,exp/max*100)}%"></div></div><small>${months[d.getMonth()]}</small></div>`}return `<div class="welcome"><div><div class="eyebrow">YOUR MONEY, IN FOCUS</div><h1>Financial overview</h1><p>A clearer view of your money starts with one small step.</p></div><button class="primary goldbtn" onclick="addTransaction('expense')">＋ Quick entry</button></div><div class="cards">${metric('Net cash flow',fmt(net),'◈',`<span class="${net>=0?'positive':'negative'}">${net>=0?'Positive':'Negative'} · all recorded time</span>`)}${metric('Total income',fmt(total('income')),'↗','All recorded income')}${metric('Total expenses',fmt(total('expense')),'↘','All recorded expenses')}${metric('Loans receivable',fmt(loans),'⇄',`${state.loans.length} loan account(s)`)}</div><div class="layout"><section class="panel"><div class="panelhead"><div><h2>Cash flow</h2><p>Income and expenses · last 6 months</p></div><button class="linkbtn" onclick="go('Reports')">View reports ↗</button></div><div class="chart">${bars}</div><div class="legend"><span><i class="dot"></i>Income</span><span><i class="dot grey"></i>Expenses</span></div></section><section class="panel"><div class="panelhead"><div><h2>Quick actions</h2><p>Record it while it's fresh</p></div></div><div class="quick"><button onclick="addTransaction('income')"><span class="qico">↗</span><span><b>Add income</b><small>Money received</small></span></button><button onclick="addTransaction('expense')"><span class="qico">↘</span><span><b>Add expense</b><small>Money spent</small></span></button><button onclick="addLoan('loan')"><span class="qico">⇄</span><span><b>Loan given</b><small>Track interest</small></span></button><button onclick="addPayment()"><span class="qico">✓</span><span><b>Record payment</b><small>Update a balance</small></span></button></div></section></div><section class="panel" style="margin-bottom:18px"><div class="panelhead"><div><h2>Recent transactions</h2><p>Your latest financial activity</p></div><button class="linkbtn" onclick="go('Income')">View all ↗</button></div><div class="tablewrap"><table><thead><tr><th>Description</th><th>Date</th><th>Type</th><th style="text-align:right">Amount</th><th></th></tr></thead><tbody>${txRows([...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)))}</tbody></table></div></section><div class="layout"><section class="panel"><div class="panelhead"><div><h2>Money to repay</h2><p>Outstanding principal</p></div><button class="linkbtn" onclick="go('Debts')">Details ↗</button></div><strong style="font-size:25px">${fmt(debts)}</strong><p class="sub">Across ${state.debts.length} debt account(s)</p></section><section class="panel"><div class="panelhead"><div><h2>Interest accrued estimate</h2><p>Based on active loan settings</p></div></div><strong style="font-size:25px">${fmt(state.loans.reduce((s,l)=>s+interest(l),0))}</strong><p class="sub">Estimate only; confirm agreed calculation rules.</p></section></div>`}
function transactionsPage(type){const arr=state.transactions.filter(t=>type==='all'||t.type===type).sort((a,b)=>b.date.localeCompare(a.date));return `${pageHead(type==='income'?'Income':type==='expense'?'Expenses':'Transactions','Every amount, categorized and easy to find.',type==='expense'?'Add expense':'Add income',`addTransaction('${type==='expense'?'expense':'income'}')`)}<div class="cards">${metric('Total income',fmt(total('income')),'↗','All records')}${metric('Total expenses',fmt(total('expense')),'↘','All records')}${metric('Transactions',arr.length,'▤','Matching records')}${metric('Net cash flow',fmt(total('income')-total('expense')),'◈','Income minus expenses')}</div><div class="panel"><div class="toolbar"><input id="txSearch" placeholder="Search description or category..." oninput="filterTx()"><select id="txType" onchange="filterTx()"><option value="all">All types</option><option value="income">Income</option><option value="expense">Expense</option></select><input id="txMonth" type="month" onchange="filterTx()"></div><div class="tablewrap"><table><thead><tr><th>Description</th><th>Date</th><th>Type</th><th style="text-align:right">Amount</th><th></th></tr></thead><tbody id="txBody">${txRows(arr)}</tbody></table></div></div>`}
function filterTx(){const q=(document.getElementById('txSearch')?.value||'').toLowerCase(),typ=document.getElementById('txType')?.value||'all',month=document.getElementById('txMonth')?.value||'';const arr=state.transactions.filter(t=>(typ==='all'||t.type===typ)&&(!month||t.date.startsWith(month))&&(`${t.title} ${t.category} ${t.note}`.toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('txBody').innerHTML=txRows(arr)}
function loanRows(list,kind){if(!list.length)return `<tr><td colspan="6" class="empty">No accounts yet. Add your first account to track balances and interest.</td></tr>`;return list.map(l=>{const bal=Math.max(0,l.principal-(l.principalPaid||0));return `<tr><td><div class="txname"><div class="txico">⇄</div><div><b>${escapeHtml(l.person)}</b><small>${escapeHtml(l.note||'No notes')}</small></div></div></td><td>${fmt(l.principal)}</td><td>${l.rate||0}% / ${l.period==='yearly'?'year':'month'}</td><td>${fmt(interest(l))}</td><td><b>${fmt(bal)}</b></td><td><button class="linkbtn" onclick="payFor('${kind}','${l.id}')">Payment</button> <button class="linkbtn" onclick="editLoan('${kind}','${l.id}')">Edit</button> <button class="linkbtn" onclick="deleteLoan('${kind}','${l.id}')">Delete</button></td></tr>`}).join('')}
function payFor(kind,id){addPaymentFor(kind,id)}
function addPaymentFor(kind,id){const l=(kind==='loan'?state.loans:state.debts).find(x=>x.id===id);if(!l)return;openModal('Record payment · '+escapeHtml(l.person),`<form id="payOne"><div class="formgrid">${field('Amount ('+state.currency+')','amount','number')}${field('Date','date','date',today())}${field('Apply to','apply','select','','<option value="interest">Interest</option><option value="principal">Principal</option><option value="other">Other / mixed</option>')}<div class="field full"><label>Note</label><input name="note"></div></div><div class="formactions"><button type="button" class="pill" onclick="closeModal()">Cancel</button><button class="primary">Save payment</button></div></form>`);document.getElementById('payOne').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),p={id:crypto.randomUUID(),account:id,kind,amount:Number(f.get('amount')),date:f.get('date'),apply:f.get('apply'),note:f.get('note')};state.payments.unshift(p);if(p.apply==='principal')l.principalPaid=Math.min(l.principal,Number(l.principalPaid||0)+p.amount);save();closeModal();render();toast('Payment saved')}}
function loansPage(kind){const list=kind==='loan'?state.loans:state.debts;const totalBal=outstanding(list);return `${pageHead(kind==='loan'?'Loans given':'My debts',kind==='loan'?'Track money you lent, interest accrual and repayments.':'Track money you owe and your repayment progress.',kind==='loan'?'Add loan':'Add debt',`addLoan('${kind}')`)}<div class="cards">${metric('Principal issued',fmt(list.reduce((s,l)=>s+l.principal,0)),'⇄','Original amounts')}${metric('Principal repaid',fmt(list.reduce((s,l)=>s+(l.principalPaid||0),0)),'✓','Recorded principal payments')}${metric('Outstanding principal',fmt(totalBal),'◈','Excludes unpaid interest')}${metric('Accrued interest (estimate)',fmt(list.reduce((s,l)=>s+interest(l),0)),'％','Not a legal statement')}</div><div class="notice">Interest is estimated using simple daily accrual over a 30.4375-day average month unless annual rate is selected. Compound interest is saved as a setting but this starter calculates simple interest only. Review the agreed terms before relying on a balance.</div><div class="panel"><div class="panelhead"><div><h2>${kind==='loan'?'Receivable accounts':'Debt accounts'}</h2><p>Interest and principal are tracked separately</p></div></div><div class="tablewrap"><table><thead><tr><th>Person / institution</th><th>Principal</th><th>Rate</th><th>Interest estimate</th><th>Remaining</th><th>Actions</th></tr></thead><tbody>${loanRows(list,kind)}</tbody></table></div></div>`}
function savingsPage(){const totalS=state.savings.reduce((s,x)=>s+Number(x.saved||0),0);return `${pageHead('Savings & goals','Build your future, one goal at a time.','Add savings goal','addSaving()')}<div class="cards">${metric('Total savings',fmt(totalS),'◈','Across all goals')}${metric('Active goals',state.savings.length,'◎','Your targets')}${metric('Income recorded',fmt(total('income')),'↗','All time')}${metric('Available after expenses',fmt(total('income')-total('expense')),'✦','Recorded net cash flow')}</div><div class="layout"><section class="panel"><div class="panelhead"><div><h2>Your goals</h2><p>Track progress toward what matters</p></div></div>${state.savings.length?state.savings.map(s=>`<div style="padding:15px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:10px"><b>${escapeHtml(s.name)}</b><small>${fmt(s.saved)} / ${fmt(s.target)}</small></div><div style="height:7px;background:#eef1f5;border-radius:9px;margin:12px 0;overflow:hidden"><div style="height:100%;width:${Math.min(100,s.target?s.saved/s.target*100:0)}%;background:var(--gold);border-radius:9px"></div></div><small class="sub">${s.target?Math.round(s.saved/s.target*100):0}% complete · ${escapeHtml(s.date||'No target date')}</small> <button class="linkbtn" onclick="addToSaving('${s.id}')">＋ Add money</button></div>`).join(''):'<div class="empty">Create your first savings goal.</div>'}</section><section class="panel"><h2 style="font-size:15px;margin-top:0">Savings tip</h2><p style="font-size:12px;line-height:1.8;color:var(--muted)">Give every goal a name, target amount, and date. A small automatic habit can make progress easier to see. Keep emergency savings separate from money intended for planned purchases.</p></section></div>`}
function addSaving(){openModal('Create savings goal',`<form id="savingForm"><div class="formgrid">${field('Goal name','name')}${field('Target amount ('+state.currency+')','target','number')}${field('Already saved','saved','number','0')}${field('Target date (optional)','date','date','')}</div><div class="formactions"><button type="button" class="pill" onclick="closeModal()">Cancel</button><button class="primary">Create goal</button></div></form>`);document.getElementById('savingForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.savings.push({id:crypto.randomUUID(),name:f.get('name'),target:Number(f.get('target')),saved:Number(f.get('saved')||0),date:f.get('date')});save();closeModal();render();toast('Goal created')}}
function addToSaving(id){const s=state.savings.find(x=>x.id===id);openModal('Add to savings',`<form id="savingAdd">${field('Amount','amount','number')}<div class="formactions"><button type="button" class="pill" onclick="closeModal()">Cancel</button><button class="primary">Add</button></div></form>`);document.getElementById('savingAdd').onsubmit=e=>{e.preventDefault();s.saved+=Number(new FormData(e.target).get('amount'));save();closeModal();render();toast('Savings updated')}}
function paymentsPage(){return `${pageHead('Payment history','Every repayment in one auditable timeline.','Record payment','addPayment()')}<div class="panel"><div class="tablewrap"><table><thead><tr><th>Date</th><th>Account</th><th>Type</th><th>Applied to</th><th>Note</th><th style="text-align:right">Amount</th></tr></thead><tbody>${state.payments.length?state.payments.map(p=>{const l=(p.kind==='loan'?state.loans:state.debts).find(x=>x.id===p.account);return `<tr><td>${escapeHtml(p.date)}</td><td>${escapeHtml(l?.person||'Account removed')}</td><td>${p.kind==='loan'?'Loan given':'My debt'}</td><td>${escapeHtml(p.apply)}</td><td>${escapeHtml(p.note||'—')}</td><td style="text-align:right">${fmt(p.amount)}</td></tr>`}).join(''):'<tr><td colspan="6" class="empty">No payments recorded yet.</td></tr>'}</tbody></table></div></div>`}
function budgetPage(){return `${pageHead('Budget planner','Set spending limits and compare them with recorded expenses.','Add budget','addBudget()')}<div class="layout"><section class="panel"><div class="panelhead"><div><h2>Category budgets</h2><p>Monthly spending limits</p></div></div>${state.budgets.length?state.budgets.map(b=>{const spent=state.transactions.filter(t=>t.type==='expense'&&t.category===b.category&&t.date?.startsWith(today().slice(0,7))).reduce((s,t)=>s+t.amount,0);return `<div style="padding:14px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between"><b style="font-size:12px">${escapeHtml(b.category)}</b><span style="font-size:11px">${fmt(spent)} / ${fmt(b.limit)}</span></div><div style="height:7px;background:#eef1f5;border-radius:9px;margin-top:10px;overflow:hidden"><div style="height:100%;width:${Math.min(100,spent/b.limit*100)}%;background:${spent>b.limit?'var(--red)':'var(--gold)'}"></div></div><small class="sub">${spent>b.limit?'Over budget by '+fmt(spent-b.limit):fmt(b.limit-spent)+' remaining'}</small></div>`}).join(''):'<div class="empty">No budgets yet. Set a category limit to get started.</div>'}</section><section class="panel"><h2 style="font-size:15px;margin-top:0">This month</h2><p class="sub">Total expenses recorded</p><strong style="font-size:27px">${fmt(state.transactions.filter(t=>t.type==='expense'&&t.date?.startsWith(today().slice(0,7))).reduce((s,t)=>s+t.amount,0))}</strong><p class="sub">Only transactions dated in the current month are included.</p></section></div>`}
function addBudget(){openModal('Add category budget',`<form id="budgetForm"><div class="formgrid">${field('Category','category','select','','<option>Food</option><option>Housing</option><option>Transport</option><option>Shopping</option><option>Health</option><option>Other</option>')}${field('Monthly limit ('+state.currency+')','limit','number')}</div><div class="formactions"><button type="button" class="pill" onclick="closeModal()">Cancel</button><button class="primary">Save budget</button></div></form>`);document.getElementById('budgetForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.budgets.push({id:crypto.randomUUID(),category:f.get('category'),limit:Number(f.get('limit'))});save();closeModal();render();toast('Budget saved')}}
function reportsPage(){const income=total('income'),expense=total('expense');const cats={};state.transactions.filter(t=>t.type==='expense').forEach(t=>cats[t.category]=(cats[t.category]||0)+t.amount);return `${pageHead('Reports & insights','A simple snapshot of your recorded financial activity.','Export CSV','exportCSV()')}<div class="cards">${metric('Income',fmt(income),'↗','Recorded total')}${metric('Expenses',fmt(expense),'↘','Recorded total')}${metric('Net cash flow',fmt(income-expense),'◈','Income minus expenses')}${metric('Savings rate',income?Math.round((income-expense)/income*100)+'%':'—','％','Based on recorded income')}</div><div class="layout"><section class="panel"><div class="panelhead"><div><h2>Expense breakdown</h2><p>By category · all recorded time</p></div></div>${Object.entries(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([cat,n])=>`<div style="padding:11px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;font-size:12px"><b>${escapeHtml(cat)}</b><span>${fmt(n)}</span></div><div style="height:6px;background:#edf0f5;border-radius:9px;margin-top:8px"><div style="height:100%;width:${expense?n/expense*100:0}%;background:var(--gold);border-radius:9px"></div></div></div>`).join(''):'<div class="empty">Add expense records to see a breakdown.</div>'}</section><section class="panel"><h2 style="font-size:15px;margin-top:0">Export & review</h2><p style="font-size:12px;line-height:1.7;color:var(--muted)">Download your transaction records as CSV for spreadsheets, or export all records as a JSON backup. Keep backups somewhere secure.</p><button class="primary" onclick="exportCSV()">⇩ Download transaction CSV</button><p><button class="pill" onclick="exportData()">Download full JSON backup</button></p></section></div>`}
function settingsPage(){return `${pageHead('Settings & backup','Manage your preferences and protect your records.')}<div class="notice"><b>Important:</b> This starter currently saves data in this browser on this device only. It does not yet sync to Firebase or provide account-based cloud backup. Export a JSON backup regularly. Do not enter sensitive financial data until cloud authentication and security rules are configured.</div><div class="settingsgrid"><section class="panel"><h2 style="font-size:15px;margin-top:0">Preferences</h2><div class="field" style="margin:16px 0"><label>Currency</label><select id="currency" onchange="state.currency=this.value;save();render()"><option value="THB" ${state.currency==='THB'?'selected':''}>Thai Baht (THB ฿)</option><option value="MMK" ${state.currency==='MMK'?'selected':''}>Myanmar Kyat (MMK)</option><option value="USD" ${state.currency==='USD'?'selected':''}>US Dollar (USD $)</option><option value="SGD" ${state.currency==='SGD'?'selected':''}>Singapore Dollar (SGD)</option></select></div><p class="sub">Currency changes the display symbol; it does not convert saved amounts.</p></section><section class="panel"><h2 style="font-size:15px;margin-top:0">Backup & restore</h2><p class="sub">Export a complete copy of all records or restore from a previous Finance Master JSON backup.</p><p><button class="primary" onclick="exportData()">⇩ Export full backup</button></p><p><label class="pill" style="display:inline-block">⇧ Restore JSON backup <input type="file" accept=".json,application/json" onchange="restoreData(event)" style="display:none"></label></p><button class="pill" onclick="exportCSV()">Export transactions CSV</button></section><section class="panel"><h2 style="font-size:15px;margin-top:0">Cloud & security status</h2><p><span class="tag out">Cloud sync not configured</span></p><p class="sub">Firebase Authentication, Firestore, account-level access controls and scheduled reminders must be connected before this becomes a cloud-synced production finance app.</p></section><section class="panel"><h2 style="font-size:15px;margin-top:0">Data controls</h2><p class="sub">Reset permanently deletes the records stored in this browser. Export a backup first.</p><button class="pill" style="color:var(--red)" onclick="resetData()">Reset local data</button></section></div>`}
function editTx(id){
 const t=state.transactions.find(x=>x.id===id);
 if(!t){toast('Transaction not found');return}
 const cats=['Salary','Food','Housing','Transport','Shopping','Health','Bonus','Other'];
 const opts=cats.map(c=>`<option ${t.category===c?'selected':''}>${c}</option>`).join('');
 openModal('Edit transaction',`<form id="editTxForm"><div class="formgrid">
 ${field('Description','title','text',t.title)}
 ${field('Amount ('+state.currency+')','amount','number',String(t.amount))}
 ${field('Date','date','date',t.date)}
 ${field('Category','category','select','','${''}'+opts)}
 <div class="field full"><label>Note (optional)</label><input name="note" value="${escapeHtml(t.note||'')}" placeholder="Add details..."></div>
 </div><div class="formactions"><button type="button" class="pill" onclick="closeModal()">Cancel</button><button class="primary">Save changes</button></div></form>`);
 const form=document.getElementById('editTxForm');
 form.onsubmit=e=>{
  e.preventDefault();
  const f=new FormData(form), amount=Number(f.get('amount'));
  if(!Number.isFinite(amount)||amount<0){toast('Enter a valid amount');return}
  Object.assign(t,{title:String(f.get('title')||'').trim(),amount,date:f.get('date'),category:f.get('category'),note:f.get('note')});
  save();closeModal();render();toast('Transaction updated');
 };
}
function deleteTx(id){if(confirm('Delete this transaction? This cannot be undone. Export a backup first if needed.')){state.transactions=state.transactions.filter(t=>t.id!==id);save();render();toast('Transaction deleted')}}
function editLoan(kind,id){
 const list=kind==='loan'?state.loans:state.debts;
 const l=list.find(x=>x.id===id);
 if(!l){toast('Account not found');return}
 openModal(kind==='loan'?'Edit loan account':'Edit debt account',\`<form id="editLoanForm"><div class="formgrid">
 \${field('Person / Institution','person','text',l.person)}
 \${field('Principal ('+state.currency+')','principal','number',String(l.principal))}
 \${field('Interest rate (%)','rate','number',String(l.rate||0))}
 <div class="field"><label>Interest period</label><select name="period" required><option value="monthly" \${l.period==='monthly'?'selected':''}>Monthly</option><option value="yearly" \${l.period==='yearly'?'selected':''}>Yearly</option><option value="none" \${l.period==='none'?'selected':''}>No interest</option></select></div>
 \${field('Interest starts','start','date',l.start||today())}
 \${field('Interest stops (optional)','stop','date',l.stop||'')}
 \${field('Due date (optional)','due','date',l.due||'')}
 <div class="field full"><label>Interest method</label><select name="method"><option value="simple" \${(l.method||'simple')==='simple'?'selected':''}>Simple interest</option><option value="compound" \${l.method==='compound'?'selected':''}>Compound interest (currently estimated as simple)</option></select></div>
 <div class="field full"><label>Notes</label><input name="note" value="\${escapeHtml(l.note||'')}"></div>
 </div><div class="notice">Payment history is preserved. If you change principal, verify the amount against your original agreement.</div>
 <div class="formactions"><button type="button" class="pill" onclick="closeModal()">Cancel</button><button class="primary">Save changes</button></div></form>\`);
 const form=document.getElementById('editLoanForm');
 form.onsubmit=e=>{
  e.preventDefault();
  const f=new FormData(form),principal=Number(f.get('principal')),rate=Number(f.get('rate'));
  if(!String(f.get('person')||'').trim()||!Number.isFinite(principal)||principal<0||!Number.isFinite(rate)||rate<0){toast('Enter valid account details');return}
  Object.assign(l,{person:String(f.get('person')).trim(),principal,rate,period:f.get('period'),start:f.get('start'),stop:f.get('stop'),due:f.get('due'),method:f.get('method'),note:f.get('note')});
  l.principalPaid=Math.min(principal,Number(l.principalPaid||0));
  save();closeModal();render();toast('Account updated');
 };
}
function deleteLoan(kind,id){if(!confirm('Delete this account? Related payment history will remain but may show Account removed.'))return;state[kind==='loan'?'loans':'debts']=state[kind==='loan'?'loans':'debts'].filter(x=>x.id!==id);save();render();toast('Account deleted')}
function exportData(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString(),formatVersion:1},null,2)],{type:'application/json'});download(blob,'finance-master-backup-'+today()+'.json')}
function exportCSV(){const rows=[['Date','Type','Description','Category','Amount','Note'],...state.transactions.map(t=>[t.date,t.type,t.title,t.category,t.amount,t.note||''])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'finance-master-transactions-'+today()+'.csv')}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function restoreData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const incoming=JSON.parse(reader.result);if(!incoming||!Array.isArray(incoming.transactions))throw Error('Invalid backup');if(!confirm('Restore backup and replace the records currently stored on this device? Export current data first if you need it.'))return;state={currency:incoming.currency||'THB',transactions:incoming.transactions||[],loans:incoming.loans||[],debts:incoming.debts||[],savings:incoming.savings||[],budgets:incoming.budgets||[],payments:incoming.payments||[]};save();render();toast('Backup restored')}catch(err){alert('Could not restore: this file is not a valid Finance Master backup.')}};reader.readAsText(file)}
function resetData(){if(!confirm('Permanently delete ALL local Finance Master records on this device? Export a backup first.'))return;state={currency:state.currency,transactions:[],loans:[],debts:[],savings:[],budgets:[],payments:[]};save();render();toast('Local records reset')}
function render(){const el=document.getElementById('content');switch(current){case'Dashboard':el.innerHTML=dashboard();break;case'Income':el.innerHTML=transactionsPage('income');break;case'Expenses':el.innerHTML=transactionsPage('expense');break;case'Savings':el.innerHTML=savingsPage();break;case'Loans':el.innerHTML=loansPage('loan');break;case'Debts':el.innerHTML=loansPage('debt');break;case'Payments':el.innerHTML=paymentsPage();break;case'Budget':el.innerHTML=budgetPage();break;case'Reports':el.innerHTML=reportsPage();break;case'Settings':el.innerHTML=settingsPage();break;default:el.innerHTML=dashboard()}}
render();
</script></body></html>
