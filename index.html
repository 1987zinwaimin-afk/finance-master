/* Mobile overflow hardening */
.app,.main,.content,.layout,.panel,.metric,.setting,.account-card,.account-main,.account-balance,.person-title,.person-tab-content,.detail-item,.panelhead,.pagehead,.welcome,.toolbar,.topactions{min-width:0;max-width:100%}
.content *,.modal *,.mobile-more-panel *{min-width:0}
h1,h2,h3,p,small,b,strong,label,button,a,span,td,th,.notice,.setting,.empty{overflow-wrap:anywhere}
button,.primary,.pill,.linkbtn,.toolbar button,.formactions button{max-width:100%;white-space:normal;line-height:1.35}
input,select,textarea{min-width:0;max-width:100%}
.tablewrap,.ledger-table,.person-payments{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{max-width:100%}
img,svg,canvas,video{max-width:100%}
@media(max-width:700px){

  .welcome,.pagehead,.panelhead{flex-wrap:wrap}

  .cards,.person-metrics,.ledger-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric{padding:12px 10px}
  .metric strong,.content .metric strong{font-size:clamp(12px,3.6vw,16px);line-height:1.25;letter-spacing:-.25px;overflow-wrap:anywhere;word-break:normal}
  .metrichead{flex-wrap:wrap}
  .account-open{min-width:0;flex-wrap:wrap}
  .account-main{flex:1 1 100px}
  .account-balance{max-width:100%;overflow-wrap:anywhere}
  .account-balance>b{font-size:clamp(11px,3.2vw,14px);overflow-wrap:anywhere}
  .detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .detail-item b{overflow-wrap:anywhere;word-break:normal}
  .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quick button{min-width:0}
  .toolbar{width:100%}

  .formgrid,.settingsgrid{grid-template-columns:minmax(0,1fr)}

/* Premium Finance UI polish: Navy + Gold with a persistent Light/Dark theme */
:root{color-scheme:light;--navy:#14233f;--navy2:#203454;--gold:#d8b56d;--bg:#f3f6fc;--ink:#18243a;--muted:#78869b;--line:#e1e7f0;--card:#fff;--surface:#fff;--surface-soft:#f7f9fd;--shadow:0 8px 26px rgba(20,35,63,.055)}
body{background:var(--bg);color:var(--ink);transition:background-color .2s ease,color .2s ease}
.panel,.metric{background:var(--card);border-color:var(--line);box-shadow:var(--shadow);border-radius:20px}
.panel{padding:clamp(18px,2.5vw,28px)}
.panelhead h2,h1,h2,h3{letter-spacing:-.025em}
button,.pill,select,input,textarea{transition:background-color .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d8b56d88;outline-offset:2px}
.theme-toggle{border-color:#d8b56d88!important;color:var(--ink)!important;background:var(--card)!important;font-weight:700;white-space:nowrap}

<script>
const KEY='finance-master-personal-v1';
const today=()=>new Date().toISOString().slice(0,10);
const fmt=(n,currency=state.currency||'THB')=>new Intl.NumberFormat('en-US',{style:'currency',currency:['THB','MMK','USD','SGD'].includes(currency)?currency:'THB',maximumFractionDigits:2}).format(Number(n)||0);
const recordCurrency=x=>['THB','MMK','USD','SGD'].includes(x?.currency)?x.currency:null;
const moneyFor=(n,x)=>fmt(n,recordCurrency(x)||state.currency||'THB');
const currencyLabel=c=>({THB:'THB ฿',MMK:'MMK K',USD:'USD $',SGD:'SGD $'}[c]||c||'Unclassified');
let state={currency:'THB',transactions:[],loans:[],debts:[],savings:[],budgets:[],payments:[],payroll:{},expenseGroups:['အိမ်အသုံးစရိတ်','စားသောက်စရိတ်','သွားလာစရိတ်'],ownerData:{phone:'',address:'',bankName:'',bankQr:'',remark:''}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)state={...state,...s}}catch(e){};
if(!Array.isArray(state.expenseGroups))state.expenseGroups=['အိမ်အသုံးစရိတ်','စားသောက်စရိတ်','သွားလာစရိတ်'];
if(!state.expenseGroupItems||typeof state.expenseGroupItems!=='object'||Array.isArray(state.expenseGroupItems))state.expenseGroupItems={};
let current='Dashboard';
function save(){localStorage.setItem(KEY,JSON.stringify(state));const el=document.getElementById('saveStatus');if(el)el.textContent='● Saved on this device';if(window.fmScheduleSync)window.fmScheduleSync(state);if(window.fmBorrowerCloud?.scheduleSnapshotSync)window.fmBorrowerCloud.scheduleSnapshotSync()}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(p){current=p;const more=document.getElementById('mobileMorePanel');if(more)more.classList.remove('open');render();if(window.scrollTo)window.scrollTo({top:0,behavior:'auto'});}

function toggleMobile(){const p=document.getElementById('mobileMorePanel');if(!p)return;p.classList.toggle('open')}
function total(type,currency=state.currency||'THB'){return state.transactions.filter(t=>t.type===type&&recordCurrency(t)===currency).reduce((a,t)=>a+Number(t.amount||0),0)}

function legacyCurrencyCount(){const lists=['transactions','loans','debts','savings','budgets','payments'];return lists.reduce((n,k)=>n+(state[k]||[]).filter(x=>!recordCurrency(x)).length,0)}
function reviewLegacyCurrencies(){const groups=[['transactions','Transactions'],['loans','Loans given'],['debts','My debts'],['savings','Savings goals'],['budgets','Budgets']];let changed=0;for(const [key,label] of groups){for(const item of (state[key]||[])){if(recordCurrency(item))continue;const amount=key==='transactions'?item.amount:key==='loans'||key==='debts'?item.principal:key==='savings'?item.saved:item.limit;const name=key==='transactions'?item.title:key==='loans'||key==='debts'?item.person:key==='savings'?item.name:item.category;const answer=prompt(label+' — '+String(name||'Unnamed record')+' — amount '+String(amount??'')+'\\nEnter THB, MMK, USD or SGD. Leave blank to skip this record.');if(answer===null){save();render();toast('Review paused. Your labels were saved.');return}const c=String(answer).trim().toUpperCase();if(!c)continue;if(!['THB','MMK','USD','SGD'].includes(c)){alert('Invalid currency. This record was left unchanged.');continue}item.currency=c;changed++}}for(const p of (state.payments||[])){const account=(state[p.kind==='loan'?'loans':'debts']||[]).find(a=>a.id===p.account);if(account&&recordCurrency(account)&&p.currency!==account.currency){p.currency=account.currency;changed++}}save();render();toast(changed+' currency label(s) saved. No amounts were converted.');}

let fmOcrPromise=null;
async function getSlipOcr(){

async function getSlipOcrWorker(){

 // Download trained language data on demand; include Myanmar for Burmese-language memos.
 return await T.createWorker(['eng','tha','mya'],1,{logger:m=>{}});
}
function parseSlipText(text){
 const thaiDigits={'๐':'0','๑':'1','๒':'2','๓':'3','๔':'4','๕':'5','๖':'6','๗':'7','๘':'8','๙':'9'};
 const normalized=String(text||'').replace(/[๐-๙]/g,ch=>thaiDigits[ch]||ch).replace(/[฿]/g,' THB ');
 const lines=normalized.split(/\r?\n/).map(x=>x.replace(/[|]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
 const full=lines.join('\n');
 let amount=null;
 const amountLabels=/(?:transfer\s*amount|transaction\s*amount|amount|ยอดเงินที่โอน|จำนวนเงิน|จำนวนที่โอน|ยอดโอน|โอนเงิน|เงินที่โอน|ยอดชำระ|ยอดเงิน|จำนวน|amount\s*\(thb\))/i;
 const numberRe=/(?:THB\s*)?([0-9][0-9,]*(?:\.[0-9]{1,2})?)(?:\s*(?:THB|บาท))?/gi;
 for(let i=0;i<lines.length;i++){
   if(amountLabels.test(lines[i])){
     const candidates=[lines[i],lines[i+1]||''].join(' ');
     const matches=[...candidates.matchAll(numberRe)];
     const vals=matches.map(x=>Number(x[1].replace(/,/g,''))).filter(n=>n>0&&n<1e10);
     if(vals.length){amount=vals[vals.length-1];break}
   }
 }
 if(amount===null){
   const matches=[...full.matchAll(/(?:THB\s*|บาท\s*)([0-9][0-9,]*(?:\.[0-9]{1,2})?)/gi)];
   const vals=matches.map(x=>Number(x[1].replace(/,/g,''))).filter(n=>n>0&&n<1e10);
   if(vals.length)amount=vals[0];
 }
 if(amount===null){
   const decimals=[...full.matchAll(/\b([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{2})|[0-9]+\.[0-9]{2})\b/g)]
     .map(x=>Number(x[1].replace(/,/g,''))).filter(n=>n>0&&n<1e10);
   if(decimals.length)amount=decimals.sort((a,b)=>b-a)[0];
 }
 let remark='';
 const remarkLabels=/(?:remark|payment\s*note|note|memo|message|หมายเหตุ|บันทึกช่วยจำ|รายละเอียด|ข้อความถึงผู้รับ|วัตถุประสงค์|บันทึก|ข้อความ)/i;
 for(let i=0;i<lines.length;i++){
   const line=lines[i], at=line.search(remarkLabels);
   if(at>=0){
     let value=line.slice(at).replace(remarkLabels,'').replace(/^\s*[:：-]?\s*/,'').trim();
     if(!value && lines[i+1])value=lines[i+1];
     if(value && !/^(?:amount|ยอดเงิน|วันที่|date|time|reference|เลขที่|transaction|fee|ค่าธรรมเนียม|balance|ยอดคงเหลือ)/i.test(value)){remark=value;break}
   }
 }
 if(remark.length>120)remark=remark.slice(0,120).trim();
 return {amount,remark,text:full};
}
function inferExpenseCategory(text){
 const t=(text||'').toLowerCase();
 if(/food|meal|restaurant|coffee|อาหาร|ข้าว|ร้านอาหาร|กาแฟ/.test(t))return 'Food';
 if(/rent|room|housing|electric|water|ค่าเช่า|ห้องพัก|ค่าไฟ|ค่าน้ำ/.test(t))return 'Housing';
 if(/transport|taxi|grab|fuel|gas|รถ|น้ำมัน|เดินทาง|ค่าโดยสาร/.test(t))return 'Transport';
 if(/shopping|purchase|สินค้า|ซื้อของ|ช้อป/.test(t))return 'Shopping';
 if(/health|hospital|clinic|ยา|โรงพยาบาล|คลินิก/.test(t))return 'Health';
 return 'Other';
}
async function readBankSlip(input,formId){
 const file=input.files&&input.files[0], form=document.getElementById(formId), statusEl=document.getElementById('slipStatus_'+formId);
 if(!file||!form||!statusEl)return;
 if(!file.type.startsWith('image/')){statusEl.textContent='Please choose an image file.';return}
 statusEl.textContent='Reading slip… This may take a little while on a phone.';
 try{
   const worker=await getSlipOcrWorker();
   const result=await worker.recognize(file);
   await worker.terminate();
   const parsed=parseSlipText(result.data.text||'');
   const set=(name,value)=>{const el=form.elements.namedItem(name);if(el&&value!==null&&value!==undefined&&String(value).trim()!=='')el.value=value};
   if(parsed.amount!==null)set('amount',parsed.amount);
   if(parsed.remark){
     set('note',parsed.remark);
     if(formId==='txForm')set('title',parsed.remark);
   }
   if(formId==='txForm'&&parsed.remark){const cat=form.elements.namedItem('category');if(cat)cat.value=inferExpenseCategory(parsed.remark)}
   const found=[];
   if(parsed.amount!==null)found.push('Amount: '+parsed.amount.toLocaleString()+' '+state.currency);else found.push('Amount not detected — enter it manually.');
   if(parsed.remark)found.push('Remark: '+parsed.remark);else found.push('Remark not detected — enter it manually.');
   const ocrPreview=(parsed.text||'').replace(/\s+/g,' ').trim().slice(0,260);
   statusEl.textContent='Slip scanned. '+found.join(' · ')+' Please verify the fields before saving.'+(ocrPreview?' OCR text: '+ocrPreview:' No readable text found. Try a sharper, full slip image with all edges visible.');
 }catch(e){statusEl.textContent='Could not read this image automatically: '+(e.message||e)+'. You can still enter the fields manually.'}
}

function allocatePayment(kind,l,amount,date,apply){
  if(!recordCurrency(l))return {error:'Please label this account currency in Settings before recording a payment.'};
  const ledger=loanLedger(kind,l,date);
  const principalLeft=Math.max(0,Number(ledger.principalOutstanding)||0);
  const interestLeft=Math.max(0,Number(ledger.interestOutstanding)||0);
  const eps=0.004;
  if(apply==='auto'&&amount>principalLeft+interestLeft+eps)return {error:'Payment is larger than the outstanding principal plus interest ('+fmt(principalLeft+interestLeft,recordCurrency(l)||state.currency||'THB')+'). Reduce the amount or choose “Other / mixed” to record it without changing the balance.'};
  if(apply==='principal'&&amount>principalLeft+eps)return {error:'Principal outstanding on this date is '+fmt(principalLeft,recordCurrency(l)||state.currency||'THB')+'. Enter no more than that amount, or choose “Other / mixed” to record a separate amount.'};
  // Interest-only payments can be larger than the currently due interest. Allocate only
  // to the oldest unpaid interest buckets; keep any excess explicitly unallocated
  // instead of silently reducing principal or assigning it to a future month.
  const interestApplied=apply==='auto'?Math.min(amount,interestLeft):apply==='interest'?Math.min(amount,interestLeft):0;
  const principalApplied=apply==='auto'?Math.min(principalLeft,Math.max(0,amount-interestApplied)):apply==='principal'?amount:0;
  const unallocated=apply==='interest'?Math.max(0,amount-interestApplied):0;
  return {interestApplied,principalApplied,unallocated};
}

ate<accountStart){toast('Payment date cannot be earlier than the account start date ('+accountStart+').');return}const allocation=allocatePayment(kind,l,amount,date,apply);if(allocation.error){toast(allocation.error);return}const {interestApplied,principalApplied,unallocated}=allocation;const p={id:crypto.randomUUID(),account:id,kind,amount,currency:l.currency||state.currency||'THB',date,apply,note:String(f.get('note')||'').trim(),interestApplied,principalApplied,...(unallocated>0?{unallocated}: {})};p.currency=l.currency||state.currency||'THB';state.payments.unshift(p);if(principalApplied>0)l.principalPaid=Math.min(Number(l.principal)||0,Number(l.principalPaid||0)+principalApplied);save();if(kind==='loan')refreshBorrowerShareForLoan(l);closeModal();render();toast('Payment saved: '+fmt(interestApplied)+' to interest, '+fmt(principalApplied)+' to principal'+(allocation.unallocated>0?'; '+fmt(allocation.unallocated)+' remains unallocated — review it in the payment record':''))}}
function loanAddMonths(start,n){const d=new Date(start+'T00:00:00Z');const day=d.getUTCDate();const target=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+n,1));const last=new Date(Date.UTC(target.getUTCFullYear(),target.getUTCMonth()+1,0)).getUTCDate();target.setUTCDate(Math.min(day,last));return target.toISOString().slice(0,10)}

function monthlyTargetStatus(l,kind='loan',asOf=today()){
 const target=Math.max(0,Number(l?.monthlyTarget)||0);if(!target)return {target:0,underpaidMonths:0,consecutive:0,paidThisMonth:0,warning:false,statuses:[]};
 const currentMonth=String(asOf).slice(0,7),start=String(l.monthlyTargetSince||l.start||l.created||asOf).slice(0,10),startMonth=start.slice(0,7),months=[];let cursor=startMonth;

 for(let guard=0;cursor<=completedThrough&&guard<600;guard++){months.push(cursor);const [y,m]=cursor.split('-').map(Number);cursor=new Date(Date.UTC(y,m,1)).toISOString().slice(0,7);}

function loanLedger(kind,l,throughDate=today(),excludePaymentId=''){
 const through=String(throughDate||today()).slice(0,10),start=String(l.start||l.created||today()).slice(0,10);
 const events=[];
 const rate=loanMonthlyRate(l);
 if(rate>0&&start<=through){for(let n=1;n<600;n++){const due=loanAddMonths(start,n);if(due>through||(l.stop&&due>String(l.stop).slice(0,10)))break;events.push({date:due,type:'due',n})}}
 (state.payments||[]).filter(p=>p.kind===kind&&p.account===l.id&&p.id!==excludePaymentId&&String(p.date||'')>=start&&String(p.date||'').slice(0,10)<=through).forEach(p=>events.push({date:String(p.date||start).slice(0,10),type:'payment',p}));
 events.sort((a,b)=>a.date.localeCompare(b.date)||(a.type===b.type?0:a.type==='due'?-1:1));
 let principal=Math.max(0,Number(l.principal)||0);const buckets=[];
 const applyInterest=amount=>{let left=Math.max(0,Number(amount)||0);for(const b of buckets){if(left<=0)break;const paid=Math.min(b.remaining,left);b.remaining=Math.max(0,b.remaining-paid);left-=paid}return left};
 for(const ev of events){
  if(ev.type==='due'){const compoundBase=principal+(((l.method||'simple')==='compound'||l.interestType==='reassessed')?buckets.reduce((sum,b)=>sum+Math.max(0,b.remaining),0):0);const amount=Math.max(0,compoundBase*rate);if(amount>0)buckets.push({date:ev.date,remaining:amount,original:amount});continue}
  const p=ev.p,amount=Math.max(0,Number(p.amount)||0);
  if(p.apply==='interest'){applyInterest(p.interestApplied!==undefined?Number(p.interestApplied)||0:amount);continue}
  if(p.apply==='principal'){principal=Math.max(0,principal-amount);continue}
  if(p.interestApplied!==undefined||p.principalApplied!==undefined){applyInterest(Number(p.interestApplied)||0);principal=Math.max(0,principal-(Number(p.principalApplied)||0));continue}
  if(p.apply==='auto'){const left=applyInterest(amount);principal=Math.max(0,principal-left)}
 }
 const unpaid=buckets.filter(b=>b.remaining>0.004);
 return {monthlyInterest:Math.max(0,principal*rate),principalOutstanding:principal,interestOutstanding:unpaid.reduce((s,b)=>s+b.remaining,0),unpaidMonths:unpaid.length,unpaidMonthLabels:unpaid.map(b=>new Date(b.date+'T00:00:00Z').toLocaleDateString('en-GB',{month:'short',year:'numeric',timeZone:'UTC'})),monthsDue:buckets.length,interestBuckets:buckets};
}

ed':''))}}

ily amount not set')+'</span></div>'+(daily>0?'<p class="saving-days-left">'+(remaining<=0?'🎉 Target reached!':'At this rate: '+days+' day'+(days===1?'':'s')+' to reach your goal')+'</p>':'<p class="saving-days-left">Set a daily saving amount to estimate how many days remain.</p>')+'<div class="saving-goal-actions-bottom"><button class="primary" type="button" onclick="addToSaving(\''+escapeHtml(goal.id)+'\')">＋ Add money</button></div></div>'}).join(''):'<div class="empty">Create your first savings goal.</div>'}</section><section class="panel"><h2 style="font-size:15px;margin-top:0">Savings tip</h2><p style="font-size:12px;line-height:1.8;color:var(--muted)">Set a target and a daily saving amount to see your remaining balance and estimated time to completion.</p></section></div>`}

 if(accounts.some(a=>a.id===p.account)){toast('This payment is linked to an account; not deleting it here');return}
 const amount=moneyFor(p.amount,p),date=escapeHtml(p.date||'—');
 let body='<div class="notice" style="border-color:#d9a5a5">You are deleting one unlinked historical payment. This cannot be undone from the website. Make sure your JSON backup is safe.</div><p><b>Date:</b> '+date+'</p><p><b>Amount:</b> '+amount+'</p><p><b>Applied to:</b> '+escapeHtml(p.apply||'—')+'</p><p><b>Note:</b> '+escapeHtml(p.note||'—')+'</p><label style="display:flex;gap:8px;align-items:flex-start;margin:14px 0"><input id="confirmDeleteOneOrphan" type="checkbox" style="width:auto;margin-top:4px"><span>I confirm this exact record is not needed.</span></label><div class="formactions"><button type="button" class="pill" onclick="editOrphanPayments('+JSON.stringify(p.kind||'loan')+','+JSON.stringify(String(p.account||''))+')">Cancel</button><button type="button" class="primary" style="background:#9f3030" onclick="confirmDeleteSingleOrphanPayment('+Number(index)+')">Delete this record</button></div>';

 window.confirmDeleteSingleOrphanPayment=function(idx){
  const box=document.getElementById('confirmDeleteOneOrphan');
  if(!box?.checked){toast('Please confirm after checking your backup');return}
  const item=(state.payments||[])[Number(idx)];if(!item)return;

function previewOwnerBankQr(event){const file=event.target.files?.[0],box=document.getElementById('ownerBankQrPreview');if(!file||!box)return;if(!file.type.startsWith('image/')){box.innerHTML='<span class="error">Please select an image file.</span>';event.target.value='';return;}box.innerHTML='<span class="sub">Compressing QR image…</span>';compressChatImage(file).then(src=>{box.innerHTML='<img src="'+src+'" alt="Bank QR preview" style="max-width:220px;max-height:220px;object-fit:contain;border-radius:12px">';box.dataset.pendingQr=src;delete box.dataset.clearQr;}).catch(err=>{box.innerHTML='<span class="error">'+escapeHtml(err.message||'Could not read QR image')+'</span>';event.target.value='';});}
function clearOwnerBankQr(){const box=document.getElementById('ownerBankQrPreview');if(box){box.innerHTML='<span class="sub">Bank QR will be removed when you save.</span>';box.dataset.pendingQr='';box.dataset.clearQr='true';}const input=document.getElementById('ownerBankQr');if(input)input.value='';}
async function saveOwnerDataFromSettings(event){event.preventDefault();const form=event.target,button=document.getElementById('saveOwnerDataButton'),box=document.getElementById('ownerBankQrPreview'),statusEl=document.getElementById('ownerDataSaveStatus');if(button)button.disabled=true;if(statusEl)statusEl.textContent='Saving owner details…';try{const old=ownerDataSafe(),fd=new FormData(form);let bankQr=old.bankQr;if(box?.dataset.clearQr==='true')bankQr='';if(box?.dataset.pendingQr)bankQr=box.dataset.pendingQr;const next={phone:String(fd.get('phone')||'').trim(),guarantorPhone:String(fd.get('guarantorPhone')||'').trim(),address:String(fd.get('address')||'').trim(),bankName:String(fd.get('bankName')||'').trim(),bankAccountName:String(fd.get('bankAccountName')||'').trim(),bankQr,remark:String(fd.get('remark')||'').trim()};if(bankQr.length>450000)throw new Error('QR image is too large after compression. Please choose a smaller image.');state.ownerData=next;save();if(window.fmBorrowerCloud?.ready){const count=await window.fmBorrowerCloud.updateOwnerData(next);toast(count?'Owner Data saved and '+count+' Share Link(s) updated.':'Owner Data saved. New Share Links will include these details.');}else{toast('Owner Data saved locally. Sign in to publish it to Share Links.');}if(box){delete box.dataset.pendingQr;delete box.dataset.clearQr;}render();}catch(err){if(statusEl)statusEl.textContent='Could not update all Share Links: '+String(err?.message||err);toast('Owner Data save failed: '+String(err?.message||err));}finally{if(button)button.disabled=false;}}
function exportData(){const snapshot={...state,exportedAt:new Date().toISOString(),formatVersion:2,backupSummary:{createdAt:new Date().toISOString(),recordInventory:backupInventory()}};const json=JSON.stringify(snapshot,null,2);const verified=JSON.parse(json);if(!verified||!Array.isArray(verified.transactions)||!verified.payroll||typeof verified.payroll!=='object')throw Error('Backup verification failed before download');const blob=new Blob([json],{type:'application/json'});download(blob,'finance-master-backup-'+today()+'.json');toast('Verified full JSON backup downloaded')}
function exportCSV(){const rows=[['Date','Type','Description','Category','Amount','Note'],...state.transactions.map(t=>[t.date,t.type,t.title,t.category,t.amount,t.note||''])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'finance-master-transactions-'+today()+'.csv')}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function backupHasRecords(data){if(!data||typeof data!=='object')return false;return Object.entries(data).some(([k,v])=>{if(['exportedAt','formatVersion','backupSummary','currency'].includes(k))return false;if(Array.isArray(v))return v.length>0;if(v&&typeof v==='object')return Object.keys(v).length>0;return false})}
function backupInventory(){const keys=['transactions','loans','debts','savings','budgets','payments'];const parts=keys.map(k=>{const v=state[k];return k+': '+(Array.isArray(v)?v.length:0)});const payroll=state.payroll&&typeof state.payroll==='object'?Object.keys(state.payroll).length:0;parts.push('payroll months: '+payroll);const extras=Object.keys(state).filter(k=>!keys.includes(k)&&!['currency','payroll','exportedAt','formatVersion','backupSummary'].includes(k));const extraCount=extras.reduce((n,k)=>{const v=state[k];return n+(Array.isArray(v)?v.length:(v&&typeof v==='object'?Object.keys(v).length:0))},0);if(extras.length)parts.push('other data groups: '+extras.length+' ('+extraCount+' entries)');return parts.join(' · ')}

function restoreData(e){const file=e.target.files&&e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const previousState=state,previousRaw=localStorage.getItem(KEY);try{const incoming=JSON.parse(reader.result);const collections=['transactions','loans','debts','savings','budgets','payments'];if(!incoming||typeof incoming!=='object'||Array.isArray(incoming)||!Array.isArray(incoming.transactions)||collections.some(k=>incoming[k]!==undefined&&(!Array.isArray(incoming[k])||incoming[k].some(x=>!x||typeof x!=='object'||Array.isArray(x))))||(incoming.payroll!==undefined&&(!incoming.payroll||typeof incoming.payroll!=='object'||Array.isArray(incoming.payroll))))throw Error('Invalid backup structure');if(incoming.currency!==undefined&&!['THB','MMK','USD','SGD'].includes(incoming.currency))throw Error('Invalid currency');if(!confirm('Restore this backup and replace the records currently stored on this device? If current records exist, Finance Master will first download a safety backup.'))return;if(backupHasRecords(previousState))exportData();const next={...incoming,currency:incoming.currency||'THB',transactions:incoming.transactions,loans:incoming.loans||[],debts:incoming.debts||[],savings:incoming.savings||[],budgets:incoming.budgets||[],payments:incoming.payments||[],payroll:incoming.payroll!==undefined?incoming.payroll:(previousState.payroll||{})};localStorage.setItem(KEY,JSON.stringify(next));state=next;const el=document.getElementById('saveStatus');if(el)el.textContent='● Restored and saved on this device';if(window.fmScheduleSync)window.fmScheduleSync(state);render();toast('Backup restored. Existing records were backed up first if present.')}catch(err){state=previousState;try{if(previousRaw===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,previousRaw)}catch(storageErr){}alert('Restore failed. Your previous records were kept. Check that the backup is a valid Finance Master JSON file and that device storage is available.')}};reader.onerror=()=>alert('Could not read the backup file. Your existing records were not changed.');reader.readAsText(file);e.target.value='';}
function resetData(){if(!confirm('Permanently delete ALL local Finance Master records on this device? If records exist, Finance Master will first download a safety backup.'))return;const previousState=state,previousRaw=localStorage.getItem(KEY);if(backupHasRecords(previousState))exportData();const next={currency:previousState.currency,transactions:[],loans:[],debts:[],savings:[],budgets:[],payments:[]};try{localStorage.setItem(KEY,JSON.stringify(next));state=next;if(window.fmScheduleSync)window.fmScheduleSync(state);render();toast('Local records reset. A safety backup was downloaded if records existed.')}catch(err){state=previousState;try{if(previousRaw===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,previousRaw)}catch(storageErr){}alert('Reset failed because device storage is unavailable. Your previous records were kept.')}}

let selectedBorrowerChatToken='',activeBorrowerChatStop=null,activeBorrowerChatMessages=[];
function borrowerMessagesPage(){
 const activeShares=(window.fmBorrowerCloud?.shares||[]).filter(sh=>sh.active);
 // One chat entry per person, even when the same borrower has several loan links.
 // Prefer a link already covering more loan accounts, without deleting or changing any share records.
 const borrowerKey=sh=>String(sh.borrowerName||'').trim().replace(/\\s+/g,' ').toLocaleLowerCase();
 const byBorrower=new Map();
 activeShares.forEach(sh=>{
  const key=borrowerKey(sh);
  if(!key)return;
  const existing=byBorrower.get(key);
  const accountCount=sh=>Array.isArray(sh.accountIds)&&sh.accountIds.length?sh.accountIds.length:(sh.accountId?1:0);
  if(!existing||accountCount(sh)>accountCount(existing))byBorrower.set(key,sh);
 });
 const shares=[...byBorrower.values()].sort((a,b)=>String(a.borrowerName||'').localeCompare(String(b.borrowerName||'')));
 if(!window.fmBorrowerCloud?.ready)return '<section class="panel chat-list-panel"><div class="chat-list-title"><b>Borrower Messages</b><p>Sign in as owner to chat with borrowers.</p></div><div class="empty">Sign in to Finance Master first.</div></section>';
 const selected=shares.find(sh=>sh.id===selectedBorrowerChatToken)||null;
 if(selected){
  return '<div class="chat-layout chat-only"><section class="panel chat-window"><div class="chat-window-head"><button type="button" class="chat-back chat-exit" onclick="closeBorrowerChat()" aria-label="Exit chat" title="Exit chat"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 18l-6-6 6-6M9 12h12M3 4v16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="chat-avatar">'+escapeHtml(String(selected.borrowerName||'?').trim().charAt(0).toUpperCase())+'</span><div class="chat-person-title"><b>'+escapeHtml(selected.borrowerName||'Borrower')+'</b><small>'+escapeHtml(selected.currency||'THB')+' · Private conversation</small></div></div><div id="borrowerChatMessages" class="chat-messages">'+(activeBorrowerChatMessages.length?activeBorrowerChatMessages.map(chatBubble).join(''):'<div class="empty">No messages yet. Send a message to begin.</div>')+'</div><form id="ownerChatForm" class="chat-compose"><textarea id="ownerChatText" rows="2" maxlength="3000" placeholder="Write a message…"></textarea><label class="chat-photo-button">＋ Photo<input id="ownerChatPhoto" type="file" accept="image/*" hidden></label><button class="primary" type="submit">Send</button></form><p class="sub">Photos are compressed before sending.</p></section></div>';
 }
 const list='<div class="chat-home-row"><button type="button" class="chat-home-button" onclick="go(\'Dashboard\')" aria-label="Go to Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5.5 9v11h13V9M9.5 20v-7h5v7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Home</span></button></div><section class="panel chat-list-panel"><div class="chat-list-title"><b>Borrowers</b><p>Select a name to open a private conversation.</p></div>'+(shares.length?shares.map(sh=>'<button class="chat-contact" data-chat-token="'+escapeHtml(sh.id)+'"><span class="chat-avatar">'+escapeHtml(String(sh.borrowerName||'?').trim().charAt(0).toUpperCase())+'</span><span class="chat-contact-text"><b>'+escapeHtml(sh.borrowerName||'Borrower')+'</b><small>'+escapeHtml(sh.currency||'THB')+' · Active link</small></span><span class="chat-chevron">›</span></button>').join(''):'<div class="empty">No active borrower links yet. Open Borrower Portal to create private links.</div>')+'</section>';
 return '<div class="chat-layout chat-list-only">'+list+'</div>';
}

 if(activeBorrowerChatStop){activeBorrowerChatStop();activeBorrowerChatStop=null;}

}

function chatBubble(m){const mine=m.senderRole==='owner',name=mine?'You':(m.senderName||'Borrower'),time=m.createdAtText||'',id=escapeHtml(m.id||''),hasPhoto=!!m.imageData,actions=(mine?'<button type="button" class="chat-edit-action" data-chat-edit="'+id+'" aria-label="Edit your message">✎ Edit</button>':'')+'<button type="button" class="danger chat-delete-action" data-chat-delete="'+id+'" aria-label="'+(hasPhoto?'Delete photo and message for both sides':'Delete message for both sides')+'" title="Remove for both Owner and Borrower">▤ Delete'+(hasPhoto?' photo':'')+'</button>';return '<div class="chat-line '+(mine?'mine':'theirs')+'"><div class="chat-bubble"><small>'+escapeHtml(name)+'</small>'+(m.text?'<p>'+escapeHtml(m.text).replace(/\n/g,'<br>')+'</p>':'')+(hasPhoto?'<a href="'+m.imageData+'" target="_blank" rel="noopener"><img class="chat-image" src="'+m.imageData+'" alt="Chat image"></a>':'')+(time?'<small class="chat-time">'+escapeHtml(time)+'</small>':'')+'<div class="chat-message-actions">'+actions+'</div></div></div>';}

function openBorrowerChat(token){selectedBorrowerChatToken=token;activeBorrowerChatMessages=[];if(activeBorrowerChatStop){activeBorrowerChatStop();activeBorrowerChatStop=null;}if(window.fmBorrowerCloud?.subscribeChat)activeBorrowerChatStop=window.fmBorrowerCloud.subscribeChat(token,messages=>{activeBorrowerChatMessages=messages;const box=document.getElementById('borrowerChatMessages');if(box){box.innerHTML=messages.length?messages.map(chatBubble).join(''):'<div class="empty">No messages yet. Send a message to begin.</div>';box.scrollTop=box.scrollHeight;}});render();}

 let viewer=document.getElementById('chatPhotoViewer');

async function compressChatImage(file){if(!file||!file.type.startsWith('image/'))throw new Error('Choose a photo image file.');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Could not read this photo. Try choosing it again.'));r.readAsDataURL(file);});const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error('This photo format is not supported by your browser. Try saving it as JPG and choose it again.'));i.src=data;});const scale=Math.min(1,1000/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Photo compression is not available on this device.');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let result='',quality=.72;for(let attempt=0;attempt<9;attempt++){result=canvas.toDataURL('image/jpeg',quality);if(result.length<=350000)break;if(quality>.3)quality-=.1;else{canvas.width=Math.max(1,Math.round(canvas.width*.8));canvas.height=Math.max(1,Math.round(canvas.height*.8));ctx.drawImage(img,0,0,canvas.width,canvas.height);quality=.5;}}if(result.length>400000)throw new Error('This photo is still too large. Please choose a smaller photo.');return result;}
async function submitOwnerChat(e){e.preventDefault();const api=window.fmBorrowerCloud,token=selectedBorrowerChatToken;if(!token||!api?.ready)return toast('Choose a borrower first.');const textValue=String(document.getElementById('ownerChatText')?.value||'').trim(),file=document.getElementById('ownerChatPhoto')?.files?.[0];if(!textValue&&!file)return toast('Write a message or choose a photo.');const button=e.target.querySelector('button[type="submit"]');if(button)button.disabled=true;toast(file?'Compressing photo and sending…':'Sending message…');try{const imageData=file?await compressChatImage(file):'';await api.sendChatMessage(token,{text:textValue,imageData});document.getElementById('ownerChatText').value='';document.getElementById('ownerChatPhoto').value='';}catch(err){toast('Message not sent: '+String(err?.message||err));}finally{if(button)button.disabled=false;}}
document.addEventListener('submit',e=>{if(e.target?.id==='ownerChatForm')submitOwnerChat(e);});
document.addEventListener('click',async e=>{const edit=e.target.closest('[data-chat-edit]'),del=e.target.closest('[data-chat-delete]');if(!edit&&!del)return;const token=selectedBorrowerChatToken,id=(edit||del).dataset[edit?'chatEdit':'chatDelete'],message=activeBorrowerChatMessages.find(m=>m.id===id);if(!token||!id||!message)return;try{if(edit){const value=prompt('Edit your message:',message.text||'');if(value===null)return;if(!value.trim()&&!message.imageData){toast('Message cannot be empty.');return;}await window.fmBorrowerCloud.editChatMessage(token,id,value.trim());toast('Message updated for both sides.');}else{if(!confirm('Delete this message for both Owner and Borrower? This cannot be undone.'))return;await window.fmBorrowerCloud.deleteChatMessage(token,id);toast('Message deleted for both sides.');}}catch(err){toast('Could not change message: '+String(err?.message||err));}});

function borrowerPortalPage(){
  const shares=window.fmBorrowerCloud?window.fmBorrowerCloud.shares:[];
  const requests=window.fmBorrowerCloud?window.fmBorrowerCloud.requests:[];
  const loans=state.loans||[];
  const borrowerKey=v=>String(v||'').trim().replace(/\\s+/g,' ').toLocaleLowerCase();
  // Display one Owner Portal card per borrower name. Prefer the existing active link
  // that already contains the most loan accounts; do not delete legacy links or data.
  const grouped=new Map();
  shares.slice().sort((a,b)=>Number(!!b.active)-Number(!!a.active)||
    ((Array.isArray(b.accountIds)?b.accountIds.length:1)-(Array.isArray(a.accountIds)?a.accountIds.length:1))||
    String(a.createdAt?.seconds||0).localeCompare(String(b.createdAt?.seconds||0))
  ).forEach(sh=>{
    const key=borrowerKey(sh.borrowerName);
    if(!key)return;
    const old=grouped.get(key);
    const count=x=>Array.isArray(x.accountIds)&&x.accountIds.length?x.accountIds.length:(Array.isArray(x.snapshot?.accounts)&&x.snapshot.accounts.length?x.snapshot.accounts.length:(x.accountId?1:0));
    if(!old || (sh.active&&!old.active) || (sh.active===old.active&&count(sh)>count(old)))grouped.set(key,sh);
  });
  const displayShares=[...grouped.values()].sort((a,b)=>String(a.borrowerName||'').localeCompare(String(b.borrowerName||'')));
  let html=pageHead('Borrower Portal','');
  html+='<section class="panel">';
  if(!window.fmBorrowerCloud||!window.fmBorrowerCloud.ready){html+='<div class="empty">Sign in to Finance Master to generate private links automatically.</div>';}
  else if(!loans.length){html+='<div class="empty">Add a loan account first.</div>';}
  html+='</section><section class="panel" style="margin-top:16px"><div class="panelhead"><div><h2>Borrower links by name</h2><p>One Share Link entry per borrower. Existing duplicate records are kept safely in the background.</p></div></div>';
  if(!window.fmBorrowerCloud||!window.fmBorrowerCloud.ready){html+='<div class="empty">Sign in to Finance Master to manage borrower links.</div>';}
  else if(!displayShares.length){html+='<div class="empty">No borrower links yet.</div>';}
  else{html+=displayShares.map(sh=>{
    const personLoans=loans.filter(l=>borrowerKey(l.person)===borrowerKey(sh.borrowerName));
    const chosenIds=Array.isArray(sh.accountIds)&&sh.accountIds.length?sh.accountIds:(Array.isArray(sh.snapshot?.accounts)?sh.snapshot.accounts.map(a=>a.accountId):[sh.accountId]);
    const linkedCount=personLoans.length?personLoans.length:chosenIds.filter(Boolean).length;
    const snapshot=sh.snapshot||{};
    const principal=personLoans.length?personLoans.reduce((sum,l)=>sum+Number(loanLedger('loan',l).principalOutstanding||0),0):Number(snapshot.principalOutstanding)||0;
    const interest=personLoans.length?personLoans.reduce((sum,l)=>sum+Number(loanLedger('loan',l).interestOutstanding||0),0):Number(snapshot.interestOutstanding)||0;
    const currency=sh.currency||(personLoans[0]&&recordCurrency(personLoans[0]))||'THB';
    return '<article class="borrower-link-card"><h3>'+escapeHtml(sh.borrowerName||'Borrower')+'</h3><p>'+escapeHtml(linkedCount+' linked loan(s)')+' · '+(sh.active?'<span class="tag approved">Active</span>':'<span class="tag out">Closed</span>')+'</p><p>Snapshot remaining: '+escapeHtml(fmt(principal,currency))+' principal · '+escapeHtml(fmt(interest,currency))+' interest</p><div class="borrower-link-actions">'+(sh.active?'<button class="primary" onclick="copyBorrowerLink(\\''+escapeHtml(sh.id)+'\\')">Copy private link</button><button class="pill" onclick="updateBorrowerShare(\\''+escapeHtml(sh.id)+'\\')">Update snapshot</button><button class="pill danger" onclick="toggleBorrowerShare(\\''+escapeHtml(sh.id)+'\\',false)">Close link</button>':'<button class="primary" onclick="toggleBorrowerShare(\\''+escapeHtml(sh.id)+'\\',true)">Open link</button>')+'<button class="pill danger" onclick="deleteBorrowerSharePermanently(\\''+escapeHtml(sh.id)+'\\')">Delete permanently</button></div></article>';
  }).join('');}
  html+='</section><section class="panel" style="margin-top:16px"><div class="panelhead"><div><h2>Payment requests & notifications</h2><p>Payment History changes only after owner approval.</p></div><span class="tag">'+requests.filter(r=>r.status==='pending').length+' pending</span></div>';
  if(!window.fmBorrowerCloud||!window.fmBorrowerCloud.ready){html+='<div class="empty">Sign in to receive notifications.</div>';}
  else if(!requests.length){html+='<div class="empty">No payment requests yet.</div>';}

function borrowerSnapshotForPerson(selectedLoan,selectedIds){

 return {...primary,person:selectedLoan.person||'',accounts,accountCount:accounts.length,interestBuckets:accounts.flatMap(a=>a.interestBuckets||[]),payments:accounts.flatMap(a=>a.payments||[])};

function borrowerSnapshotForShare(sh){

async function ensureBorrowerLinksForAll(){
 if(borrowerAutoCreateRunning||!window.fmBorrowerCloud?.ready)return;
 borrowerAutoCreateRunning=true;
 let updated=0,skipped=0;
 try{
  const loans=state.loans||[],allShares=window.fmBorrowerCloud.shares||[];
  const key=v=>String(v||'').trim().replace(/\\s+/g,' ').toLocaleLowerCase();
  const groups=new Map();
  for(const loan of loans){const k=key(loan.person);if(!k)continue;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(loan);}
  for(const group of groups.values()){
   if(group.some(l=>!recordCurrency(l))){skipped++;continue;}
   const ids=group.map(l=>l.id);
   const related=allShares.filter(sh=>sh.active&&key(sh.borrowerName)===key(group[0].person));
   if(!related.length)continue; // A manually deleted link must stay deleted; never recreate it automatically.
   const chosen=related.slice().sort((a,b)=>(Array.isArray(b.accountIds)?b.accountIds.length:1)-(Array.isArray(a.accountIds)?a.accountIds.length:1))[0];
   const snapshot=borrowerSnapshotForPerson(group[0],ids);
   const already=Array.isArray(chosen.accountIds)&&ids.every(id=>chosen.accountIds.includes(id))&&ids.length===chosen.accountIds.length;
   if(!already){try{await window.fmBorrowerCloud.updateShare(chosen.id,snapshot);updated++;}catch(e){console.error('Borrower link consolidation failed',chosen.borrowerName,e);}}
  }
  if(updated||skipped)status('Borrower links: '+updated+' updated'+(skipped?', '+skipped+' borrower(s) skipped (assign currency first)':'')+'.');
 }finally{borrowerAutoCreateRunning=false;}
}

 async revokeShare(token){if(!currentUser)throw new Error('Sign in required.');await updateDoc(doc(db,'borrowerShares',token),{active:false,revokedAt:serverTimestamp()});},
 async deleteRevokedShare(token){if(!currentUser)throw new Error('Sign in required.');const sh=borrowerShares.find(x=>x.id===token&&x.ownerUid===currentUser.uid);if(!sh)throw new Error('Link not found or not owned by this account.');if(sh.active)throw new Error('Close the link before deleting it.');await firestoreDeleteDoc(doc(db,'borrowerShares',token));},
 async deleteSharePermanently(token){if(!currentUser)throw new Error('Sign in required.');const sh=borrowerShares.find(x=>x.id===token&&x.ownerUid===currentUser.uid);if(!sh)throw new Error('Link not found or not owned by this account.');const messages=await getDocs(collection(db,'borrowerShares',token,'messages'));for(const msg of messages.docs){await firestoreDeleteDoc(doc(db,'borrowerShares',token,'messages',msg.id));}await firestoreDeleteDoc(doc(db,'borrowerShares',token));},
 subscribeChat(token,onMessages){if(!currentUser)throw new Error('Sign in required.');const sh=borrowerShares.find(x=>x.id===token&&x.ownerUid===currentUser.uid&&x.active);if(!sh)throw new Error('Active borrower link not found.');return onSnapshot(collection(db,'borrowerShares',token,'messages'),snap=>{const messages=snap.docs.map(d=>{const x=d.data();return {id:d.id,...x,createdAtText:borrowerTime(x.createdAt)};}).sort((a,b)=>Number(a.createdAt?.seconds||0)-Number(b.createdAt?.seconds||0));onMessages(messages);},e=>status('Chat could not load: '+e.message,true));},
 async sendChatMessage(token,{text='',imageData=''}){if(!currentUser)throw new Error('Sign in required.');const sh=borrowerShares.find(x=>x.id===token&&x.ownerUid===currentUser.uid&&x.active);if(!sh)throw new Error('Active borrower link not found.');if(!String(text).trim()&&!imageData)throw new Error('Message is empty.');await addDoc(collection(db,'borrowerShares',token,'messages'),{token,senderRole:'owner',senderName:'Owner',text:String(text).trim().slice(0,3000),imageData:imageData||'',createdAt:serverTimestamp()});},
 async editChatMessage(token,messageId,textValue){if(!currentUser)throw new Error('Sign in required.');const sh=borrowerShares.find(x=>x.id===token&&x.ownerUid===currentUser.uid&&x.active);if(!sh)throw new Error('Active borrower link not found.');await updateDoc(doc(db,'borrowerShares',token,'messages',messageId),{text:String(textValue).slice(0,3000)});},
 async deleteChatMessage(token,messageId){if(!currentUser)throw new Error('Sign in required.');const sh=borrowerShares.find(x=>x.id===token&&x.ownerUid===currentUser.uid&&x.active);if(!sh)throw new Error('Active borrower link not found.');await firestoreDeleteDoc(doc(db,'borrowerShares',token,'messages',messageId));},
 async deleteRequest(id){if(!currentUser)throw new Error('Sign in required.');if(!id)throw new Error('Missing payment request ID.');await firestoreDeleteDoc(doc(db,'borrowerPaymentRequests',id));},
 async setRequestStatus(id,statusValue,rejectionReason=''){if(!currentUser)throw new Error('Sign in required.');if(!['approved','rejected'].includes(statusValue))throw new Error('Invalid status');const patch={status:statusValue,reviewedAt:serverTimestamp(),reviewedBy:currentUser.uid};if(statusValue==='rejected')patch.rejectionReason=String(rejectionReason||'').trim().slice(0,500);await updateDoc(doc(db,'borrowerPaymentRequests',id),patch);},
 async sendPaymentDecisionMessage(token,req,statusValue,rejectionReason='',snapshot=null){if(!currentUser)throw new Error('Sign in required.');if(!token||!req?.id||!['approved','rejected'].includes(statusValue))throw new Error('Missing payment request details.');const sh=borrowerShares.find(x=>x.id===token&&x.ownerUid===currentUser.uid&&x.active);if(!sh)throw new Error('Active borrower link not found.');const messageId='payment-decision-'+req.id;const ref=doc(db,'borrowerShares',token,'messages',messageId);const existing=await getDoc(ref);if(existing.exists())return;const approved=statusValue==='approved';const amount=Number(req.amount)||0;const currency=req.currency||'THB';const date=req.date||'';const reason=String(rejectionReason||req.rejectionReason||'').trim();const balanceLine=approved&&snapshot?'\nRemaining principal: '+currency+' '+Number(snapshot.principalOutstanding||0).toLocaleString()+' · Remaining interest: '+currency+' '+Number(snapshot.interestOutstanding||0).toLocaleString():'';const textValue=approved?'✅ Payment request APPROVED / ငွေပေးချေမှုကို Owner လက်ခံအတည်ပြုပြီးပါပြီ။\nAmount: '+currency+' '+amount.toLocaleString()+' · Date: '+date+'\nThe payment has been added to the official loan records.'+balanceLine:'❌ Payment request REJECTED / ငွေပေးချေမှုတောင်းဆိုချက်ကို Owner ပယ်ချလိုက်ပါသည်။\nAmount: '+currency+' '+amount.toLocaleString()+' · Date: '+date+'\nThe loan balance was not changed.'+(reason?'\nOwner note: '+reason:'');await setDoc(ref,{token,senderRole:'system',senderName:'Finance Master',text:textValue.slice(0,3000),imageData:'',createdAt:serverTimestamp()});}
};

onAuthStateChanged(auth, user => {
  currentUser=user;
  if(syncTimer){clearTimeout(syncTimer);syncTimer=null;}
  localDirty=false;
  startCloudListener(user);
  startBorrowerListeners(isOwnerUser(user)?user:null);
  if(user && isOwnerUser(user)) status('Signed in as Owner '+user.email+'. Connecting private cloud sync…'+(authPersistenceReady?'':' Persistent login is blocked by this browser; avoid closing this browser tab.'));
   else if(user) status('Signed in as '+user.email+', but this is not the Owner Gmail. Owner finance data is hidden and unchanged.',true);
  else status('Not signed in. Create an account or sign in to enable cloud sync.'+(authPersistenceReady?'':' Persistent login is blocked by this browser. Open the site in Chrome and allow site storage.'));
  if(!user){window.fmSecurityState='signed-out';if(window.fmApp?.render)window.fmApp.render();}
  if(user){setTimeout(()=>{if(currentUser&&document.getElementById('crumbPage')?.textContent==='Borrower Portal'){ensureBorrowerLinksForAll();}},900);}
});
</script>

 });
 const reverse={en:{},my:{},th:{}};
 Object.keys(dict).forEach(lang=>Object.keys(dict[lang]).forEach(k=>reverse[lang][dict[lang][k]]=k));
 function getLang(){return localStorage.getItem(key)||'en';}
 function tr(text,lang){const t=text.replace(/\s+/g,' ').trim();if(!t)return text;let base=t;for(const l of Object.keys(reverse)){if(reverse[l][base]){base=reverse[l][base];break;}}const out=(dict[lang]&&dict[lang][base])||base;if(text===t)return out;return text.replace(t,out);}
 function apply(root){const lang=getLang();document.documentElement.lang=lang==='my'?'my':lang;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=walker.nextNode())){if(!n.parentElement||['SCRIPT','STYLE'].includes(n.parentElement.tagName))continue;const out=tr(n.nodeValue,lang);if(out!==n.nodeValue)n.nodeValue=out;}root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>['placeholder','title','aria-label'].forEach(a=>{const v=el.getAttribute(a);if(v){const out=tr(v,lang);if(out!==v)el.setAttribute(a,out);}}));root.querySelectorAll('option').forEach(el=>{if(el.closest('#languageSelect'))return;const v=el.textContent;const out=tr(v,lang);if(out!==v)el.textContent=out;});}
 function setup(){const sel=document.getElementById('languageSelect');if(sel){sel.value=getLang();sel.addEventListener('change',()=>{localStorage.setItem(key,sel.value);apply(document.body);});}apply(document.body);const ob=new MutationObserver(ms=>{for(const m of ms){if(m.type==='childList'){apply(m.target.nodeType===1?m.target:document.body);}else if(m.type==='characterData'){apply(m.target.parentElement||document.body);}}});ob.observe(document.body,{subtree:true,childList:true,characterData:true});}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup);else setup();
})();

 }
 window.toggleTheme=function(){
   const next=document.body.classList.contains('fm-dark')?'light':'dark';
   try{localStorage.setItem(key,next)}catch(e){}
   applyTheme();
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',applyTheme);else applyTheme();
